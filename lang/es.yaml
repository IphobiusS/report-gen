prose:
  confidentiality:
    - "Este documento contiene información propietaria y confidencial sobre los sistemas, aplicaciones y postura de seguridad de {client}. Está dirigido únicamente al personal autorizado a recibirlo. Los hallazgos, técnicas y evidencias que se describen podrían utilizarse para comprometer el entorno evaluado y deben manejarse en consecuencia."
    - "Ninguna parte de este informe puede distribuirse, copiarse ni divulgarse sin el consentimiento por escrito de {client}. Almacénelo solo en sistemas con controles de acceso apropiados para material de seguridad sensible y destruya cualquier copia que ya no sea necesaria."
  approach:
    - "{assessor} realizó una evaluación de seguridad sobre {client} durante la ventana acordada del engagement. El objetivo fue identificar vulnerabilidades que un atacante motivado pudiera explotar, demostrar su impacto mediante explotación controlada y entregar recomendaciones de remediación accionables."
    - "Las pruebas siguieron una metodología estructurada que abarca recopilación de información, enumeración de servicios, explotación, post explotación y limpieza. Cada hallazgo de este informe se verificó manualmente y se documenta con los pasos exactos para reproducirlo."
