prose:
  confidentiality:
    - "Este documento contém informações proprietárias e confidenciais sobre os sistemas, as aplicações e a postura de segurança de {client}. Destina-se exclusivamente ao pessoal autorizado a recebê-lo. Os achados, as técnicas e as evidências descritos podem ser utilizados para comprometer o ambiente avaliado e devem ser tratados de acordo com essa sensibilidade."
    - "Nenhuma parte deste relatório pode ser distribuída, copiada ou divulgada sem o consentimento por escrito de {client}. Armazene-o apenas em sistemas com controles de acesso adequados para material de segurança sensível e destrua as cópias que não forem mais necessárias."
  approach:
    - "Este relatório organiza as informações registradas sobre {client}, com {assessor} indicado como avaliador. Seu escopo, sua metodologia e seus resultados limitam-se ao que está documentado no relatório."
    - "Os achados podem ter diferentes estados de verificação. A inclusão neste relatório não comprova que um achado tenha sido reproduzido ou verificado manualmente. Cada registro deve ser lido junto com seu estado de verificação, suas evidências e suas limitações para determinar o que foi comprovado."
