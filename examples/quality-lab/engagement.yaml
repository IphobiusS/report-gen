report:
  sections:
  - key: executive_summary
    summary: |-
      Este informe es completamente ficticio. No representa hallazgos sobre una organización real. Sirve para comprobar contenido, navegación, imágenes y exportaciones.

      Se incluyen cuatro hallazgos y una máquina de laboratorio. Una valoración queda pendiente deliberadamente. La clasificación numérica no acredita una evaluación real.

      El caso conserva español, ñ, acentos y símbolos como <texto>, & y [corchetes].
  - key: alcance-auditoria
    title: Alcance y criterios de la simulación
    body: |-
      Todo el material es sintético. `portal.aurora.example` y `192.0.2.30` son identificadores de ejemplo.

      | Control | Resultado esperado |
      | --- | --- |
      | Contenido | Mismos hallazgos y evidencias en los cuatro formatos |
      | Privacidad | Exclusión de notas privadas y metadatos de imágenes |
      | Navegación | Índice válido y estructura legible |

      1. Guardar el proyecto.
      2. Exportar una revisión fija.
      3. Revisar los resultados.

      > La simulación valida el generador; no valida vulnerabilidades.
  - key: findings_summary
  - key: findings
