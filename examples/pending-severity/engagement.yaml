meta:
  lang: es
  theme: ejecutivo
  report_title: Comprobación de exportación
  report_subtitle: Datos ficticios para probar report-gen
  client: Caso sintético
  version: '1.0'
  assessor: Equipo de ejemplo
report:
  sections:
  - key: executive_summary
    summary: 'Este documento comprueba el tratamiento de hallazgos sin severidad asignada.
      Los datos son ficticios.


      | ID | Estado técnico | Resultado |

      | --- | --- | --- |

      | F01 | Confirmado en el ejemplo | La severidad sigue pendiente y el hallazgo
      debe permanecer visible en el resumen. |

      | F02 | Confirmado en el ejemplo | No se asigna una severidad informativa ni
      una puntuación cero como sustituto de la evaluación. |


      | Pista | Observación | Límite |

      | --- | --- | --- |

      | Preferencias | Descripción extensa utilizada para comprobar el reparto de
      columnas en ambos formatos. | Esta tabla no representa pruebas sobre un servicio
      real. |

      | Recuperación | Segundo texto de ejemplo para comprobar que las etiquetas mantienen
      una anchura legible. | La fuente no debe reescribirse al exportar. |'
  - key: findings_summary
  - key: findings
  - key: appendix
    tools_used: '**Bloque de código de ejemplo**


      ```python

      from hashlib import sha256


      value = b"synthetic evidence"

      print(sha256(value).hexdigest())

      ```


      El código es contenido documental. El exportador no lo ejecuta.'
findings:
- id: F01
  mode: vuln
  title: Primera comprobación ficticia
  verification: confirmed
  description_md: Registro ficticio confirmado para comprobar el resumen.
  impact_md: Impacto pendiente de valoración en este ejemplo.
  remediation_md: Documentar la evaluación antes de asignar severidad.
  walkthrough:
  - lead: Conservar el bloque
    text_md: El bloque debe mantenerse junto cuando cabe en una página.
    command: 'printf "%s\n" "EJEMPLO"

      printf "%s\n" "FIN DEL BLOQUE"'
- id: F02
  mode: vuln
  title: Segunda comprobación ficticia
  verification: confirmed
  description_md: Segundo registro sin severidad ni CVSS.
  impact_md: No se deduce una puntuación por la falta de clasificación.
  remediation_md: Completar la valoración cuando corresponda.
  walkthrough:
  - text_md: '```text

      PRIMERA LÍNEA

      LÍNEA INTERMEDIA

      ÚLTIMA LÍNEA

      ```'
