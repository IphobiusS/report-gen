meta:
  lang: es
  theme: corporativo
  report_title: Evaluación de seguridad
  report_subtitle: Atlas / Aplicación web y laboratorio técnico
  client: Atlas (organización ficticia)
  assessor: Sebastián Latorre Muñoz
  assessor_title: Muestra de diseño
  date: '2026-10-03'
  version: '1.0'
  branding:
    wordmark: iphobiuss
    byline: Muestra ficticia / report-gen
    confidential_text: DEMO
report:
  sections:
  - key: executive_summary
    summary: |-
      Este documento ficticio muestra la lectura de un informe ejecutivo y la reproducción de un procedimiento técnico. La prueba ilustra un fallo de autorización entre organizaciones.

      La prioridad propuesta es corregir la comprobación de pertenencia del objeto, revisar los endpoints equivalentes y repetir las pruebas con identidades de organizaciones diferentes.
  - key: scope
    objectives: Aplicación Atlas y máquina de laboratorio aislada. Objetivos y resultados completamente
      ficticios.
    assumptions: Se representa una evaluación autenticada con dos cuentas de prueba. No se han enviado
      peticiones a un sistema real.
  - key: findings_summary
  - key: findings
findings:
- id: F1
  title: Acceso a pedidos de otra organización
  mode: vuln
  severity: medium
  cvss: 5.4
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:N
  cwe: CWE-639
  affected: api.atlas.example
  description_md: El endpoint de pedidos no contrasta la organización del recurso con la identidad autenticada.
    La evidencia sintética compara dos cuentas con permisos equivalentes.
  impact_md: La demostración representa lectura y modificación limitada de pedidos ajenos. No se atribuye
    acceso a otras tablas ni control del servidor.
  remediation_md: Comprobar la pertenencia del objeto en el servidor antes de cada lectura o escritura.
    Añadir una prueba de regresión que espere 403 para la identidad de otra organización.
  walkthrough:
  - lead: Comprobar la autorización
    text_md: Usar dos cuentas de organizaciones diferentes y registrar la identidad de cada prueba. La
      petición siguiente es una muestra documental.
    command: |-
      GET /api/orders/101 HTTP/1.1
      Host: api.atlas.example
      Authorization: Bearer <CENSURADO>
    figure:
      src: img/evidence.png
      caption: Comparación sintética de identidad y recurso. No corresponde a un sistema real.
  references:
  - https://owasp.org/www-project-web-security-testing-guide/
- id: F2
  mode: machine
  title: Atlas-lab
  host:
    name: Atlas-lab
    ip: 192.0.2.10
    os: Linux
  open_ports: 22/tcp, 80/tcp (ficticios)
  summary_md: 'Cuaderno de laboratorio: reconocimiento, acceso documentado y verificación del resultado.
    La dirección pertenece al escenario de muestra.'
  phases:
  - name: Registro de contexto
    steps:
    - lead: Identificar la sesión
      text_md: En un ejercicio real se registra la identidad efectiva y el objetivo. Aquí solo se documentan
        los comandos de referencia.
      command: |-
        hostname
        id
        ip address show
  - name: Verificación y limpieza
    steps:
    - text_md: Relacionar cada resultado con su evidencia. Registrar los cambios realizados y su reversión;
        documentar expresamente lo que no se pudo comprobar.
  proof:
  - name: proof.txt
    value: DEMO-NO-ES-UNA-FLAG-REAL
