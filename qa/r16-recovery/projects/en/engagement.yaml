    text_md: Use an accelerated clock in a permission mock without privileged access to its host. Record grant,
      use, rejected extension, and expiry. The second reviewer attempts only the planned fictional read action.
      A successful mock result does not certify the configuration of a real identity provider or administrative
      platform.
