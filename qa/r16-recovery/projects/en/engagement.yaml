  summary_md: The second machine represents an isolated recovery coordinator. Its purpose is to check that restoration
    preserves both content and access decisions. Recovery-time objectives are not presented as measured results.
    The record distinguishes required components, owners who accept their state, and criteria that prevent the service
    from being reopened prematurely.
