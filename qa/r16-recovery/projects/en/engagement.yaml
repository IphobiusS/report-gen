  mode: vuln
  title: Support records containing session data beyond their purpose
  severity: low
  cwe: CWE-532
  verification: unverified
  status: reported_fixed
  description_md: The scenario support form accepts diagnostic responses as attachments. The hypothesis examines
    whether they contain reusable identifiers or unnecessary personal fields. Restricting ticket access reduces
    exposure, but does not make every captured field necessary or justify retaining it for the full lifetime of
    the support record.
  impact_md: Accumulated diagnostics could increase the number of people and systems exposed to sensitive information.
    This case contains no real secrets and does not demonstrate session theft. The low planning severity assumes
    fictional identifiers cannot authenticate; that assumption requires evidence before a real rating can be assigned.
  remediation_md: Define an allowlist of diagnostic fields and exclude others by default. Redact before creating
    the file rather than only at display time. Document retention, recipients, and deletion. The system should provide
    a useful failure summary without requiring the user to disclose a complete session or raw request history.
  closure_criteria_md: The final file must omit secret markers introduced solely for testing, including metadata
    and derived attachments. The error remains understandable. Permission review confirms that personnel without
    a support role cannot retrieve the file and that deletion covers the copies identified in the retention design.
