  description_md: The fictional catalog displays evidence name, date, and size but does not describe binding to
    immutable content. The hypothesis considers whether replacing a file under the same name could leave the case
    apparently unchanged. Provenance and integrity are distinct from a document merely remaining readable and visually
    plausible.
  impact_md: A reviewer could assess different bytes from those approved or lose the relationship between an observation
    and its evidence. This affects reproducibility and documentary confidence without demonstrating actual forgery.
    A hash alone does not establish who acquired the material or whether the acquisition procedure was appropriate.
  remediation_md: Bind each revision to a cryptographic digest, size, and recorded source while preserving previous
