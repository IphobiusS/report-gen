    copy, and presentation figure through verifiable relationships without promising authenticity beyond what the
    acquisition process can establish.
  closure_criteria_md: The test replaces a synthetic image with another of identical dimensions and filename. The
    case must detect a different revision and preserve its predecessor according to policy. Export and reimport
    retain the relationships. Content comparison must not depend on filesystem modification timestamps or visual
    similarity.
