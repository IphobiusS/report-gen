  phases:
  - name: Dependency manifest
    steps:
    - text_md: Record data, configuration, versions, and key references without copying secrets. Confirm that the
        manifest can reconstruct the same approved combination. A product name without a version is not compatibility
        evidence. Review also documents dependencies requiring human intervention and the method used to validate
        their origin.
  - name: Isolated restoration
    steps:
    - text_md: Restore under identifiers different from the original environment and keep external destinations
        disabled. Check file integrity and logical consistency separately. A working landing page does not establish
        that queues, documentary restrictions, or reconciliation have recovered their state, nor that the correct
        identity policy is active.
  - name: Reopening gate
    steps:
    - text_md: Require authorized reading, rejection of a revoked identity, preservation of a hold, and absence
        of duplicate entries. If a check is missing, the owner records the limitation and keeps the service outside
        the operational path. The business decision is documented separately from the technical outcome and is not
        attributed to the generator.
