- id: F08
  uid: c3687dff-9d2b-594f-80eb-da3b467dbc52
  mode: vuln
  title: Emergency administrative access without verifiable expiry
  severity: high
  cwe: CWE-269
  verification: unverified
  status: not_verified
  description_md: The example emergency procedure temporarily raises recovery permissions. Review must establish
    whether termination depends on someone remembering to remove access. Initial authorization and later withdrawal
    are separate decisions; closing a ticket does not establish that every session and derived credential has expired
    or lost its elevated scope.
  impact_md: Persistent emergency permission would expand the administrative surface beyond its approved window.
    The assumed risk combines excessive scope and weak attribution, not a demonstrated compromise. Prohibiting all
    emergency access without an alternative could remove recovery capability, so the fictional bank needs a constrained,
    rehearsed procedure.
  remediation_md: Grant temporary capabilities bound to an individual identity, reason, and maximum duration. Separate
    request, approval, and subsequent review. Enforce expiry technically across derived sessions, with an explicit
    extension process. Command recording requires secret filtering and restricted access rather than unrestricted
    publication of sensitive administrative activity.
  closure_criteria_md: The positive case permits the approved action during the window. After expiry, both a new
    session and an existing session fail according to the defined policy. An extension retains its reason and new
    approver. Subsequent review attributes actions to an individual without relying on a shared account.
  affected: jump.estuario.example
  owner: Administrative workstation / FICTIONAL / UNVERIFIED
  due_date: '2026-11-08'
