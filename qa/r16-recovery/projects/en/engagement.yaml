  phases:
  - name: Input contract
    steps:
    - text_md: Enumerate schema versions, required fields, and the meaning of each identifier. The contract must
        distinguish intent, attempt, and outcome. Review how incomplete messages are documented without publishing
        them or losing their operation relationship. Write the expected state before starting any local exercise.
  - name: Decision and concurrency
    steps:
    - text_md: Connect F01, F02, and F10 to receipt, revocation, and retry sequences. Two simultaneous messages
        cannot be treated as independent tests when they modify the same state. Review prepares a known event order
        and requires an explanation for each decision, including a decision left pending.
  - name: Reconciliation and observability
    steps:
    - text_md: Compare the numbers of intents, entries, and retrievable responses. Any difference must be explained
        by a documented state rather than a missing record. The operator must distinguish delay from failure without
        accessing secrets. A synthetic correlation table is retained for independent cross-review and reconciliation.
  - name: Rollback and laboratory closure
    steps:
    - text_md: Remove mock messages and accounts, retain only the result manifest, and verify that no automatic
        tasks remain. Cleanup is a planned step, not a claim that access occurred. Every later exercise starts from
        a new state so earlier results cannot be attributed to the current revision.
