- id: F09
  uid: 29f8df26-d3aa-5d96-941f-9a4c07cc517c
  mode: vuln
  title: Amounts and currencies normalized differently across components
  severity: medium
  cwe: CWE-20
  verification: unverified
  status: open
  description_md: The portal displays locally formatted amounts while the queue uses a decimal interchange representation.
    The hypothesis reviews ambiguous conversion, precision, and the relationship between currency and amount. A
    value that looks correct on screen may represent a different quantity when another component applies different
    separator or rounding rules.
  impact_md: 'Inconsistent rejections or differences between approval and ledger entry could result. Deliberate
    manipulation is not assumed: a legitimate locale setting could also trigger the hypothesized defect. Spanish,
    English, and Portuguese presentation must preserve the same logical value even when separators and currency
    symbol placement differ.'
  remediation_md: Define a canonical interchange representation with mandatory currency and permitted precision.
    Separate display formatting from the business value and reject ambiguity before authorization. Rounding must
    be explicit and occur once at the agreed stage, with testable rules for adjustments and refunds rather than
    incidental component behavior.
  closure_criteria_md: Acceptance covers zero, the smallest fraction, the allowed maximum, and excessive precision.
    Each language produces the same canonical value and the same rejection where appropriate. An empty string never
    becomes zero. Missing currency must prevent a decision rather than silently inheriting a global default.
  affected: payments.estuario.example
  owner: Payment API / FICTIONAL / UNVERIFIED
