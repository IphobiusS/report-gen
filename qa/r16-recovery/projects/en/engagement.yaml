  mode: vuln
  title: Segregation of duties that omits chained delegations
  severity: medium
  verification: unverified
  status: open
  description_md: The fictional matrix prohibits one account from requesting and approving a payment. Temporary
    delegations are nevertheless stored as independent roles. The hypothesis asks whether one person can accumulate
    both capabilities through different accounts or delegation chains even though each isolated check appears to
    satisfy the rule.
  impact_md: 'The dual-review control could become a formality without effective independence. Consequences depend
    on identity policy and amount controls. No fraud is attributed to any person: the concern is a property of the
    authorization model and the evidence required to demonstrate actual separation rather than two different account
    names.'
  remediation_md: Resolve effective capabilities by person and context, including delegations and exceptions. Validate
    conflicts when granting access and when approving an operation. Exceptions require expiry and independent review.
    Keep a queryable representation so the owner can explain why a capability combination is permitted or rejected.
  closure_criteria_md: Tests include two distinct people, two accounts belonging to one person, and a second-level
    delegation. Only the first satisfies ordinary independence. A documented exception remains in history after
    expiry. Removing a delegation updates the effective decision without requiring every account to be recreated
    or manually relabeled.
