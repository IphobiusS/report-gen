- id: F07
  uid: 93956a2c-ef57-5402-9632-76a6d709f5b3
  mode: vuln
  title: Recovery that restores data without restoring restrictions
  severity: high
  verification: unverified
  status: reported_fixed
  description_md: The fictional platform checks that a backup contains readable files, but its plan omits permissions,
    keys, queues, and documentary holds. The hypothesis challenges the equivalence between recovering bytes and
    recovering a secure service. A partial restoration can retain data while silently changing who is allowed to
    use it.
  impact_md: The restored service might grant excessive access, lose current restrictions, or execute tasks already
    completed. Apparent continuity would conceal authorization and accounting differences. This does not assert
    that the backup is corrupt; the assumed weakness lies in the recovery contract and what its acceptance test
    considers sufficient.
  remediation_md: Define a recovery unit covering data, configuration, identities, key references, and processing
    position. Make dependencies and startup order explicit. Run access and reconciliation checks before reopening
    the service. Documentation must identify what cannot be restored automatically and who decides how those gaps
    are handled.
  closure_criteria_md: Acceptance requires an authorized read, rejection of a revoked identity, preservation of
    a hold, and no duplicates after queue processing resumes. Compare logical state before and after, not hashes
    alone. Record measured duration and recovered position rather than substituting the desired business recovery
    objectives.
  affected: recovery-controller.estuario.example
  owner: Recovery orchestrator / FICTIONAL / UNVERIFIED
  due_date: '2026-11-07'
