- id: F03
  uid: 5378b788-8eb3-58d3-854b-d4622c909210
  mode: vuln
  title: Incomplete revocation across interactive sessions and deferred tasks
  severity: high
  cwe: CWE-613
  verification: unverified
  status: reported_fixed
  description_md: Removing a user closes the visible session, but the model also includes derived credentials for
    reports and deferred payments. Review must establish how revocation reaches each consumer and which tolerance
    period is approved. A signed-out screen does not describe the authority retained by existing background jobs.
  impact_md: 'A job might continue reading documents or preparing operations after permission is removed. Exposure
    depends on credential lifetime and granted scope. This does not assert that revocation must cancel every task:
    policy must distinguish previously committed obligations from new decisions that require current authority and
    an active mandate.'
  remediation_md: Inventory credentials and consumers, then define a measurable maximum propagation time. Bind tasks
    to an identity and reviewable policy with a safe route to cancellation or authorized transfer. Restrict derived
    credential scope and avoid treating the interface session as the only source of revocation information.
  closure_criteria_md: Record a consumer matrix with revocation time, rejection time, and any authorized exception.
    New decisions must be blocked within the agreed period. Continuing obligations identify their basis and owner.
    No consumer may be excluded merely because it lacks its own user interface or uses a background service identity.
  affected: identity.estuario.example
  owner: Identity provider / FICTIONAL / UNVERIFIED
  due_date: '2026-11-03'
  asset_uids:
  - 8f013aa3-64cb-551b-be10-a5a17291d40f
  evidence_uids: []
  root_cause_uid: e7ed1ba1-326f-560b-86cc-62748520f673
  walkthrough:
  - lead: Proposed procedure, not executed
    text_md: Prepare a fictional timeline using a controlled clock, nonfunctional credentials, and three local consumers.
      Change permission between acceptance and execution. Record the expected outcome for each job type, including
      obligations that should continue. Do not reuse real tokens to test behavior in the mock environment.
  references:
  - https://docs.estuario.example/evidence/registro#ação-ñ-über-العربية-हिन्दी-한국어-日本語
  reported_remediation: 'Simulated status: the script includes a reported change, but no actual correction or technical
    retest exists.'
- id: F04
  uid: 6465ff0e-165c-56b5-a8dd-c4daad3e6de6
  mode: vuln
  title: Document lookup with ambiguous business ownership
  severity: medium
  cwe: CWE-639
  verification: unverified
  status: not_verified
  description_md: The portal retrieves documents associated with both a company and a contract. The model stores
    these identifiers separately, so the hypothesis examines whether their relationship is checked before release.
    Verifying that a user belongs to some company does not establish ownership of the particular document requested.
  impact_md: The potential consequence is cross-company reading of one example document, without inferring modification
    or general archive access. A temporary download link might extend access after the lookup ends. Review must
    therefore cover both search authorization and the delivery mechanism, including its audience and lifetime.
  remediation_md: Resolve the resource within the set of companies authorized for the identity instead of trusting
    client-supplied identifiers. Bind temporary links to an appropriate purpose and expiry. Keep error behavior
    consistent so unauthorized callers cannot distinguish documents belonging to other organizations through existence
    information.
  closure_criteria_md: The test must cross two companies, two contracts, and two roles while retaining a permitted
    case. Unauthorized combinations release neither content nor usable links. Expiry is checked after copying the
    address into a new session. Audit records retain the rejection reason without storing the entire document.
  affected: portal.estuario.example
  owner: Corporate portal / FICTIONAL / UNVERIFIED
  due_date: '2026-11-04'
  asset_uids:
  - 8d0c12ea-495a-5550-86d0-678f6d75f957
  evidence_uids: []
  root_cause_uid: e7ed1ba1-326f-560b-86cc-62748520f673
  walkthrough:
  - lead: Proposed procedure, not executed
    text_md: Create text documents containing only their synthetic labels. Prepare an ownership table before querying
      the simulator. Inspect the body, headers, and returned link as three separate outcomes. An empty response
      is not considered safe if it still contains an address that can deliver the file.
  references:
  - https://docs.estuario.example/validation/payment-authorisation-and-settlement-consistency/2026-10-13/tenant-0123456789abcdef0123456789abcdef?case=ESTUARIO-R16&locale=pt-BR&control=mandate%2Drevocation#acceptance
- id: F05
  uid: b1ea8af5-a4cf-5cbf-b005-1da7661f1bcc
  mode: vuln
  title: Document retention without separation from access control
  severity: medium
  cwe: CWE-922
  verification: unverified
  status: open
  description_md: A scenario rule retains documents for an extended period while a removal flag hides their portal
    entry. Review must establish whether that flag changes object authorization or only visibility. Retaining a
    file for documentary purposes does not imply that every old access link should remain usable throughout retention.
  impact_md: The assumed risk is persistent access to material no longer available to an operational role. Premature
    deletion is not an appropriate solution either because it could violate the scenario custody requirements. The
    correct decision separates retention, restriction of ordinary use, and exceptional access subject to independent
    review.
  remediation_md: Represent retention state separately from access state. Invalidate issued links when their authorizing
    condition changes while keeping the bytes under custody controls. Exceptional retrieval requires purpose, owner,
    recording, and a deadline. The storage system must not infer these conditions solely from an object path.
  closure_criteria_md: Demonstrate that the retained document remains intact, the previous role can no longer retrieve
    it, and authorized exceptional access leaves a distinct record. Restoring from backup must preserve restrictions.
    A file that becomes broadly accessible after restoration fails the criterion even when the backup bytes are
    intact.
  affected: archive.estuario.example
  owner: Document archive / FICTIONAL / UNVERIFIED
  due_date: '2026-11-05'
  asset_uids:
  - bc85275e-a94f-5a00-a178-a5f054fb3487
  evidence_uids: []
  root_cause_uid: 294c8d3b-269e-5b8a-8681-b0bcefcd2901
  walkthrough:
  - lead: Proposed procedure, not executed
    text_md: Use three invented objects with different dates and a retention policy written for the exercise. Change
      access state only, check read paths, and repeat after a local restoration. Compare permissions and content
      independently so a matching content hash cannot conceal an authorization regression.
  references:
  - https://docs.estuario.example/recovery/manifest?revision=sha256%3A0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&component=identity%2Dpolicy#revisão-açaí
- id: F06
  uid: e5013c62-b016-53ff-8e50-03ec9c468095
  mode: vuln
  title: Fragmented traceability between authorization, queue, and ledger
  severity: medium
  cwe: CWE-778
  verification: unverified
  status: in_progress
  description_md: Synthetic events use different identifiers in the API, worker, and ledger. The hypothesis asks
    whether correlation depends on time and amount, values that can repeat. A large volume of logs does not guarantee
    reconstruction of a particular decision or distinguish a legitimate repeated instruction from a duplicate execution.
  impact_md: An investigation could attribute an entry to the wrong authorization or incorrectly conclude that an
    operation is missing. The proposed impact is reduced confidence in reconstruction rather than a demonstrated
    intrusion. Adding unrestricted personal data as compensation would create another exposure without necessarily
    establishing the causal relationship.
  remediation_md: Propagate one stable intent identifier and a separate attempt identifier with explicit event relationships.
    Define minimum fields, clocks, provenance, and integrity requirements. Record decision changes and trust boundaries
    without including secrets. Dropped events need a controlled signal so their absence cannot be mistaken for successful
    completion.
  closure_criteria_md: A reviewer who did not prepare the case reconstructs three concurrent operations of the same
    amount, including one cancellation. The reviewer must identify attempt, decision, and entry without guessing
    from time proximity. Missing events and clock skew must appear as explicit uncertainty rather than a complete-looking
    chain.
  affected: events.estuario.example
  owner: Event collector / FICTIONAL / UNVERIFIED
  due_date: '2026-11-06'
  asset_uids:
  - 33161c9a-4057-54ec-965d-8be01bf01816
  evidence_uids: []
  root_cause_uid: c2681607-36f3-5452-b928-7d569a323b7e
  walkthrough:
  - lead: Proposed procedure, not executed
    text_md: Generate a small set of fictional JSON events and shuffle their order. Give only the records to the
      second reviewer, then compare the reconstruction with the withheld script. Count resolved, ambiguous, and
      absent relationships separately. Do not use a large line count as a measure of audit quality.
  references:
