- id: F02
  uid: 88fb730a-f259-5f51-9f83-46a99ac09d7e
  mode: vuln
  title: Settlement retry without a stable business identity
  severity: high
  cwe: CWE-837
  verification: unverified
  status: in_progress
  description_md: The scenario allows a request to receive a new identifier after its acknowledgement is lost. Review
    must determine whether deduplication uses that transport identifier or a key bound to customer intent. Two different
    messages could represent exactly the same instruction rather than two legitimate payments.
  impact_md: 'The hypothetical consequence is a duplicate ledger entry or costly manual reconciliation. Financial
    loss is not assumed automatically because downstream controls matter. Partial unavailability increases ambiguity:
    a customer may repeat an operation whose response was lost even though the server completed the original processing.'
  remediation_md: Maintain a business idempotency key with defined scope, expiry, and payload comparison. Record
    acceptance and a recoverable result atomically. Reusing a key with different content must produce an explicit
    conflict. Retention must cover the documented maximum retry and recovery window rather than an arbitrary short
    cache lifetime.
  closure_criteria_md: The matrix must cover an immediate retry, retry after restart, out-of-order arrival, and
    the same key with another amount. Each permitted intent produces exactly one entry. A conflicting request leaves
    the original entry unchanged. Result lookup lets the customer distinguish pending, completed, and rejected without
    guessing.
  affected: settlement-worker.estuario.example
  owner: Settlement worker / FICTIONAL / UNVERIFIED
  due_date: '2026-11-02'
  asset_uids:
  - 4089b161-ae91-5de3-8ea9-e9b214709b6f
  evidence_uids: []
  root_cause_uid: 294c8d3b-269e-5b8a-8681-b0bcefcd2901
  walkthrough:
