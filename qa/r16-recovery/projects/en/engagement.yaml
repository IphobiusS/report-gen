    text_md: Use an in-memory ledger and a simulated transport able to drop acknowledgements. Enumerate event sequences
      before the exercise without generating real traffic. Compare the number of intents with the number of entries
      and preserve identifiers. A test that only returns a duplicate response does not establish atomic recording.
  references:
  - https://docs.estuario.example/recovery/manifest?revision=sha256%3A0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&component=identity%2Dpolicy#revisão-açaí
