- id: F06
  uid: e5013c62-b016-53ff-8e50-03ec9c468095
  mode: vuln
  title: Rastreabilidade fragmentada entre autorização, fila e lançamento
  severity: medium
  cwe: CWE-778
  verification: unverified
  status: in_progress
  description_md: Os eventos sintéticos usam identificadores diferentes na API, no trabalhador e no livro contábil.
    A hipótese considera que a correlação depende de horário e valor, que podem se repetir. Um grande volume de
    registros não garante reconstruir uma decisão específica nem distinguir uma repetição legítima de uma execução
    duplicada.
  impact_md: Uma investigação poderia atribuir um lançamento à autorização errada ou concluir incorretamente que
    uma operação está ausente. O impacto proposto é a perda de confiança na reconstrução, não uma intrusão demonstrada.
    Acrescentar dados pessoais indiscriminadamente criaria outra exposição sem necessariamente estabelecer a relação
    causal.
  remediation_md: Propagar um identificador estável de intenção e outro de tentativa, com relações explícitas entre
    eventos. Definir campos mínimos, relógios, procedência e integridade. Registrar mudanças de decisão e limites
    de confiança sem incluir segredos. Eventos descartados precisam de uma sinalização controlada para que a ausência
    não pareça sucesso.
  closure_criteria_md: Um revisor que não preparou o caso reconstrói três operações simultâneas do mesmo valor,
    incluindo um cancelamento. Ele deve identificar tentativa, decisão e lançamento sem inferir por proximidade
    temporal. A perda de um evento e o desvio de relógio devem aparecer como incerteza explícita, não como uma cadeia
    completa.
  affected: events.estuario.example
  owner: Coletor de eventos / FICTÍCIO / NÃO VERIFICADO
