- id: F13
  uid: 6ada26b7-f4e4-5ef3-8635-db2363afffef
  mode: vuln
  title: Segregação de funções que não considera delegações encadeadas
  severity: medium
  verification: unverified
  status: open
  description_md: A matriz fictícia impede que uma mesma conta solicite e aprove um pagamento. Entretanto, as delegações
    temporárias são registradas como papéis independentes. A hipótese pergunta se uma pessoa pode reunir as duas
    capacidades por contas diferentes ou cadeias de delegação, mesmo quando cada verificação isolada parece correta.
  impact_md: 'O controle de dupla revisão poderia se tornar uma formalidade sem independência efetiva. As consequências
    dependem da política de identidades e dos controles de valor. Não se atribui fraude a ninguém: examina-se uma
    propriedade do modelo de autorização e a evidência necessária para demonstrar separação real.'
  remediation_md: Resolver as capacidades efetivas por pessoa e contexto, incluindo delegações e exceções. Validar
    incompatibilidades na concessão de acesso e na aprovação da operação. Exceções exigem validade e revisão independente.
    Manter uma representação consultável para explicar por que determinada combinação de capacidades é permitida
    ou rejeitada.
  closure_criteria_md: Os testes incluem duas pessoas distintas, duas contas da mesma pessoa e uma delegação de
    segundo nível. Somente o primeiro caso atende à independência comum. Uma exceção documentada permanece no histórico
    após expirar. Remover uma delegação atualiza a decisão efetiva sem exigir a recriação de todas as contas.
  affected: identity.estuario.example
  owner: Provedor de identidade / FICTÍCIO / NÃO VERIFICADO
