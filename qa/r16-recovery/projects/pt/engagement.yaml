- id: F07
  uid: 93956a2c-ef57-5402-9632-76a6d709f5b3
  mode: vuln
  title: Recuperação que restaura dados sem restabelecer restrições
  severity: high
  verification: unverified
  status: reported_fixed
  description_md: A plataforma fictícia verifica se a cópia contém arquivos legíveis, mas o planejamento não inclui
    permissões, chaves, filas e bloqueios documentais. A hipótese questiona a equivalência entre recuperar bytes
    e recuperar um serviço seguro. Uma restauração parcial pode preservar os dados enquanto altera silenciosamente
    quem pode utilizá-los.
  impact_md: O serviço recuperado poderia conceder acesso excessivo, perder restrições vigentes ou executar tarefas
    já concluídas. A continuidade aparente esconderia diferenças de autorização e contabilidade. Não se afirma que
    a cópia esteja corrompida; a fragilidade presumida está no contrato de recuperação e nos critérios considerados
    suficientes.
  remediation_md: Definir uma unidade de recuperação que inclua dados, configuração, identidades, referências a
    chaves e posição de processamento. Explicitar dependências e ordem de inicialização. Executar controles de acesso
    e conciliação antes de reabrir o serviço. A documentação deve indicar o que não pode ser restaurado automaticamente
    e quem decide seu tratamento.
  closure_criteria_md: A aceitação exige leitura autorizada, rejeição de uma identidade revogada, preservação de
    um bloqueio e ausência de duplicações após retomar a fila. Comparar o estado lógico antes e depois, não apenas
    hashes. Registrar a duração medida e o ponto recuperado, sem substituí-los pelos objetivos comerciais desejados.
  affected: recovery-controller.estuario.example
