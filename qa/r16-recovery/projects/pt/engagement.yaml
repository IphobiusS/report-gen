- id: F02
  uid: 88fb730a-f259-5f51-9f83-46a99ac09d7e
  mode: vuln
  title: Nova tentativa de liquidação sem identidade de negócio estável
  severity: high
  cwe: CWE-837
  verification: unverified
  status: in_progress
  description_md: O cenário permite que uma solicitação receba um identificador novo após a perda da confirmação.
    É necessário investigar se a deduplicação usa esse identificador de transporte ou uma chave ligada à intenção
    do cliente. Duas mensagens distintas poderiam representar a mesma ordem, e não dois pagamentos legítimos.
  impact_md: 'A consequência hipotética é um lançamento duplicado ou uma conciliação manual onerosa. Não se presume
    perda financeira automática, pois os controles posteriores influenciam o resultado. A indisponibilidade parcial
    aumenta a ambiguidade: o cliente pode repetir uma operação cuja resposta não recebeu, embora o servidor já a
    tenha processado.'
  remediation_md: Manter uma chave de idempotência de negócio com escopo, validade e comparação de conteúdo definidos.
    Registrar atomicamente a aceitação e um resultado recuperável. A reutilização da chave com conteúdo diferente
    deve produzir um conflito explícito. A retenção deve cobrir a janela máxima documentada de novas tentativas
    e recuperação.
  closure_criteria_md: A matriz deve incluir repetição imediata, repetição após reinício, chegada fora de ordem
    e a mesma chave com outro valor. Cada intenção permitida produz um único lançamento. Uma solicitação conflitante
    não altera o lançamento original. A consulta permite distinguir pendente, concluído e rejeitado sem adivinhação.
  affected: settlement-worker.estuario.example
  owner: Trabalhador de liquidação / FICTÍCIO / NÃO VERIFICADO
