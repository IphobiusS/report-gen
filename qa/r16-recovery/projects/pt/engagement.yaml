    text_md: Construir um grafo local de identidades com nomes inventados e capacidades não operacionais. Revisar
      manualmente as combinações antes de consultar o avaliador. Comparar a explicação da decisão, não apenas seu
      valor booleano final. O grafo é um modelo de política, não um inventário de funcionários de um banco.
