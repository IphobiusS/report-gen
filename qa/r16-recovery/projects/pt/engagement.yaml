  closure_criteria_md: O arquivo final deve omitir os marcadores de segredo introduzidos somente para o teste, inclusive
    metadados e anexos derivados. A mensagem de erro continua compreensível. A revisão de permissões confirma que
    pessoas sem função de suporte não obtêm o arquivo e que a exclusão abrange as cópias previstas.
