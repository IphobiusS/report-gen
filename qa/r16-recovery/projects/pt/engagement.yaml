- id: F05
  uid: b1ea8af5-a4cf-5cbf-b005-1da7661f1bcc
  mode: vuln
  title: Retenção documental sem separação do controle de acesso
  severity: medium
  cwe: CWE-922
  verification: unverified
  status: open
  description_md: Uma regra do cenário conserva documentos por um período extenso, enquanto uma marca de remoção
    oculta a entrada no portal. É necessário verificar se essa marca altera a autorização do objeto ou apenas sua
    visibilidade. Reter um arquivo por obrigação documental não significa manter todos os links antigos utilizáveis.
  impact_md: O risco presumido é o acesso persistente a material que já não deveria estar disponível para um papel
    operacional. A exclusão precipitada também não seria adequada, pois poderia violar os requisitos de custódia
    do cenário. A decisão deve separar retenção, bloqueio do uso comum e acesso excepcional sujeito à revisão.
  remediation_md: Representar o estado de retenção separadamente do estado de acesso. Invalidar links emitidos quando
    a condição que os autorizava mudar, mantendo os bytes sob controles de custódia. A recuperação excepcional exige
    finalidade, responsável, registro e prazo. O armazenamento não deve inferir essas condições apenas pelo caminho
    do objeto.
  closure_criteria_md: Demonstrar que o documento retido permanece íntegro, que o papel anterior já não consegue
    obtê-lo e que o acesso excepcional autorizado gera um registro distinto. A restauração deve preservar as restrições.
    Um arquivo que volta a ficar amplamente acessível após a restauração não atende ao critério.
  affected: archive.estuario.example
  owner: Arquivo documental / FICTÍCIO / NÃO VERIFICADO
