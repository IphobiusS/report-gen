  phases:
  - name: Manifesto de dependências
    steps:
    - text_md: Registrar dados, configuração, versões e referências de chaves sem copiar segredos. Confirmar que
        o manifesto permite reconstruir a mesma combinação aprovada. Um nome de produto sem versão não comprova
        compatibilidade. A revisão também documenta dependências que exigem intervenção humana e o método de validação
        de sua origem.
  - name: Restauração isolada
    steps:
    - text_md: Restaurar sob identificadores diferentes dos originais e manter destinos externos desabilitados.
        Verificar separadamente a integridade dos arquivos e a consistência lógica. Uma página inicial funcionando
        não comprova a recuperação do estado das filas, das restrições documentais ou da conciliação, nem a aplicação
        da política correta de identidade.
  - name: Critério de reabertura
    steps:
    - text_md: Exigir leitura autorizada, rejeição de identidade revogada, preservação de bloqueio e ausência de
        lançamentos duplicados. Se faltar uma verificação, o responsável registra a limitação e mantém o serviço
        fora da rota operacional. A decisão de negócio é documentada separadamente do resultado técnico e não é
        atribuída ao gerador.
  proof:
  - name: synthetic-proof.txt
    value: ESTUARIO_R16_NOT_A_CAPTURED_FLAG_2
    notes: FICTÍCIO / NÃO VERIFICADO
