- id: F10
  uid: 85bcdc50-d927-55a9-b1a7-69521009bde6
  mode: vuln
  title: Mensagem não interpretável tratada como operação concluída
  severity: medium
  cwe: CWE-754
  verification: unverified
  status: in_progress
  description_md: O consumidor fictício distingue erros de negócio e erros de leitura, mas ambos podem terminar
    com uma confirmação de recebimento. É necessário estabelecer se a mensagem não interpretável preserva um estado
    visível e recuperável. O transporte pode funcionar corretamente enquanto a operação desaparece do acompanhamento
    de negócio.
  impact_md: Uma ordem poderia ficar sem resultado e sem alerta acionável. Reprocessar indiscriminadamente a fila
    também seria inseguro, pois operações válidas poderiam ser duplicadas. A consequência hipotética é incerteza
    de estado e trabalho de conciliação, não prova de perda financeira ou de corrupção de todo o serviço.
  remediation_md: Separar recebimento, interpretação, decisão e resultado final. Mensagens ilegíveis devem preservar
    um identificador, uma causa delimitada e uma rota controlada de revisão. Evitar ciclos ilimitados de novas tentativas.
    A reintrodução exige validar a versão do esquema e manter a identidade de negócio para aplicar a proteção contra
    duplicações.
  closure_criteria_md: Uma versão desconhecida, um campo obrigatório ausente e um valor inválido permanecem pendentes
    com motivos distintos. Mensagens válidas continuam sendo processadas. Após a correção, somente um revisor autorizado
    pode reintroduzir a mensagem, e o histórico conecta as tentativas. Nenhum resultado de transporte é apresentado
    como liquidação confirmada.
  affected: settlement-worker.estuario.example
  owner: Trabalhador de liquidação / FICTÍCIO / NÃO VERIFICADO
