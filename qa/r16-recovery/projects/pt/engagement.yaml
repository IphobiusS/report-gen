- id: F04
  uid: 6465ff0e-165c-56b5-a8dd-c4daad3e6de6
  mode: vuln
  title: Consulta de documentos com vínculo empresarial ambíguo
  severity: medium
  cwe: CWE-639
  verification: unverified
  status: not_verified
  description_md: O portal consulta documentos associados a uma empresa e a um contrato. O modelo armazena esses
    identificadores separadamente, e a hipótese verifica se a relação é validada antes da entrega. Confirmar que
    o usuário pertence a alguma empresa não comprova o vínculo do documento específico solicitado.
  impact_md: A consequência potencial é a leitura cruzada de um documento do exemplo, sem deduzir alteração ou acesso
    geral ao arquivo. Um link temporário de download poderia prolongar o acesso após a consulta. A análise precisa
    abranger a autorização da pesquisa e o mecanismo de entrega, inclusive público e validade.
  remediation_md: Resolver o recurso dentro do conjunto de empresas autorizado para a identidade, sem confiar nos
    identificadores fornecidos pelo cliente. Vincular links temporários a propósito e expiração adequados. Manter
    respostas de erro consistentes para que usuários não autorizados não descubram a existência de documentos de
    outras organizações.
  closure_criteria_md: O teste deve cruzar duas empresas, dois contratos e dois papéis, preservando um caso permitido.
    As combinações alheias não entregam conteúdo nem links funcionais. A expiração também é verificada após copiar
    o endereço para uma nova sessão. O registro preserva o motivo da rejeição sem armazenar o documento inteiro.
  affected: portal.estuario.example
  owner: Portal empresarial / FICTÍCIO / NÃO VERIFICADO
