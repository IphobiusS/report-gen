- id: M1
  uid: 42526c27-a68b-51cf-b526-71bcb93ecff8
  mode: machine
  title: Caderno de validação do trabalhador de liquidação
  host:
    name: settlement-worker.estuario.example
    ip: 192.0.2.44
    os: Sistema Linux fictício
  open_ports: 443/tcp, 8443/tcp / FICTÍCIO / NÃO VERIFICADO
  summary_md: Esta ficha descreve um servidor fictício de processamento assíncrono. Não documenta acesso inicial,
    escalada nem controle de um sistema real. Seu objetivo é relacionar as decisões de autorização ao recebimento
    de mensagens e ao resultado contábil. As portas são dados do roteiro, não resultados de um scanner. As fases
    seguem dependências de validação, e sua presença no gráfico não significa que foram executadas.
  status: not_verified
  verification: unverified
  asset_uids:
  - 4089b161-ae91-5de3-8ea9-e9b214709b6f
  evidence_uids: []
  phases:
  - name: Contrato de entrada
    steps:
    - text_md: Enumerar versões de esquema, campos obrigatórios e significado de cada identificador. O contrato
        deve distinguir intenção, tentativa e resultado. Revisar como mensagens incompletas são documentadas sem
        publicá-las nem perder sua relação com a operação. O estado esperado é escrito antes de iniciar qualquer
        ensaio local.
  - name: Decisão e concorrência
    steps:
    - text_md: Relacionar F01, F02 e F10 com sequências de recebimento, revogação e nova tentativa. Duas mensagens
        simultâneas não podem ser avaliadas como testes independentes quando alteram o mesmo estado. A revisão prepara
        uma ordem conhecida de eventos e exige uma explicação para cada decisão, inclusive a que permanece pendente.
  - name: Conciliação e observabilidade
    steps:
    - text_md: Comparar a quantidade de intenções, lançamentos e respostas recuperáveis. Qualquer diferença deve
        ser explicada por um estado documentado, nunca por um registro desaparecido. O operador precisa distinguir
        atraso de falha sem acessar segredos. Uma tabela sintética de correlação é preservada para revisão independente
        e conciliação.
  - name: Reversão e encerramento do laboratório
    steps:
    - text_md: Remover mensagens e contas da simulação, preservar apenas o manifesto de resultados e verificar se
        não restaram tarefas automáticas. A limpeza é uma etapa prevista, não uma afirmação de acesso. Cada ensaio
        posterior começa em um estado novo para não atribuir resultados anteriores à revisão atual.
  proof:
  - name: synthetic-proof.txt
    value: ESTUARIO_R16_NOT_A_CAPTURED_FLAG_1
    notes: FICTÍCIO / NÃO VERIFICADO
- id: M2
