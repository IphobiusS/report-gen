- id: F14
  uid: af709c14-9362-55a6-80d9-29f02afd8054
  mode: vuln
  title: Mensagens de erro que revelam estados internos de documentos alheios
  severity: low
  cwe: CWE-200
  verification: unverified
  status: in_progress
  description_md: O portal do cenário retorna mensagens diferentes para um documento inexistente, retido ou associado
    a outra empresa. A hipótese limita-se a informações de existência e estado, sem presumir acesso ao conteúdo.
    As diferenças podem ocorrer no texto, código, tamanho ou tempo; revisar apenas a tradução visível seria insuficiente.
  impact_md: Um usuário poderia inferir a existência de uma relação contratual ou de um expediente sem conseguir
    baixá-lo. A sensibilidade depende do contexto e da previsibilidade do identificador. Operadores autorizados
    ainda precisam da causa real; o desenho exige respostas externas prudentes e diagnósticos internos com acesso
    controlado.
  remediation_md: Definir um contrato de erro uniforme para usuários sem autorização sobre o objeto. Separar o código
    de diagnóstico interno da mensagem externa por um identificador de correlação. As traduções devem preservar
    o significado sem nomes ou caminhos interpolados que reintroduzam a informação que deveria ser protegida.
  closure_criteria_md: Em espanhol, inglês e português, os três casos não autorizados devem apresentar resultados
    equivalentes segundo o contrato. O suporte autorizado recupera a causa por correlação. O teste não exige tempos
    irrealisticamente idênticos; exige que diferenças relevantes sejam medidas e avaliadas dentro do contexto e
    do modelo de ameaça acordados.
  affected: portal.estuario.example
  owner: Portal empresarial / FICTÍCIO / NÃO VERIFICADO
