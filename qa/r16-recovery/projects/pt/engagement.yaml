- id: F03
  uid: 5378b788-8eb3-58d3-854b-d4622c909210
  mode: vuln
  title: Revogação incompleta entre sessões interativas e tarefas adiadas
  severity: high
  cwe: CWE-613
  verification: unverified
  status: reported_fixed
  description_md: A remoção de um usuário encerra sua sessão visível, mas o modelo inclui credenciais derivadas
    para relatórios e pagamentos adiados. É necessário determinar como a revogação chega a cada consumidor e qual
    período de tolerância foi aprovado. Uma tela de sessão encerrada não descreve a autoridade dos trabalhos existentes.
  impact_md: 'Um trabalho poderia continuar lendo documentos ou preparando operações depois da retirada da permissão.
    A exposição depende da duração da credencial e do escopo concedido. Isso não significa que toda tarefa deva
    ser cancelada: a política precisa distinguir obrigações já assumidas de novas decisões que exigem autoridade
    vigente.'
  remediation_md: Inventariar credenciais e consumidores e definir um prazo máximo mensurável de propagação. Vincular
    tarefas a uma identidade e a uma política revisável, com cancelamento seguro ou transferência autorizada. Restringir
    o escopo das credenciais derivadas e evitar que a sessão da interface seja a única fonte de revogação.
  closure_criteria_md: Registrar uma matriz de consumidores com momento da revogação, momento da rejeição e eventual
    exceção autorizada. Novas decisões devem ser bloqueadas dentro do prazo acordado. As obrigações que continuam
    precisam identificar seu fundamento e responsável. Nenhum consumidor pode ficar fora por não possuir uma interface
    de usuário própria.
  affected: identity.estuario.example
