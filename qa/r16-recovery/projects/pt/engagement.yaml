- id: F09
  uid: 29f8df26-d3aa-5d96-941f-9a4c07cc517c
  mode: vuln
  title: Valores e moedas normalizados de forma diferente entre componentes
  severity: medium
  cwe: CWE-20
  verification: unverified
  status: open
  description_md: O portal mostra valores com formato local, enquanto a fila usa uma representação decimal de intercâmbio.
    A hipótese examina conversões ambíguas, precisão e vínculo entre moeda e valor. Um valor aparentemente correto
    na tela pode representar outra quantia quando um componente aplica regras diferentes de separadores ou arredondamento.
  impact_md: 'Poderiam ocorrer rejeições inconsistentes ou diferenças entre aprovação e lançamento. Não se presume
    manipulação intencional: uma configuração regional legítima também poderia acionar o defeito hipotético. A apresentação
    em espanhol, inglês ou português deve preservar o mesmo valor lógico, mesmo com separadores e posições de símbolo
    diferentes.'
  remediation_md: Definir uma representação canônica de intercâmbio com moeda obrigatória e precisão permitida.
    Separar o formato de exibição do valor de negócio e rejeitar ambiguidades antes da autorização. O arredondamento
    deve ser explícito e ocorrer uma única vez na etapa acordada, com regras verificáveis para ajustes e devoluções.
  closure_criteria_md: A aceitação inclui zero, fração mínima, máximo permitido e precisão excessiva. Cada idioma
    produz o mesmo valor canônico e a mesma rejeição quando aplicável. Uma cadeia vazia nunca se transforma em zero.
    A ausência de moeda deve impedir a decisão, sem herdar silenciosamente um valor global.
  affected: payments.estuario.example
  owner: API de pagamentos / FICTÍCIO / NÃO VERIFICADO
  due_date: '2026-11-09'
  asset_uids:
