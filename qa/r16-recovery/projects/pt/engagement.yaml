- id: F15
  uid: 0b0cd3b0-96ec-5bba-8ede-d1ac5480f39a
  mode: vuln
  title: Dependência de recuperação sem versão ou procedência verificável
  severity: medium
  verification: unverified
  status: reported_fixed
  description_md: O manifesto fictício identifica a aplicação principal, mas referencia ferramentas auxiliares por
    um download denominado latest. A hipótese questiona se o mesmo plano recria o mesmo ambiente meses depois. Uma
    cópia de dados íntegra pode ser inutilizável se a ferramenta necessária para interpretá-la mudar ou deixar de
    existir.
  impact_md: A recuperação poderia depender de decisões improvisadas durante uma interrupção. O impacto presumido
    é a incerteza operacional e a possível incompatibilidade, não evidência de um pacote malicioso. Fixar uma versão
    sem acompanhar sua manutenção é insuficiente; reprodutibilidade e atualização segura devem ser necessidades
    complementares.
  remediation_md: Registrar versão, origem, resumo criptográfico, licença e função de cada dependência necessária.
    Manter uma rota autorizada de obtenção e um teste de compatibilidade com as cópias. Atualizações exigem avaliação
    e renovação do manifesto; não devem surgir inesperadamente durante uma restauração urgente, com revisão e reversão
    limitadas.
  closure_criteria_md: Duas reconstruções isoladas devem identificar exatamente as mesmas dependências aprovadas.
    Uma alteração dos bytes é detectada antes da execução. O teste também demonstra a rejeição de uma versão incompatível
    e a renovação do conjunto aprovado. A reprodutibilidade histórica não deve exigir o uso operacional contínuo
    de versões vulneráveis.
