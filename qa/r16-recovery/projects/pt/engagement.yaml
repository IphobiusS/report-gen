- id: F11
  uid: ce3a86bb-d418-585c-a09e-4e09bfcc2ed0
  mode: vuln
  title: Registros de suporte com dados de sessão além de sua finalidade
  severity: low
  cwe: CWE-532
  verification: unverified
  status: reported_fixed
  description_md: O formulário de suporte do cenário aceita respostas de diagnóstico como anexos. A hipótese examina
    se elas contêm identificadores reutilizáveis ou campos pessoais desnecessários. Restringir o acesso ao chamado
    reduz a exposição, mas não torna necessário todo dado capturado nem justifica retê-lo durante todo o ciclo de
    vida do chamado.
  impact_md: O acúmulo de diagnósticos poderia ampliar o número de pessoas e sistemas com acesso a informações sensíveis.
    O caso não contém segredos reais nem demonstra roubo de sessão. A severidade baixa presume que os identificadores
    fictícios não autenticam; essa premissa precisa de evidência antes de uma classificação real.
  remediation_md: Definir uma lista de campos permitidos para diagnóstico e excluir os demais por padrão. Aplicar
    a ocultação antes de criar o arquivo, não apenas na exibição. Documentar retenção, destinatários e exclusão.
