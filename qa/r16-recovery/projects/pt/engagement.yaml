report:
  sections:
  - key: confidentiality
    body: Material sintético preparado para exercitar um gerador de relatórios. Não contém informações de clientes,
      achados reais, credenciais operacionais nem autorização para realizar testes. O caso pode ser revisado e reutilizado
      mantendo seu caráter fictício.
  - key: document_control
    version_history:
    - version: R16.1
      date: '2026-10-13'
      author: report-gen QA
      notes: FICTÍCIO / NÃO VERIFICADO
    distribution: Revisão do gerador; não é distribuição bancária.
  - key: contacts
  - key: executive_summary
    summary: 'O Banco Estuário é uma instituição fictícia criada exclusivamente para exercitar o report-gen. Este
      documento não comprova um teste de intrusão, uma certificação bancária, uma aceitação de risco nem a eficácia
      de controles em uma organização real. Todos os ativos usam faixas de endereços de documentação ou o domínio
      reservado example. As imagens mostram modelos desenhados, não capturas de sistemas examinados. Os estados
      de acompanhamento pertencem a um roteiro simulado; a verificação técnica permanece pendente para as dezesseis
      observações.


      O cenário reúne serviços bancários empresariais, uma plataforma de pagamentos, um serviço de custódia documental
      e uma plataforma de recuperação. A premissa é uma separação imperfeita entre identidade, autorização e execução
      assíncrona. Uma permissão válida na solicitação pode deixar de ser válida antes de o trabalhador processar
      a operação. Da mesma forma, confirmar o recebimento não comprova a liquidação, e armazenar uma cópia de segurança
      não comprova a capacidade de restaurar o serviço.


      A direção deve priorizar decisões irreversíveis: quem pode solicitar uma transferência, qual autoridade permanece
      associada a uma operação enfileirada e como interromper uma execução anômala sem duplicá-la. A segunda prioridade
      é a rastreabilidade para investigação, preservando informações suficientes para relacionar autorização, mensagem,
      lançamento contábil e documento. A terceira é demonstrar recuperação com dependências e responsáveis concretos.
      As prioridades propostas pertencem ao cenário e não derivam de medições em produção.


      São registradas dezesseis hipóteses de fragilidade e duas fichas de máquinas. As severidades são premissas
      de planejamento, não classificações observadas; a ausência de pontuações CVSS é intencional porque seus fatores
      não foram medidos. O documento distingue uma promessa de correção, um teste executado e a evidência necessária
      para concluir. Nenhum item é encerrado apenas pela alteração de seu estado no editor. As datas planejadas
      não representam resultados nem compromissos de uma instituição real.


      A recomendação executiva é aprovar uma sequência de validação com responsáveis diferentes pela implementação
      e pela revisão. Antes de aceitar uma correção, é necessário demonstrar o comportamento permitido, a rejeição
      esperada e a ausência de efeitos adversos na conciliação e no suporte. Um ensaio limitado à resposta HTTP
      deixa sem resposta as mensagens enfileiradas, as novas tentativas e as tarefas administrativas. O escopo deve
      acompanhar a operação até seu resultado de negócio.


      Este relatório também exercita o gerador com títulos longos, tabelas contendo parágrafos, citações e listas
      aninhadas, endereços extensos, caracteres portugueses e rótulos multilíngues. A qualidade documental é avaliada
      separadamente da ficção de segurança. Uma exportação visualmente correta não comprova as hipóteses; um aviso
      intencional de preparação não demonstra um defeito no exportador. A auditoria anexa registra as duas categorias
      separadamente, com evidências observáveis e limites explícitos.'
  - key: scope
    objectives: 'O perímetro documental contém oito ativos sintéticos: portal empresarial, API de pagamentos, provedor
      de identidade, trabalhador de liquidação, arquivo documental, coletor de eventos, orquestrador de cópias e
      estação de acesso administrativo. A rede 192.0.2.0/24 e os nomes estuario.example identificam somente o exemplo.
      Nenhum destino foi contatado e nenhum comando de reconhecimento foi executado. Cada ficha de máquina é um
      caderno de validação preparado para um futuro laboratório isolado.


      Redes de cartões, sistemas de terceiros, clientes reais, testes de disponibilidade, engenharia social e qualquer
      transferência de recursos estão fora do escopo. Também não se afirma conformidade regulatória: citar uma família
      de controles não substitui a análise de requisitos, jurisdição e evidências. A correspondência com CWE orienta
      a revisão técnica e não transforma uma hipótese em vulnerabilidade confirmada.


      O roteiro considera três identidades fictícias: solicitante, aprovador e operador de recuperação. Cada identidade
      precisa de uma conta permitida e outra deliberadamente não autorizada. Os dados são gerados do zero e removidos
      ao terminar o exercício. O registro preserva identificadores de correlação, nunca senhas, chaves privadas,
      sessões reutilizáveis ou informações de clientes. Uma execução futura exigirá autorização por escrito e uma
      janela acordada; este pacote não autoriza testes contra nenhum sistema.


      Um ensaio seria interrompido caso surgissem dados alheios, degradação inesperada, acesso fora da matriz acordada
      ou divergências contábeis não controladas. O analista registraria o momento, o identificador da operação e
      a decisão de pausa sem ampliar o acesso. O responsável pelo laboratório decidiria sobre a retomada. Essas
      condições fazem parte do desenho do caso e não descrevem um incidente ocorrido.'
    assumptions: Sem acesso à produção; sem tráfego aos destinos; sem validação técnica de vulnerabilidades.
  - key: methodology
    approach: 'A avaliação proposta começa com contratos observáveis. Para cada operação são registrados o solicitante,
      o aprovador, o recurso alterado e o momento em que a autorização é decidida. Em seguida são definidos os resultados
      permitidos e rejeitados. O conjunto mínimo inclui casos positivos, negativos, novas tentativas e expiração;
      uma única rejeição não comprova um desenho seguro. A evidência deve identificar uma revisão concreta de código
      e configuração.


      As hipóteses seriam comparadas primeiro com modelos locais, depois com serviços sintéticos e finalmente com
      um ambiente autorizado que represente as dependências relevantes. A sequência reduz a incerteza sem tratar
      uma simulação como produção. Quando uma dependência não puder ser representada, a limitação permanecerá visível
      e o resultado continuará pendente. Uma captura mostrando a configuração desejada não substitui a verificação
      do comportamento efetivo.


      Cada observação apresenta uma condição prévia, uma consequência delimitada e critérios mensuráveis de encerramento.
      Dois revisores participam quando a decisão altera permissões ou lançamentos contábeis. Um prepara o estado
      inicial e o outro verifica o resultado e sua reversão. Os identificadores permanecem estáveis entre idiomas
      para comparar exportações; a tradução modifica a redação, nunca os ativos, as relações ou a interpretação
      do resultado.


      A qualidade documental é avaliada pela ordem das seções, pelos rótulos e destinos dos links, pelas tabelas
      e pelas legendas. Uma quebra de página razoável não é um erro; texto cortado, números de sumário isolados,
      linhas omitidas e destinos alterados são defeitos. A comparação inclui uma URL com fragmento Unicode e outras
      com hífens codificados. O documento não insere caracteres invisíveis para forçar a quebra de linha.


      Os registros de reteste anexos descrevem sessões de planejamento, não testes de infraestrutura bancária. O
      resultado registrado permanece não verificável enquanto não houver execução autorizada. As tabelas aninhadas
      têm duas finalidades: especificar controles de aceitação e exercitar a paginação do gerador. Cada linha deve
      continuar compreensível sem confundir o rótulo do controle com o resultado, inclusive quando a tabela passar
      para outra página.'
  - key: findings_summary
  - key: findings
  - key: remediation_plan
    overview: 'A primeira etapa transforma as hipóteses de autorização, idempotência e recuperação em contratos
      revisáveis. O responsável por pagamentos define quais decisões são irrevogáveis, e o responsável por identidade
      identifica os eventos que invalidam um mandato. A equipe de plataforma prepara simuladores com relógio controlado
      e dados inventados. O resultado é uma matriz de comportamento esperado, não uma lista de chamados encerrados.


      A segunda etapa implementa mudanças pequenas e verificáveis. Cada mudança declara dependências, mensagens
      existentes que podem ser afetadas e uma forma de reversão. Uma alteração na semântica da fila exige um plano
      de convivência com versões anteriores. A revisão deve perguntar o que acontece durante a implantação, não
      apenas como se comporta o estado final desejado após a substituição de todos os componentes.


      A terceira etapa verifica de maneira independente as correções comunicadas. O revisor recebe dados sintéticos,
      versões da aplicação e da configuração, contrato de aceitação e limites conhecidos. Resultados positivos e
      negativos são registrados com a mesma precisão. Quando uma condição não puder ser reproduzida, o revisor informa
      o que falta e por quê, sem substituir a ausência de teste por um resultado satisfatório.


      A última etapa trata manutenção e recuperação. Os controles aceitos passam a integrar uma bateria de regressão
      com responsáveis e limites definidos. A restauração é ensaiada sem conectar destinos reais, a preservação
      das restrições é revisada e o procedimento é executado por alguém que não o escreveu. As exceções têm data
      de revisão e uma decisão empresarial separada.


      As métricas propostas incluem tempo até uma decisão explicável, proporção de operações com correlação completa,
      duplicações detectadas antes do lançamento e controles de recuperação demonstrados. Volume de código, volume
      de eventos e quantidade de achados não substituem qualidade. O acompanhamento deve apresentar denominadores
      e exclusões para que uma melhoria aparente não esconda uma redução do escopo ou uma mudança na definição de
      sucesso.


      A entrega documental prevista para 13 de novembro não significa que as correções estejam concluídas. Os prazos
      posteriores pertencem ao acompanhamento do cenário, não a compromissos de uma instituição real.'
  - key: contratos-de-exportacion
    title: Apêndice técnico de endereços extensos, rótulos multilíngues e preservação de referências entre formatos
      de relatório
    body: 'Os endereços abaixo são referências documentais reservadas. Seu texto e destino devem permanecer exatos;
      não são consultados e não comprovam fontes externas. Os identificadores longos exercitam a quebra de linha
      sem acrescentar espaços ou caracteres invisíveis ao conteúdo.


      | Referência | Finalidade | Endereço literal |

      | --- | --- | --- |

      | R01 | Vincular a decisão à versão do mandato. | <https://docs.estuario.example/validation/payment-authorisation-and-settlement-consistency/2026-10-13/tenant-0123456789abcdef0123456789abcdef?case=ESTUARIO-R16&locale=pt-BR&control=mandate%2Drevocation#acceptance>
      |

      | R02 | Relacionar recuperação e restrições preservadas. | <https://docs.estuario.example/recovery/manifest?revision=sha256%3A0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&component=identity%2Dpolicy#revisão-açaí>
      |


      [Contrato de autorização e liquidação](https://docs.estuario.example/validation/payment-authorisation-and-settlement-consistency/2026-10-13/tenant-0123456789abcdef0123456789abcdef?case=ESTUARIO-R16&locale=pt-BR&control=mandate%2Drevocation#acceptance)


      <https://docs.estuario.example/validation/payment-authorisation-and-settlement-consistency/2026-10-13/tenant-0123456789abcdef0123456789abcdef?case=ESTUARIO-R16&locale=pt-BR&control=mandate%2Drevocation#acceptance>


      [Restauração, revisão e açaí](https://docs.estuario.example/recovery/manifest?revision=sha256%3A0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&component=identity%2Dpolicy#revisão-açaí)


      <https://docs.estuario.example/recovery/manifest?revision=sha256%3A0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&component=identity%2Dpolicy#revisão-açaí>


      [Registro multilíngue: ação, acción, العربية, हिन्दी, 한국어, 日本語](https://docs.estuario.example/evidence/registro#ação-ñ-über-العربية-हिन्दी-한국어-日本語)


      <https://docs.estuario.example/evidence/registro#ação-ñ-über-العربية-हिन्दी-한국어-日本語>


      ```text

      ESTUARIO_R16_TECHNICAL_IDENTIFIER_0123456789ABCDEF_0123456789ABCDEF_0123456789ABCDEF

      Literal: & <sample> &#x00; [brackets] `backticks`

      Português: ação, revisão, proteção, João, São Luís, açaí.

      ```

      '
  - key: appendix
    tools_used: O report-gen gera os quatro formatos, e código local desenha diagramas sintéticos. Nenhuma ferramenta
      de teste de intrusão foi executada. Os valores de prova das máquinas são marcadores fictícios, não flags obtidas.
  workflow:
    include_assets: true
    include_coverage: true
    include_retest: true
    include_root_causes: true
findings:
- id: F01
  uid: 4f75a819-3617-5eb9-be63-0ce5e99496bd
  mode: vuln
  title: Autorização de pagamentos separada da decisão de execução
  severity: high
  cwe: CWE-862
  verification: unverified
  status: open
  description_md: A API do modelo armazena uma autorização ao aceitar a solicitação, e o trabalhador a utiliza depois.
    A hipótese considera que uma mudança de titularidade, limite ou mandato talvez não seja consultada novamente.
    É necessário distinguir os fatos fixados na aprovação das condições que devem permanecer válidas na execução.
  impact_md: Uma decisão obsoleta poderia permitir um movimento que o aprovador já não tem autoridade para solicitar.
    O alcance presumido limita-se à operação enfileirada; não se deduz acesso a outras contas. A conciliação poderia
    detectar a diferença apenas quando a reversão já exigisse um processo separado.
  remediation_md: Definir uma política explícita de validade e vincular a autorização à conta, ao valor, ao beneficiário
    e à versão do mandato. O consumidor deve aplicar essa política antes de criar o lançamento. A ausência de informações
    deve produzir uma decisão pendente rastreável, sem transformar uma consulta malsucedida em permissão.
  closure_criteria_md: A revisão deve mostrar uma operação válida, outra com mandato revogado e outra com limites
    alterados. As duas últimas não podem gerar lançamento. O registro deve explicar a rejeição e preservar o identificador
    original. Uma nova tentativa também não deve reutilizar silenciosamente a autoridade anterior.
  affected: payments.estuario.example
  owner: API de pagamentos / FICTÍCIO / NÃO VERIFICADO
