- id: F16
  uid: a1836300-1e7e-574d-a137-84d27e3d60ec
  mode: vuln
  title: Critérios de encerramento que confundem mudança comunicada com verificação
  severity: info
  verification: unverified
  status: not_verified
  description_md: 'O fluxo administrativo do exemplo registra que uma equipe implantou uma correção. A hipótese
    documental é apresentar essa comunicação como uma verificação independente. São fatos diferentes: a implementação
    pode existir e ainda falhar no caso original, em um caso equivalente ou em uma dependência fora da mudança.'
  impact_md: A direção poderia interpretar a redução de achados abertos como uma redução comprovada de risco. Não
    há impacto técnico nem pontuação CVSS atribuída, pois a questão é de processo e qualidade do relatório. O objetivo
    é mostrar precisamente o que foi comunicado, o que foi testado e o que permanece pendente.
  remediation_md: Manter campos separados para acompanhamento, verificação técnica e resultado do reteste. Exigir
    data, escopo e evidência antes de comunicar encerramento verificado. Exceções e impossibilidade de teste permanecem
    visíveis e não se transformam automaticamente em aceitação de risco. O responsável pelo negócio decide a aceitação
    em um processo separado.
  closure_criteria_md: Uma correção comunicada sem reteste aparece como pendente de verificação na visualização
    e na exportação. Um reteste inconclusivo não encerra o achado. Um registro sem data permanece visível sem se
    tornar o último resultado datado. O relatório deve explicar essas diferenças e preservar o histórico original.
