  mode: machine
  title: Caderno de restauração e preservação de restrições
  host:
    name: recovery-controller.estuario.example
    ip: 192.0.2.47
    os: Sistema Linux fictício
  open_ports: 443/tcp, 8443/tcp / FICTÍCIO / NÃO VERIFICADO
  summary_md: A segunda máquina representa um coordenador de recuperação isolado. O objetivo é verificar se a restauração
    preserva tanto o conteúdo quanto as decisões de acesso. Metas de tempo de recuperação não são apresentadas como
    resultados medidos. A ficha distingue componentes necessários, responsáveis pela aceitação e critérios que impedem
    a reabertura prematura do serviço.
  status: not_verified
  verification: unverified
  asset_uids:
