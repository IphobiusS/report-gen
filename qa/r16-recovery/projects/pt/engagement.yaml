- id: F12
  uid: 750a92a3-a372-52da-978a-2fbc5033140d
  mode: vuln
  title: Integridade do expediente baseada apenas no nome do arquivo
  severity: medium
  cwe: CWE-345
  verification: unverified
  status: not_verified
  description_md: O catálogo fictício mostra nome, data e tamanho de cada evidência, mas não descreve um vínculo
    com conteúdo imutável. A hipótese considera que substituir um arquivo mantendo o nome poderia deixar o expediente
    aparentemente inalterado. Procedência e integridade são propriedades diferentes da simples legibilidade do documento.
  impact_md: Um revisor poderia avaliar bytes diferentes dos aprovados ou perder a relação entre observação e evidência.
    Isso afetaria a reprodutibilidade e a confiança documental sem demonstrar falsificação efetiva. Um hash isolado
    não comprova quem obteve o material nem se o procedimento de aquisição foi adequado.
  remediation_md: Vincular cada revisão a um resumo criptográfico, tamanho e origem registrada, preservando versões
    anteriores quando o conteúdo mudar. A substituição deve ser explícita e justificada. Distinguir evidência original,
    cópia sanitizada e figura de apresentação por relações verificáveis, sem prometer autenticidade além do que
    o processo pode comprovar.
  closure_criteria_md: O teste substitui uma imagem sintética por outra com as mesmas dimensões e nome. O expediente
    deve detectar uma revisão diferente e preservar a anterior conforme a política. Exportar e importar novamente
    preserva as relações. A comparação de conteúdo não depende da data de modificação do sistema de arquivos.
  affected: archive.estuario.example
  owner: Arquivo documental / FICTÍCIO / NÃO VERIFICADO
