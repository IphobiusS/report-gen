- id: F08
  uid: c3687dff-9d2b-594f-80eb-da3b467dbc52
  mode: vuln
  title: Acesso administrativo de emergência sem expiração verificável
  severity: high
  cwe: CWE-269
  verification: unverified
  status: not_verified
  description_md: O procedimento de emergência do exemplo eleva temporariamente permissões de recuperação. É necessário
    verificar se o encerramento depende de alguém lembrar de retirar o acesso. A autorização inicial e a retirada
    são decisões distintas; encerrar um chamado não comprova que todas as sessões e credenciais derivadas expiraram.
  impact_md: Uma permissão emergencial persistente ampliaria a superfície administrativa além da janela aprovada.
    O risco presumido combina escopo excessivo e atribuição fraca, não um comprometimento demonstrado. Proibir todo
    acesso emergencial sem alternativa poderia impedir a recuperação; por isso, é necessário um procedimento limitado
    e ensaiado.
  remediation_md: Conceder capacidades temporárias ligadas à identidade individual, ao motivo e à duração máxima.
    Separar solicitação, aprovação e revisão posterior. Aplicar a expiração tecnicamente às sessões derivadas, com
    um processo explícito de extensão. O registro de comandos exige filtragem de segredos e acesso restrito, não
    publicação indiscriminada.
  closure_criteria_md: O caso positivo permite a ação aprovada durante a janela. Após o vencimento, uma sessão nova
    e outra já aberta falham conforme a política definida. Uma extensão preserva seu motivo e novo aprovador. A
    revisão posterior atribui as ações a uma pessoa sem depender de uma conta compartilhada.
  affected: jump.estuario.example
  owner: Estação administrativa / FICTÍCIO / NÃO VERIFICADO
  due_date: '2026-11-08'
