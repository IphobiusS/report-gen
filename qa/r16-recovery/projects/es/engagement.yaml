- id: F06
  uid: e5013c62-b016-53ff-8e50-03ec9c468095
  mode: vuln
  title: Trazabilidad fragmentada entre autorización, cola y asiento
  severity: medium
  cwe: CWE-778
  verification: unverified
  status: in_progress
  description_md: Los eventos sintéticos utilizan identificadores diferentes en la API, el trabajador y el libro
    mayor. La hipótesis plantea que la unión depende de hora e importe, valores que pueden repetirse. Una colección
    abundante de registros no garantiza poder reconstruir una decisión concreta ni diferenciar una repetición legítima
    de una duplicidad.
  impact_md: Una investigación podría atribuir un asiento a la autorización equivocada o concluir erróneamente que
    falta una operación. El impacto propuesto es pérdida de confianza en la reconstrucción, no una intrusión demostrada.
    La incorporación indiscriminada de datos personales para compensarlo crearía una exposición adicional sin resolver
    necesariamente la relación causal.
  remediation_md: Propagar un identificador estable de intención y otro de intento, con vínculos explícitos entre
    eventos. Definir campos mínimos, relojes, procedencia e integridad. Registrar cambios de decisión y límites
    de confianza; no incluir secretos. Un evento descartado debe generar una señal controlada para que la ausencia
    no parezca un resultado exitoso.
  closure_criteria_md: Un revisor que no preparó el caso reconstruye tres operaciones simultáneas del mismo importe,
    incluida una cancelación. Debe identificar intento, decisión y asiento sin adivinar por proximidad temporal.
    Las pruebas incluyen pérdida de un evento y desfase de reloj, que deben aparecer como incertidumbre explícita
    y no como una cadena completa.
  affected: events.estuario.example
  owner: Recolector de eventos / FICTICIO / NO VERIFICADO
  due_date: '2026-11-06'
  asset_uids:
