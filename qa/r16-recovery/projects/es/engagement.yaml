    text_md: Comparar respuestas preparadas en archivos locales, sin enumerar objetos remotos. Revisar texto, campos
      y metadatos con una tabla de resultados esperados. Una frase amigable no basta si el cuerpo JSON conserva
      un estado interno diferente. Registrar por separado mensajes destinados al usuario y diagnósticos destinados
      al soporte.
  references:
