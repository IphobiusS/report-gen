    text_md: Construir un grafo local de identidades con nombres inventados y capacidades no operativas. Revisar
      manualmente las combinaciones antes de consultar el evaluador. Comparar la explicación de la decisión, no
      solo el booleano final. El grafo es un modelo de política y no un inventario de personal de un banco.
    figure:
      src: img/model-3.png
      caption: 'Diagrama sintético; no corresponde a una captura de un banco.

