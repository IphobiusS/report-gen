- id: F13
  uid: 6ada26b7-f4e4-5ef3-8635-db2363afffef
  mode: vuln
  title: Separación de funciones que no contempla delegaciones encadenadas
  severity: medium
  verification: unverified
  status: open
  description_md: La matriz ficticia prohíbe que una misma cuenta solicite y apruebe un pago. Sin embargo, las delegaciones
    temporales se registran como roles independientes. La hipótesis pregunta si una persona puede reunir ambas capacidades
    mediante distintas cuentas o cadenas de delegación, aunque cada comprobación aislada parezca correcta.
  impact_md: 'El control de doble revisión podría convertirse en una formalidad sin independencia efectiva. La consecuencia
    depende de la política de identidades y de los controles de importe. No se atribuye fraude a ninguna persona:
    se examina una propiedad del modelo de autorización y la evidencia necesaria para demostrar separación real.'
  remediation_md: Resolver las capacidades efectivas por persona y contexto, incluyendo delegaciones y excepciones.
    Validar incompatibilidades al conceder permisos y al aprobar la operación. Las excepciones necesitan vigencia
    y revisión independiente. Mantener una representación consultable para que el responsable comprenda por qué
    una combinación está permitida o rechazada.
  closure_criteria_md: Las pruebas incluyen dos personas distintas, dos cuentas de la misma persona y una delegación
    de segundo nivel. Solo el primer caso cumple la independencia normal. Una excepción documentada no desaparece
    del registro al vencer. La retirada de una delegación actualiza la decisión efectiva sin requerir recrear todas
    las cuentas.
  affected: identity.estuario.example
  owner: Proveedor de identidad / FICTICIO / NO VERIFICADO
  due_date: '2026-11-13'
  asset_uids:
  - 8f013aa3-64cb-551b-be10-a5a17291d40f
  evidence_uids:
