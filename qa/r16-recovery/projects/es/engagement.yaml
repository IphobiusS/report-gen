- id: F05
  uid: b1ea8af5-a4cf-5cbf-b005-1da7661f1bcc
  mode: vuln
  title: Conservación documental sin separación entre retención y acceso
  severity: medium
  cwe: CWE-922
  verification: unverified
  status: open
  description_md: Una regla del escenario conserva documentos durante un periodo largo, mientras una marca de baja
    oculta su entrada en el portal. Se debe investigar si esa baja cambia la autorización del objeto o únicamente
    su visibilidad. Retener un archivo por obligación documental no implica permitir que cualquier enlace antiguo
    continúe funcionando.
  impact_md: 'El riesgo supuesto es acceso persistente a material que ya no debe estar disponible para un rol operativo.
    La eliminación precipitada tampoco sería una solución: podría romper obligaciones de custodia del escenario.
    La decisión correcta requiere separar conservación, bloqueo de uso ordinario y acceso excepcional sujeto a revisión.'
  remediation_md: Representar estados de conservación y acceso por separado. Invalidar enlaces emitidos cuando cambie
    el estado que los autorizaba, manteniendo los bytes bajo controles de custodia. La recuperación excepcional
    exige finalidad, responsable, registro y plazo. Evitar que el sistema de almacenamiento decida esas condiciones
    solo a partir de una ruta.
  closure_criteria_md: Demostrar que el documento retenido permanece íntegro, que el rol anterior ya no lo obtiene
    y que un acceso excepcional autorizado deja evidencia distinta. La restauración desde copia debe conservar la
    restricción. Un archivo que reaparece públicamente después de restaurar no cumple el criterio aunque la copia
    esté íntegra.
