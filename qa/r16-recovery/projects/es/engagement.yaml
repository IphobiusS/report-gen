- id: F10
  uid: 85bcdc50-d927-55a9-b1a7-69521009bde6
  mode: vuln
  title: Mensaje no interpretable tratado como operación completada
  severity: medium
  cwe: CWE-754
  verification: unverified
  status: in_progress
  description_md: El consumidor ficticio distingue errores de negocio y errores de lectura, pero ambos pueden terminar
    con una confirmación de recepción. Debe establecerse si el mensaje no interpretable conserva un estado visible
    y recuperable. El transporte puede funcionar correctamente aunque la operación desaparezca del seguimiento de
    negocio.
  impact_md: Una orden podría quedar sin resultado y sin alerta accionable. Reprocesar indiscriminadamente la cola
    tampoco sería seguro por el riesgo de duplicar operaciones válidas. La consecuencia hipotética es incertidumbre
    de estado y trabajo de conciliación, no prueba de pérdida de fondos ni de corrupción completa del servicio.
  remediation_md: Separar recepción, interpretación, decisión y resultado final. Los mensajes ilegibles deben conservar
    un identificador, una causa limitada y una ruta de revisión controlada. Evitar bucles de reintento ilimitados.
    La reintroducción exige validar la versión del esquema y mantener la identidad de negocio para aplicar la protección
    contra duplicados.
  closure_criteria_md: Una versión desconocida, un campo obligatorio ausente y un dato inválido quedan pendientes
    con causa diferenciada. El caso válido continúa procesándose. Tras corregir el mensaje, solo un revisor autorizado
    puede reintroducirlo y el historial conecta ambos intentos. Ningún resultado de transporte se presenta como
    liquidación confirmada.
