- id: F09
  uid: 29f8df26-d3aa-5d96-941f-9a4c07cc517c
  mode: vuln
  title: Importes y monedas normalizados de manera distinta entre componentes
  severity: medium
  cwe: CWE-20
  verification: unverified
  status: open
  description_md: El portal muestra importes con formato local, pero la cola utiliza una representación decimal
    de intercambio. La hipótesis revisa conversiones ambiguas, precisión y relación entre moneda e importe. Un valor
    aparentemente correcto en pantalla puede representar una cantidad distinta si otro componente aplica reglas
    de separadores o redondeo diferentes.
  impact_md: 'Podrían surgir rechazos inconsistentes o diferencias entre aprobación y asiento. No se presupone manipulación
    deliberada: también una configuración regional legítima puede activar el defecto supuesto. La presentación en
    español, inglés o portugués debe conservar el mismo valor lógico, aunque cambien separadores y posición del
    símbolo monetario.'
  remediation_md: Definir una representación canónica de intercambio con moneda obligatoria y precisión permitida.
    Separar formato de pantalla y valor de negocio; rechazar ambigüedades antes de autorizar. El redondeo debe ser
    explícito y aplicarse una sola vez en la etapa acordada, con reglas verificables para ajustes y devoluciones.
  closure_criteria_md: La tabla de aceptación incluye cero, fracción mínima, máximo permitido y valores con exceso
    de precisión. Cada idioma produce el mismo dato canónico y el mismo rechazo cuando corresponde. Ninguna cadena
    vacía se convierte en cero. Una moneda ausente debe impedir la decisión, no heredar un valor global silencioso.
  affected: payments.estuario.example
  owner: API de pagos / FICTICIO / NO VERIFICADO
  due_date: '2026-11-09'
  asset_uids:
