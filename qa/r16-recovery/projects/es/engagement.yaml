- id: F08
  uid: c3687dff-9d2b-594f-80eb-da3b467dbc52
  mode: vuln
  title: Acceso administrativo de emergencia sin caducidad verificable
  severity: high
  cwe: CWE-269
  verification: unverified
  status: not_verified
  description_md: El procedimiento de emergencia del ejemplo permite elevar temporalmente permisos de recuperación.
    Se necesita comprobar si la finalización depende de una persona que recuerde retirar el acceso. La autorización
    inicial y su retirada son decisiones distintas; un ticket cerrado no demuestra que todas las sesiones y credenciales
    derivadas hayan expirado.
  impact_md: Un permiso de emergencia persistente ampliaría la superficie administrativa fuera de la ventana aprobada.
    El riesgo supuesto combina alcance excesivo y atribución débil, no una toma de control demostrada. Si se impide
    toda emergencia sin alternativa, el banco ficticio podría perder capacidad de recuperación; debe existir un
    procedimiento limitado y ensayado.
  remediation_md: Conceder capacidades temporales ligadas a identidad individual, motivo y duración máxima. Separar
    solicitud, aprobación y revisión posterior. La caducidad debe ser técnica y abarcar sesiones derivadas, con
    una ruta de extensión explícita. El registro de comandos requiere filtros de secretos y acceso restringido,
    no publicación indiscriminada.
  closure_criteria_md: El caso positivo permite la acción autorizada durante la ventana. Después del vencimiento
    fallan tanto una sesión nueva como otra ya abierta, según la política definida. Una extensión conserva motivo
    y nuevo aprobador. La revisión posterior puede atribuir las acciones a una persona sin depender de una cuenta
    compartida.
  affected: jump.estuario.example
  owner: Estación administrativa / FICTICIO / NO VERIFICADO
  due_date: '2026-11-08'
