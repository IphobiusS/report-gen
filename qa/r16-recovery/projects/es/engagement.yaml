- id: M1
  uid: 42526c27-a68b-51cf-b526-71bcb93ecff8
  mode: machine
  title: Cuaderno de validación del trabajador de liquidación
  host:
    name: settlement-worker.estuario.example
    ip: 192.0.2.44
    os: Sistema Linux ficticio
  open_ports: 443/tcp, 8443/tcp / FICTICIO / NO VERIFICADO
  summary_md: Esta ficha describe un servidor ficticio de procesamiento asíncrono. No documenta acceso inicial,
    escalada ni control de un sistema real. Su objetivo es relacionar las decisiones de autorización con la recepción
    de mensajes y el resultado contable. Los puertos son datos del guion, no resultados de un escáner. Las fases
    se ordenan por dependencias de validación, y su presencia en el gráfico no indica que hayan sido ejecutadas.
  status: not_verified
  verification: unverified
  asset_uids:
  - 4089b161-ae91-5de3-8ea9-e9b214709b6f
  evidence_uids: []
  phases:
  - name: Contrato de entrada
    steps:
    - text_md: Enumerar versiones de esquema, campos obligatorios y significado de cada identificador. El contrato
        debe diferenciar intención, intento y resultado. Revisar cómo se documentan mensajes incompletos sin publicarlos
        ni perder la relación con su operación. El estado esperado se escribe antes de iniciar cualquier ensayo
        local.
  - name: Decisión y concurrencia
    steps:
    - text_md: Relacionar F01, F02 y F10 con secuencias de recepción, revocación y reintento. Dos mensajes simultáneos
        no deben evaluarse como pruebas independientes si modifican el mismo estado. La revisión prepara un orden
        conocido de eventos y exige una explicación para cada decisión, incluyendo la que queda pendiente.
  - name: Conciliación y observabilidad
    steps:
    - text_md: Comparar el número de intenciones, asientos y respuestas recuperables. Una diferencia debe ser explicable
        por un estado documentado y nunca por un registro desaparecido. El operador necesita distinguir retraso
        de fallo sin acceder a secretos. Se conserva una tabla de correlación sintética para la revisión cruzada.
  - name: Reversión y cierre del laboratorio
    steps:
    - text_md: Destruir mensajes y cuentas de la maqueta, conservar únicamente el manifiesto de resultados y verificar
        que no quedaron tareas automáticas. La limpieza es un paso previsto, no una afirmación de que hubo acceso.
        Cualquier ensayo posterior comienza con un estado nuevo para evitar atribuir resultados anteriores a la
        revisión actual.
  proof:
  - name: synthetic-proof.txt
    value: ESTUARIO_R16_NOT_A_CAPTURED_FLAG_1
    notes: FICTICIO / NO VERIFICADO
- id: M2
  uid: 0f56c782-8315-539d-bbf2-566190f88e6a
  mode: machine
  title: Cuaderno de restauración y conservación de restricciones
  host:
    name: recovery-controller.estuario.example
    ip: 192.0.2.47
    os: Sistema Linux ficticio
  open_ports: 443/tcp, 8443/tcp / FICTICIO / NO VERIFICADO
  summary_md: La segunda máquina representa un coordinador de recuperación aislado. El objetivo es comprobar que
    la restauración conserva tanto contenido como decisiones de acceso. No se asignan objetivos de tiempo como si
    hubieran sido medidos. La ficha distingue los componentes necesarios, los responsables de aceptar su estado
    y los criterios que impiden reabrir el servicio.
  status: not_verified
  verification: unverified
  asset_uids:
  - c19b7e5e-7cc8-5d43-b0ea-e967d4e657cd
  evidence_uids: []
  phases:
  - name: Manifiesto de dependencias
    steps:
    - text_md: Registrar datos, configuración, versiones y referencias de claves sin copiar secretos. Confirmar
        que el manifiesto permite reconstruir la misma combinación aprobada. Un nombre de producto sin versión no
        sirve como evidencia de compatibilidad. La revisión documenta también qué dependencia requiere intervención
        humana y cómo se valida su origen.
  - name: Restauración aislada
    steps:
    - text_md: Restaurar bajo identificadores diferentes de los del entorno original y mantener deshabilitados los
        destinos externos. Comprobar integridad de archivos y consistencia lógica como controles separados. La disponibilidad
        de una página de inicio no demuestra que la cola, las restricciones documentales ni la conciliación hayan
        recuperado su estado.
  - name: Puerta de reapertura
    steps:
    - text_md: Exigir lectura autorizada, rechazo de identidad revocada, conservación de bloqueo y ausencia de asientos
        duplicados. Si falta una comprobación, el responsable registra la limitación y mantiene el servicio fuera
        de la ruta operativa. La decisión de negocio se documenta aparte del resultado técnico y no se atribuye
        al generador.
  proof:
  - name: synthetic-proof.txt
    value: ESTUARIO_R16_NOT_A_CAPTURED_FLAG_2
    notes: FICTICIO / NO VERIFICADO
