- id: F15
  uid: 0b0cd3b0-96ec-5bba-8ede-d1ac5480f39a
  mode: vuln
  title: Dependencia de recuperación sin versión ni procedencia verificables
  severity: medium
  verification: unverified
  status: reported_fixed
  description_md: El manifiesto ficticio identifica la aplicación principal, pero deja herramientas auxiliares como
    una descarga denominada latest. La hipótesis cuestiona si el mismo plan produce el mismo entorno meses después.
    Una copia de datos íntegra puede ser inútil si la herramienta necesaria para interpretarla cambia o deja de
    estar disponible.
  impact_md: 'La recuperación podría depender de decisiones improvisadas durante una interrupción. El impacto supuesto
    es incertidumbre operativa y posible incompatibilidad, no evidencia de un paquete malicioso. Fijar una versión
    sin vigilar su mantenimiento tampoco resuelve el problema: reproducibilidad y actualización segura deben gestionarse
    como necesidades complementarias.'
  remediation_md: Registrar versión, origen, resumen criptográfico, licencia y función de cada dependencia necesaria.
    Conservar un mecanismo autorizado de obtención y una prueba de compatibilidad con las copias. Las actualizaciones
    requieren evaluación y renovación del manifiesto; no deben aplicarse por sorpresa durante una restauración urgente.
  closure_criteria_md: Dos reconstrucciones aisladas deben identificar exactamente las mismas dependencias aprobadas.
    Una alteración de bytes se detecta antes de ejecutar la herramienta. La prueba también demuestra cómo se rechaza
    una versión incompatible y cómo se renueva el conjunto aprobado. No se exige conservar versiones vulnerables
    para mantener una coincidencia histórica.
  affected: recovery-controller.estuario.example
  owner: Orquestador de recuperación / FICTICIO / NO VERIFICADO
  due_date: '2026-11-15'
  asset_uids:
  - c19b7e5e-7cc8-5d43-b0ea-e967d4e657cd
  evidence_uids: []
  root_cause_uid: 294c8d3b-269e-5b8a-8681-b0bcefcd2901
  walkthrough:
  - lead: Procedimiento propuesto, no ejecutado
    text_md: Crear tres paquetes locales de texto con versiones inventadas y resúmenes conocidos. Modificar uno
      sin cambiar su nombre y comparar el resultado de verificación. La prueba no descarga ni ejecuta software desconocido.
      El objetivo es validar la decisión de aceptación del manifiesto, no simular una intrusión en la cadena de
      suministro.
  references:
  - https://docs.estuario.example/evidence/registro#ação-ñ-über-العربية-हिन्दी-한국어-日本語
  reported_remediation: 'Estado simulado: el guion incluye una comunicación de cambio, pero no existe una corrección
    real ni un retest técnico.'
- id: F16
  uid: a1836300-1e7e-574d-a137-84d27e3d60ec
  mode: vuln
  title: Criterios de cierre que confunden cambio comunicado con verificación
  severity: info
  verification: unverified
  status: not_verified
  description_md: 'El flujo administrativo del ejemplo permite registrar que un equipo ha implantado una corrección.
    La hipótesis documental consiste en presentar esa comunicación como una verificación independiente. Son hechos
    distintos: una implementación puede existir y aun así fallar el caso original, un caso equivalente o una dependencia
    que quedó fuera de la modificación.'
  impact_md: 'La dirección podría interpretar una reducción de hallazgos abiertos como reducción demostrada de riesgo.
    No hay impacto técnico asignado ni puntuación CVSS: se trata de calidad del proceso y del informe. El objetivo
    no es impedir avances parciales, sino mostrar con precisión qué se comunicó, qué se probó y qué sigue pendiente.'
  remediation_md: Mantener campos separados para seguimiento, verificación técnica y resultado del retest. Exigir
    fecha, alcance y evidencia antes de comunicar cierre verificado. Las excepciones o imposibilidades de prueba
    deben permanecer visibles y no convertirse automáticamente en aceptación de riesgo. El responsable del negocio
    decide la aceptación mediante un proceso aparte.
  closure_criteria_md: Una corrección comunicada sin retest aparece como pendiente de verificación en la vista y
    en la exportación. Un retest inconcluso no cierra el hallazgo. Un registro sin fecha permanece visible sin convertirse
    en el último resultado fechado. El informe debe explicar la diferencia y conservar el historial original.
  affected: events.estuario.example
  owner: Recolector de eventos / FICTICIO / NO VERIFICADO
