- id: F04
  uid: 6465ff0e-165c-56b5-a8dd-c4daad3e6de6
  mode: vuln
  title: Consulta de documentos con pertenencia empresarial ambigua
  severity: medium
  cwe: CWE-639
  verification: unverified
  status: not_verified
  description_md: El portal permite consultar documentos asociados a una empresa y a un contrato. El modelo separa
    ambos identificadores y la hipótesis examina si se valida su relación antes de entregar el archivo. Una búsqueda
    que solo comprueba que el usuario pertenece a alguna empresa no resuelve la pertenencia del documento solicitado.
  impact_md: La consecuencia potencial es lectura cruzada de un documento del ejemplo, sin inferir escritura ni
    acceso general al archivo. Un enlace de descarga temporal podría prolongar el acceso aunque la consulta inicial
    se cierre. El análisis debe abarcar tanto la autorización de búsqueda como la del mecanismo de entrega.
  remediation_md: Consultar el recurso dentro del conjunto de empresas autorizado para la identidad, sin confiar
    en identificadores presentados por el cliente. Vincular los enlaces temporales a propósito y expiración adecuados.
    Mantener un comportamiento de error uniforme que no revele existencia de documentos pertenecientes a otras organizaciones.
  closure_criteria_md: La prueba debe cruzar dos empresas, dos contratos y dos roles, conservando un caso permitido.
    Las combinaciones ajenas no entregan contenido ni enlaces funcionales. La caducidad se comprueba también tras
    copiar la dirección a una sesión nueva. El registro conserva la causa del rechazo sin almacenar el documento
    completo.
