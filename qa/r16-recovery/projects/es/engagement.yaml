- id: F02
  uid: 88fb730a-f259-5f51-9f83-46a99ac09d7e
  mode: vuln
  title: Reintento de liquidación sin identidad de negocio estable
  severity: high
  cwe: CWE-837
  verification: unverified
  status: in_progress
  description_md: El escenario permite que una solicitud reciba un identificador nuevo después de perderse su confirmación.
    Se debe investigar si la deduplicación utiliza ese identificador de transporte o una clave ligada a la intención
    del cliente. Dos mensajes distintos podrían representar exactamente la misma orden y no dos pagos legítimos.
  impact_md: 'La consecuencia hipotética es una duplicidad de asiento o una conciliación manual costosa. No se presupone
    pérdida económica automática: el resultado depende de controles posteriores. La indisponibilidad parcial aumenta
    la incertidumbre porque un cliente puede repetir una operación cuya respuesta no recibió aunque el servidor
    sí la procesara.'
  remediation_md: Mantener una clave de idempotencia de negocio con alcance, caducidad y comparación de contenido
    definidos. Registrar de forma atómica la aceptación y el resultado recuperable. Una misma clave con contenido
    diferente debe producir conflicto explícito. La retención debe cubrir la ventana máxima documentada de reintentos
    y recuperaciones.
  closure_criteria_md: La matriz debe incluir repetición inmediata, repetición tras reinicio, llegada fuera de orden
    y misma clave con otro importe. Cada intención permitida produce un único asiento. El caso conflictivo no modifica
    el asiento original. La respuesta de consulta permite al cliente distinguir pendiente, completado y rechazado
    sin adivinar.
  affected: settlement-worker.estuario.example
  owner: Trabajador de liquidación / FICTICIO / NO VERIFICADO
  due_date: '2026-11-02'
  asset_uids:
  - 4089b161-ae91-5de3-8ea9-e9b214709b6f
  evidence_uids: []
  root_cause_uid: 294c8d3b-269e-5b8a-8681-b0bcefcd2901
  walkthrough:
