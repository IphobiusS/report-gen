- id: F07
  uid: 93956a2c-ef57-5402-9632-76a6d709f5b3
  mode: vuln
  title: Recuperación que restaura datos sin restablecer las restricciones
  severity: high
  verification: unverified
  status: reported_fixed
  description_md: La plataforma ficticia verifica que una copia contiene archivos legibles, pero la planificación
    no incorpora permisos, claves, colas y bloqueos documentales. La hipótesis cuestiona la equivalencia entre recuperar
    bytes y recuperar un servicio seguro. Una restauración parcial puede conservar los datos mientras altera silenciosamente
    quién puede utilizarlos.
  impact_md: El servicio recuperado podría conceder acceso excesivo, perder prohibiciones vigentes o ejecutar tareas
    ya completadas. La continuidad aparente escondería diferencias de autorización y contabilidad. No se afirma
    que la copia sea corrupta; el problema supuesto está en el contrato de recuperación y en lo que la prueba considera
    suficiente.
  remediation_md: Definir una unidad de recuperación que incluya datos, configuración, identidades, referencias
    a claves y posición de procesamiento. Mantener dependencias y orden de arranque explícitos. Antes de abrir el
    servicio, ejecutar controles de acceso y conciliación. La documentación debe indicar qué no puede recuperarse
    automáticamente y quién decide el tratamiento.
  closure_criteria_md: La aceptación requiere lectura autorizada, rechazo de una identidad revocada, conservación
    de un bloqueo y ausencia de duplicados tras reanudar la cola. Comparar el estado lógico antes y después, no
    solo hashes. Registrar el tiempo medido y el punto recuperado sin sustituirlos por los objetivos comerciales
    deseados.
