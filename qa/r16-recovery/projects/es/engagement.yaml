    text_md: Usar un libro mayor en memoria y un transporte simulado capaz de perder confirmaciones. Enumerar las
      secuencias antes del ensayo, sin generar tráfico real. Comparar número de intenciones con número de asientos
      y conservar los identificadores. Una prueba solo de respuesta duplicada no demuestra atomicidad del registro.
  references:
