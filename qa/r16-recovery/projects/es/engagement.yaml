  description_md: El catálogo ficticio presenta nombre, fecha y tamaño de cada evidencia, pero no describe una vinculación
    a contenido inmutable. La hipótesis considera que sustituir un archivo bajo el mismo nombre podría dejar el
    expediente aparentemente intacto. La procedencia y la integridad son propiedades diferentes de la legibilidad
    del documento.
  impact_md: Un revisor podría evaluar bytes diferentes de los aprobados o perder la relación entre una observación
    y su prueba. Esto afectaría reproducibilidad y confianza documental, sin demostrar falsificación efectiva. Un
    hash por sí solo tampoco acredita quién obtuvo el material ni si el procedimiento de adquisición fue correcto.
  remediation_md: Vincular cada revisión a un resumen criptográfico, tamaño y origen registrado, conservando versiones
    anteriores cuando cambie el contenido. La sustitución debe ser una acción explícita con motivo. Distinguir evidencia
    original, copia saneada y figura de presentación, con relaciones verificables y sin prometer autenticidad que
    el proceso no garantiza.
  closure_criteria_md: La prueba reemplaza una imagen sintética por otra de igual dimensión y nombre. El expediente
    debe detectar una revisión distinta y preservar la anterior según la política. Exportar y volver a importar
    conserva las relaciones. La comparación de contenido no depende de la fecha de modificación del sistema de archivos.
  affected: archive.estuario.example
  owner: Archivo documental / FICTICIO / NO VERIFICADO
  due_date: '2026-11-12'
