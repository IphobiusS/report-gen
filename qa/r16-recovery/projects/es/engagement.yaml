  remediation_md: Definir una lista de campos permitidos para diagnóstico y excluir por defecto los demás. Aplicar
    censura antes de crear el archivo, no solo al mostrarlo. Documentar retención, destinatarios y eliminación.
    El sistema debe ofrecer un resumen útil del fallo sin exigir que el usuario entregue una sesión completa.
  closure_criteria_md: El archivo final debe omitir los marcadores de secreto introducidos exclusivamente para la
    prueba, incluidos metadatos y anexos derivados. El mensaje de error sigue siendo comprensible. La revisión de
