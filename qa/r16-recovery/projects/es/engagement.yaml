- id: F14
  uid: af709c14-9362-55a6-80d9-29f02afd8054
  mode: vuln
  title: Mensajes de error que revelan estados internos de documentos ajenos
  severity: low
  cwe: CWE-200
  verification: unverified
  status: in_progress
  description_md: El portal del escenario devuelve mensajes diferentes para un documento inexistente, retenido o
    asociado a otra empresa. La hipótesis se limita a información de existencia y estado, sin suponer acceso al
    contenido. Las diferencias pueden aparecer en texto, código, tamaño o tiempo, por lo que revisar solo la traducción
    visible sería insuficiente.
  impact_md: 'Un usuario podría deducir que existe una relación contractual o un expediente, aunque no pueda descargarlo.
    La sensibilidad depende del contexto del identificador y de su predictibilidad. No se justifica ocultar al operador
    autorizado la causa real: se necesitan respuestas externas prudentes y diagnósticos internos con acceso controlado.'
  remediation_md: Definir un contrato de error uniforme para usuarios sin autorización sobre el objeto. Separar
    código de diagnóstico interno y mensaje externo, con identificador de correlación. Las traducciones deben conservar
    el mismo significado y no incluir nombres o rutas interpolados que reintroduzcan la información que se pretendía
    ocultar.
  closure_criteria_md: En español, inglés y portugués, los tres casos no autorizados deben presentar resultados
    equivalentes según el contrato. El soporte autorizado puede recuperar la causa mediante correlación. La prueba
    no exige tiempos idénticos de forma irreal; exige que cualquier diferencia relevante se mida y se evalúe en
    el contexto acordado.
  affected: portal.estuario.example
  owner: Portal empresarial / FICTICIO / NO VERIFICADO
  due_date: '2026-11-14'
  asset_uids:
  - 8d0c12ea-495a-5550-86d0-678f6d75f957
  evidence_uids: []
  root_cause_uid: e7ed1ba1-326f-560b-86cc-62748520f673
  walkthrough:
