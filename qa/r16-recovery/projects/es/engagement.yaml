- id: F03
  uid: 5378b788-8eb3-58d3-854b-d4622c909210
  mode: vuln
  title: Revocación incompleta entre sesiones interactivas y tareas diferidas
  severity: high
  cwe: CWE-613
  verification: unverified
  status: reported_fixed
  description_md: La baja de un usuario cierra su sesión visible, pero el modelo contempla credenciales derivadas
    para informes y pagos diferidos. Es necesario determinar cómo se propaga la revocación a cada consumidor y qué
    periodo de tolerancia está aprobado. Una pantalla de sesión cerrada no describe el estado de los trabajos existentes.
  impact_md: 'Un trabajo podría seguir leyendo documentos o preparando operaciones tras la retirada del permiso.
    La extensión dependería de la vida de la credencial y del alcance concedido. No se afirma que una revocación
    deba cancelar toda tarea: la política debe distinguir obligaciones ya comprometidas de nuevas decisiones que
    requieren autoridad vigente.'
  remediation_md: Inventariar credenciales y consumidores; definir un tiempo máximo verificable de propagación.
    Vincular tareas a una identidad y política revisable, con una ruta segura de cancelación o transferencia autorizada.
    Reducir el alcance de las credenciales derivadas y evitar que una sesión de interfaz sea la única señal de revocación.
  closure_criteria_md: Registrar una matriz de consumidores con instante de revocación, instante de rechazo y excepción
    autorizada si existe. Las nuevas decisiones quedan bloqueadas dentro del plazo acordado. Las obligaciones que
    continúan explican su fundamento y responsable. Ningún consumidor puede quedar fuera por no tener una interfaz
    de usuario propia.
  affected: identity.estuario.example
  owner: Proveedor de identidad / FICTICIO / NO VERIFICADO
  due_date: '2026-11-03'
  asset_uids:
  - 8f013aa3-64cb-551b-be10-a5a17291d40f
  evidence_uids: []
  root_cause_uid: e7ed1ba1-326f-560b-86cc-62748520f673
  walkthrough:
  - lead: Procedimiento propuesto, no ejecutado
    text_md: Preparar una cronología ficticia con reloj controlado, credenciales no funcionales y tres consumidores
      locales. Cambiar el permiso entre aceptación y ejecución. Registrar el resultado esperado para cada tipo de
      trabajo, incluidos los que deben continuar. No reutilizar tokens reales para probar el comportamiento de la
      maqueta.
