report:
  sections:
  - key: confidentiality
    body: Material sintético preparado para comprobar un generador de informes. No contiene información de clientes,
      hallazgos reales, credenciales operativas ni autorización para realizar pruebas. Se permite revisar y reutilizar
      el caso manteniendo su carácter ficticio.
  - key: document_control
    version_history:
    - version: R16.1
      date: '2026-10-13'
      author: report-gen QA
      notes: FICTICIO / NO VERIFICADO
    distribution: Revisión del generador; no distribución bancaria.
  - key: contacts
  - key: executive_summary
    summary: 'Banco Estuário es una entidad ficticia creada exclusivamente para comprobar report-gen. Este documento
      no acredita un pentest, una certificación bancaria, una aceptación de riesgo ni el funcionamiento de controles
      en una organización real. Todos los activos pertenecen a rangos de documentación o al dominio reservado example.
      Las imágenes representan modelos dibujados, no capturas de un sistema examinado. Los estados de seguimiento
      describen un guion de trabajo simulado; las dieciséis observaciones conservan verificación técnica pendiente.


      El escenario reúne banca empresarial, una pasarela de pagos, un servicio de custodia documental y una plataforma
      de recuperación. La premisa de trabajo es una separación imperfecta entre identidad, autorización y ejecución
      asíncrona. Un permiso válido al solicitar una operación puede dejar de serlo antes de que el trabajador la
      procese. Del mismo modo, una confirmación de recepción no equivale a liquidación, ni una copia almacenada
      demuestra que el banco pueda restaurar su servicio.


      La dirección debería concentrarse primero en decisiones irreversibles: quién puede ordenar una transferencia,
      qué autoridad conserva una operación en espera y cómo se detiene una ejecución anómala sin duplicarla. La
      segunda prioridad es conservar trazabilidad útil para investigar, con datos suficientes para unir autorización,
      mensaje, asiento y documento. La tercera es demostrar recuperación con dependencias y personas concretas.
      Las prioridades propuestas pertenecen al escenario; no proceden de mediciones sobre producción.


      Se registran dieciséis hipótesis de debilidad y dos fichas de máquinas. Las severidades son supuestos de planificación,
      no puntuaciones observadas; la ausencia de CVSS es deliberada porque no se han medido todos sus factores.
      El documento distingue la promesa de corregir, la prueba ejecutada y la evidencia que permitiría concluir.
      Ninguna fila se cierra por cambiar su estado en el editor. Las fechas programadas no constituyen resultados
      ni compromisos de una entidad real.


      La recomendación ejecutiva es aprobar una secuencia de validación con responsables diferentes para implementación
      y revisión. Antes de aceptar una corrección se debe demostrar el comportamiento permitido, el rechazo esperado
      y la ausencia de efectos secundarios sobre conciliación y soporte. Un ensayo que solo comprueba una respuesta
      HTTP deja sin resolver los mensajes ya encolados, los reintentos y las tareas administrativas. El alcance
      debe seguir la operación hasta su resultado de negocio.


      Este informe también ejerce presión sobre el generador: contiene títulos largos, tablas con párrafos, citas
      y listas anidadas, direcciones extensas, caracteres portugueses y etiquetas multilingües. Su calidad documental
      se evalúa independientemente de la ficción de seguridad. Una exportación visualmente correcta no prueba que
      las hipótesis sean ciertas; una alerta de preparación intencional no demuestra que el exportador tenga un
      defecto. La auditoría adjunta registra ambas categorías por separado.'
  - key: scope
    objectives: 'El perímetro documental incluye ocho activos sintéticos: portal empresarial, API de pagos, proveedor
      de identidad, trabajador de liquidación, archivo documental, recolector de eventos, orquestador de copias
      y estación de salto. La red 192.0.2.0/24 y los nombres estuario.example son exclusivamente identificadores
      del ejemplo. No se contactaron esos destinos ni se ejecutaron comandos de reconocimiento. La ficha de cada
      máquina es un cuaderno de validación preparado para un futuro laboratorio aislado.


      Quedan fuera de alcance redes de tarjetas, sistemas de terceros, clientes reales, pruebas de disponibilidad,
      ingeniería social y cualquier transferencia de fondos. Tampoco se atribuye cumplimiento normativo: citar una
      familia de controles no sustituye un examen de requisitos, jurisdicción y evidencia. La correspondencia con
      CWE orienta la revisión técnica y no convierte una hipótesis en vulnerabilidad confirmada.


      El guion considera tres identidades ficticias: solicitante, aprobador y operador de recuperación. Cada una
      debe disponer de una cuenta permitida y otra deliberadamente no autorizada. Los datos se generan desde cero
      y se destruyen al terminar el ensayo. El registro conserva identificadores de correlación, nunca contraseñas,
      llaves privadas, sesiones reutilizables ni información de clientes. Una ejecución futura deberá tener autorización
      escrita y una ventana acordada; este paquete no autoriza pruebas sobre ningún sistema.


      Se suspendería un ensayo si aparecen datos ajenos, degradación inesperada, accesos fuera de la matriz acordada
      o discrepancias contables no controladas. El analista documentaría el momento, el identificador de operación
      y la decisión de pausa sin ampliar el acceso. La reanudación dependería del responsable del laboratorio. Estas
      condiciones son parte del diseño del caso, no la descripción de un incidente ocurrido.'
    assumptions: Sin acceso a producción; sin tráfico a los destinos; sin validación técnica de vulnerabilidades.
  - key: methodology
    approach: 'La evaluación propuesta comienza con contratos observables. Para cada operación se anota quién solicita,
      quién aprueba, qué recurso se modifica y en qué momento se decide la autorización. Después se describen resultados
      permitidos y rechazados. El conjunto mínimo incluye casos positivos, negativos, reintentos y vencimientos;
      un único rechazo no basta para concluir que el diseño es seguro. La evidencia debe relacionarse con una revisión
      concreta de código y configuración.


      Las hipótesis se contrastarían primero con modelos locales, después con servicios sintéticos y finalmente
      con un entorno autorizado que reproduzca las dependencias relevantes. El orden reduce incertidumbre sin confundir
      una simulación con producción. Si una dependencia no puede representarse, la limitación permanece visible
      en la ficha y el resultado queda pendiente. No se sustituye la comprobación por una captura de una pantalla
      que simplemente muestra la configuración deseada.


      Cada observación contiene una condición previa, una consecuencia limitada y criterios de cierre medibles.
      La repetición utiliza dos revisores cuando la decisión modifica permisos o asientos. Uno prepara el estado
      inicial y el otro verifica tanto el resultado como la reversión. Los identificadores permanecen estables entre
      idiomas para comparar exportaciones; la traducción cambia la redacción, nunca los activos, las relaciones
      ni la interpretación del resultado.


      Para la calidad del documento se compara la secuencia de secciones, el texto de los enlaces y sus destinos,
      las tablas y las leyendas. Un salto de página razonable no es un error; sí lo son texto recortado, números
      de índice aislados, filas omitidas o destinos alterados. La comparación incluye una URL con fragmento Unicode
      y otras con guiones codificados. El documento no inserta caracteres invisibles para forzar el ajuste de línea.


      Los registros de retest adjuntos describen sesiones de planificación, no pruebas sobre infraestructura bancaria.
      El resultado registrado es no verificable mientras no exista ejecución autorizada. Las tablas anidadas tienen
      una finalidad doble: especifican controles de aceptación y ejercitan la paginación del generador. Se debe
      poder leer cada fila sin confundir la etiqueta del control con su resultado, incluso cuando la tabla atraviesa
      una página.'
  - key: findings_summary
  - key: findings
  - key: remediation_plan
    overview: 'La primera etapa convierte las hipótesis de autorización, idempotencia y recuperación en contratos
      revisables. El responsable de pagos define qué decisiones son irrevocables y el responsable de identidad identifica
      los eventos que invalidan un mandato. El equipo de plataforma prepara simuladores con reloj controlado y datos
      inventados. La salida de esta etapa es una matriz de comportamiento esperado, no una lista de tickets cerrados.


      En la segunda etapa se implementan cambios pequeños y verificables. Cada cambio declara sus dependencias,
      los mensajes ya existentes que podrían verse afectados y la forma de revertirlo. Una modificación que altera
      la semántica de una cola requiere un plan para convivir con versiones anteriores. La revisión debe preguntar
      qué ocurre durante el despliegue, no únicamente cómo se comporta el estado final deseado.


      La tercera etapa comprueba de manera independiente las correcciones comunicadas. El revisor recibe datos sintéticos,
      versión de la aplicación y configuración, contrato de aceptación y límites conocidos. Registra resultados
      negativos y positivos con la misma precisión. Si no puede reproducir una condición, indica qué falta y por
      qué; no sustituye la ausencia de una prueba por un resultado satisfactorio.


      La última etapa trata mantenimiento y recuperación. Los controles aceptados pasan a una batería de regresión
      con responsables y umbrales definidos. Se ensaya la restauración sin conectar destinos reales, se revisa la
      conservación de restricciones y se comprueba que el procedimiento puede ser ejecutado por una persona que
      no lo redactó. Las excepciones tienen fecha de revisión y una decisión empresarial separada.


      Las métricas propuestas son tiempo hasta una decisión explicable, porcentaje de operaciones con correlación
      completa, duplicados detectados antes del asiento y controles de recuperación demostrados. No se propone usar
      líneas de código, volumen de eventos o número de vulnerabilidades como sustitutos de calidad. El informe de
      seguimiento debe exponer denominadores y exclusiones para que una mejora aparente no oculte una reducción
      del alcance.


      La entrega documental prevista para el 13 de noviembre no equivale al cierre de las remediaciones. Los plazos
      posteriores corresponden al seguimiento del escenario y no a compromisos de una institución real.'
  - key: contratos-de-exportacion
    title: Apéndice técnico de direcciones extensas, etiquetas multilingües y preservación de referencias entre
      formatos de informe
    body: 'Las siguientes direcciones son referencias documentales reservadas. Su texto y destino deben mantenerse
      exactos; no se consultan ni acreditan fuentes externas. Los identificadores largos prueban el ajuste de línea,
      sin añadir espacios ni caracteres invisibles al contenido.


      | Referencia | Finalidad | Dirección literal |

      | --- | --- | --- |

      | R01 | Vincular la decisión a la versión del mandato. | <https://docs.estuario.example/validation/payment-authorisation-and-settlement-consistency/2026-10-13/tenant-0123456789abcdef0123456789abcdef?case=ESTUARIO-R16&locale=pt-BR&control=mandate%2Drevocation#acceptance>
      |

      | R02 | Relacionar recuperación y restricciones conservadas. | <https://docs.estuario.example/recovery/manifest?revision=sha256%3A0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&component=identity%2Dpolicy#revisão-açaí>
      |


      [Contrato de autorización y liquidación](https://docs.estuario.example/validation/payment-authorisation-and-settlement-consistency/2026-10-13/tenant-0123456789abcdef0123456789abcdef?case=ESTUARIO-R16&locale=pt-BR&control=mandate%2Drevocation#acceptance)


      <https://docs.estuario.example/validation/payment-authorisation-and-settlement-consistency/2026-10-13/tenant-0123456789abcdef0123456789abcdef?case=ESTUARIO-R16&locale=pt-BR&control=mandate%2Drevocation#acceptance>


      [Restauración, revisión y açaí](https://docs.estuario.example/recovery/manifest?revision=sha256%3A0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&component=identity%2Dpolicy#revisão-açaí)


      <https://docs.estuario.example/recovery/manifest?revision=sha256%3A0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&component=identity%2Dpolicy#revisão-açaí>


      [Registro multilingüe: acción, ação, العربية, हिन्दी, 한국어, 日本語](https://docs.estuario.example/evidence/registro#ação-ñ-über-العربية-हिन्दी-한국어-日本語)


      <https://docs.estuario.example/evidence/registro#ação-ñ-über-العربية-हिन्दी-한국어-日本語>


      ```text

      ESTUARIO_R16_TECHNICAL_IDENTIFIER_0123456789ABCDEF_0123456789ABCDEF_0123456789ABCDEF

      Literal: & <sample> &#x00; [brackets] `backticks`

      Português: ação, revisão, proteção, João, São Luís, açaí.

      ```

      '
  - key: appendix
    tools_used: Se utiliza report-gen para generar los cuatro formatos y código local para dibujar diagramas sintéticos.
      No se ejecutaron herramientas de pentest. Los valores de prueba de las máquinas son marcadores ficticios,
      no flags obtenidas.
  workflow:
    include_assets: true
    include_coverage: true
    include_retest: true
    include_root_causes: true
findings:
- id: F01
  uid: 4f75a819-3617-5eb9-be63-0ce5e99496bd
  mode: vuln
  title: Autorización de pagos separada de la decisión de ejecución
  severity: high
  cwe: CWE-862
  verification: unverified
  status: open
  description_md: La API del modelo guarda una autorización al aceptar la solicitud y el trabajador la utiliza después.
    La hipótesis plantea que un cambio de titularidad, límite o mandato podría no consultarse de nuevo. Debe comprobarse
    qué hechos quedan fijados y cuáles deben seguir siendo válidos al ejecutar.
  impact_md: Una decisión obsoleta podría permitir un movimiento que el aprobador ya no tiene facultad de ordenar.
    El alcance supuesto se limita a la operación en espera; no se deduce acceso a otras cuentas. La conciliación
    podría detectar la diferencia después, cuando revertirla requiera una gestión separada.
  remediation_md: Definir una política explícita de vigencia y vincular la autorización a cuenta, importe, beneficiario
    y versión del mandato. El consumidor debe comprobar esa política antes de crear el asiento. Si falta información,
    debe dejar una decisión rastreable y pendiente, sin convertir un fallo de consulta en permiso.
  closure_criteria_md: La revisión deberá mostrar una operación válida, otra con mandato revocado y otra con límites
    modificados. Ninguna de las dos últimas puede producir un asiento. El registro debe explicar el rechazo y conservar
    el identificador original. Un reintento posterior tampoco debe reutilizar silenciosamente la autoridad anterior.
  affected: payments.estuario.example
  owner: API de pagos / FICTICIO / NO VERIFICADO
  due_date: '2026-11-01'
  asset_uids:
  - 317c3055-1144-5cb5-b89f-13dd0b79bfc7
  evidence_uids:
  - 60e41910-a92f-5442-b9fa-093209a5fd5d
  root_cause_uid: e7ed1ba1-326f-560b-86cc-62748520f673
  walkthrough:
  - lead: Procedimiento propuesto, no ejecutado
    text_md: Preparar tres mensajes locales idénticos salvo la versión del mandato. Pausar el consumidor ficticio,
      cambiar la política y registrar la decisión esperada antes de reanudar. Comparar solicitud, autorización y
      asiento simulado con un segundo revisor. Este procedimiento está propuesto; no se ejecutó contra un servicio
      bancario.
    figure:
      src: img/model-1.png
      caption: 'Diagrama sintético; no corresponde a una captura de un banco.

        La API del modelo guarda una autorización al aceptar la solicitud y el trabajador la utiliza después. La
        hipótesis plantea que un cambio de titularidad, límite o mandato podría no consultarse de nuevo. Debe comprobarse
        qué hechos quedan fijados y cuáles deben seguir siendo válidos al ejecutar.'
