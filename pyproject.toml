[project]
name = "report-gen"
version = "0.13.0"
description = "Generador propio de informes de pentesting: engagement.yaml como fuente de verdad, secciones canonicas activables, salida PDF/DOCX/MD consistente, editor local estilo SysReptor."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sebastian Latorre Munoz", email = "iphobiuss@proton.me" }]
license = "MIT"
dependencies = [
  "jinja2",
  "pyyaml",
  "markdown",
  "weasyprint",
  "pdfplumber",
  "python-docx",
  "flask>=3.1,<4",
  "nh3>=0.3.2,<0.4",
  "lxml>=5,<7",
  "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["cvss", "exporters"]
py-modules = ["engine", "export", "sections", "validate", "wizard", "safe_markup", "resources", "storage", "pdf_pagination", "workflows", "project_history", "evidence", "finding_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["out", "webapp/projects", "reports"]

[tool.ruff.lint]
# Lint de errores reales (Pyflakes + errores de sintaxis/runtime). El estilo
# (orden de imports, longitud de linea, etc.) se deja fuera del gate de CI.
select = ["E9", "F"]
