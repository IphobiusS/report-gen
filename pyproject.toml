[project]
name = "report-gen"
dynamic = ["version"]
description = "Generador propio de informes de pentesting: engagement.yaml como fuente de verdad, secciones canonicas activables, salida PDF/DOCX/MD/HTML consistente, editor local estilo SysReptor."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sebastian Latorre Munoz" }]
license = "MIT"
dependencies = [
  "jinja2",
  "pyyaml",
  "markdown",
  "pymdown-extensions==12.2",
  "weasyprint>=70",
  "tinycss2>=1.4,<2",
  "cssselect2>=0.8,<1",
  "pdfplumber",
  "pypdf>=6.1,<7",
  "pypdfium2>=5.13,<6",
  "python-docx",
  "flask>=3.1,<4",
  "waitress>=3.0.2,<4",
  "nh3>=0.3.2,<0.4",
  "lxml>=5,<7",
  "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "cryptography>=46,<52", "pymupdf>=1.26.7,<2"]
previews = ["pymupdf>=1.26.7,<2", "playwright>=1.56,<2"]
signing = ["cryptography>=46,<52"]
privacy = ["cryptography>=46,<52"]

[tool.setuptools]
packages = ["cvss", "exporters"]
py-modules = ["engine", "export", "sections", "validate", "wizard", "safe_markup", "resources", "storage", "pdf_pagination", "report_layout", "workflows", "project_history", "evidence", "finding_library", "input_guard", "delivery", "publication", "image_integrity", "portable_report", "diagnostics", "report_designs", "design_library", "design_render", "design_samples", "provider_branding", "workspace_backup", "backup_routine", "version", "export_jobs", "export_formats", "export_contract", "export_numbering", "export_semantics", "attachments", "private_data", "finding_imports", "scanner_imports", "report_compare", "pdf_compare", "pdf_comparison_reviews", "capture_inbox", "reusable_markup", "insights", "audience", "editorial_assistant", "visual_review", "readiness", "retest_compare", "retest_summary", "error_messages", "delivery_signature", "incremental_save", "launcher_upgrade", "private_backup", "privacy_ocr", "root_cause", "remediation_tasks", "workspace_paths", "project_catalog", "support_report", "remediation_return", "update_helper", "languages"]

[tool.setuptools.package-data]
exporters = ["fonts/*.ttf", "fonts/*.txt", "branding/*.svg", "branding/*.png", "branding/*.json", "branding/*.md"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["out", "webapp/projects", "reports"]

[tool.ruff.lint]
# Lint de errores reales (Pyflakes + errores de sintaxis/runtime). El estilo
# (orden de imports, longitud de linea, etc.) se deja fuera del gate de CI.
select = ["E9", "F"]
