name: Browser acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Create, save, export, inspect annexes and capture UI
        run: node scripts/audit-browser-0210.cjs --browser ${{ matrix.browser }} --output out/browser-${{ matrix.browser }}
      - name: Concurrent tabs, storage faults, crash recovery and privacy
        run: node scripts/audit-browser-0211.cjs --browser ${{ matrix.browser }} --output out/recovery-${{ matrix.browser }}
      - name: Portable HTML reflow, filters, anchors and printing
        if: matrix.browser == 'chromium'
        run: |
          export REPORT_GEN_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          python -m pytest tests/test_portable_report_browser.py tests/test_portable_literal_wrap_0321.py tests/test_portable_nested_flow_0322.py tests/test_portable_extreme_reflow_0323.py tests/test_portable_font_stability_0323.py --junitxml=out/portable-chromium.xml
      - name: Editor dialogs, import validation and mobile keyboard search
        if: matrix.browser == 'chromium'
        run: node tests/test_editor_browser_0213.cjs --output out/editor-chromium
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            out/browser-${{ matrix.browser }}/
            out/recovery-${{ matrix.browser }}/
            out/portable-chromium.xml
            out/editor-chromium/
