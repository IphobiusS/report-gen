name: Browser acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  knowledge_0440:
    name: Curated library, field guidance and work packages in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Exercise trilingual catalog and independent drafting
        run: npm run test:knowledge-browser
      - name: Preserve real screenshots and verification receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: knowledge-browser-0440-${{ github.sha }}
          path: out/knowledge-0440/
          if-no-files-found: error
          retention-days: 14

  onboarding_0430:
    name: Adaptive onboarding and isolated practice in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Real guided routes, mode switching, practice, keyboard and accessibility
        run: node tests/test_onboarding_browser_0430.cjs --output out/onboarding-0430
      - name: Preserve acceptance receipt and genuine screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: onboarding-0430-${{ github.sha }}
          path: out/onboarding-0430/
          if-no-files-found: error
          retention-days: 14

  senior_workflows_0420:
    name: Senior review, instances, HTTP and methodology in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - name: Install the actual Chromium browser
        run: |
          npx playwright install --with-deps chromium
          node -e "process.stdout.write('REPORT_GEN_CHROMIUM=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - name: Review queues, pinned evidence, selections and exact search targets
        run: node tests/test_review_workspace_0420_browser.cjs --output out/senior-workflows-0420/review-workspace
      - name: Independent instances, partial closure and recoverable forms
        if: ${{ !cancelled() }}
        run: node tests/test_instances_0420_browser.cjs --output out/senior-workflows-0420/instances
      - name: Versioned methodology, role matrices and causal paths
        if: ${{ !cancelled() }}
        run: node tests/test_assessment_0420_browser.cjs --output out/senior-workflows-0420/assessment
      - name: Reimport reconciliation with retained analyst decisions
        if: ${{ !cancelled() }}
        env:
          RG_RECONCILE_OUTPUT: out/senior-workflows-0420/reconciliation
        run: node tests/test_reconciliation_0420_browser.cjs
      - name: Private HTTP, selected HAR entries and reviewed publication
        if: ${{ !cancelled() }}
        run: node tests/test_http_evidence_0420_browser.cjs --output out/senior-workflows-0420/http-evidence
      - name: Build the full localized Aster case for UI acceptance
        if: ${{ !cancelled() }}
        run: python scripts/build-aster-case.py --output "$RUNNER_TEMP/aster-browser-0420"
      - name: Traverse Aster in all languages and capture genuine project screenshots
        if: ${{ !cancelled() }}
        run: node scripts/audit-aster-browser-0420.cjs --workspace "$RUNNER_TEMP/aster-browser-0420" --output out/senior-workflows-0420/aster
      - name: Preserve checks, failures and genuine screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: senior-workflows-0420-${{ github.sha }}
          path: out/senior-workflows-0420/
          if-no-files-found: error
          retention-days: 14

  context_index:
    name: Contextual index (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libpango-1.0-0 libpangocairo-1.0-0
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build the extensive localized Atlas input fixture
        run: python scripts/build-atlas-case.py --output "$RUNNER_TEMP/ux0400-case"
      - name: Exercise contextual navigation with real keyboard, pointer and responsive layout
        run: xvfb-run -a node scripts/audit-context-index-0400.cjs --projects "$RUNNER_TEMP/ux0400-case/projects" --output out/context-index-0400-${{ matrix.browser }} --browser ${{ matrix.browser }} --headed
      - name: Preserve exact navigation checks and real screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: context-index-0400-${{ matrix.browser }}-${{ github.sha }}
          path: out/context-index-0400-${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Create, save, export, inspect annexes and capture UI
        run: node scripts/audit-browser-0210.cjs --browser ${{ matrix.browser }} --output out/browser-${{ matrix.browser }}
      - name: Concurrent tabs, storage faults, crash recovery and privacy
        run: node scripts/audit-browser-0211.cjs --browser ${{ matrix.browser }} --output out/recovery-${{ matrix.browser }}
      - name: Portable HTML reflow, filters, anchors and printing
        if: matrix.browser == 'chromium'
        run: |
          export REPORT_GEN_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          python -m pytest tests/test_portable_report_browser.py tests/test_portable_literal_wrap_0321.py tests/test_portable_nested_flow_0322.py tests/test_portable_extreme_reflow_0323.py tests/test_portable_font_stability_0323.py tests/test_portable_cover_empty_0330.py tests/test_portable_inline_code_0330.py --junitxml=out/portable-chromium.xml
      - name: Literal URL preservation and descriptive link authoring
        if: matrix.browser == 'chromium'
        run: |
          export REPORT_GEN_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          export RG_PYTHON=python
          python -m pytest tests/test_docx_url_guidance_0330.py --junitxml=out/url-guidance-chromium.xml
      - name: Editor dialogs, import validation and mobile keyboard search
        if: matrix.browser == 'chromium'
        run: node tests/test_editor_browser_0213.cjs --output out/editor-chromium
      - name: Export polling pagehide and restoration
        if: matrix.browser == 'chromium'
        run: node tests/test_jobs_lifecycle_0345_browser.cjs --browser ${{ matrix.browser }} --output out/jobs-lifecycle-${{ matrix.browser }}
      - name: Restored interface language and accessible labels
        if: matrix.browser == 'chromium'
        run: node tests/test_restore_language_0345_browser.cjs --browser chromium --output out/restore-language-chromium
      - name: Spanish, English and Portuguese interface and report language independence
        if: matrix.browser == 'chromium'
        env:
          RG_PYTHON: python
        run: node tests/test_language_0350_browser.cjs --output out/language-0350
      - name: SARIF preview and rendered PDF comparison in three languages
        if: matrix.browser == 'chromium'
        env:
          RG_PYTHON: python
        run: npm run test:review-tools
      - name: Manual page pairing, saved review records and SARIF extensions
        env:
          RG_PYTHON: python
        run: node tests/test_features_0370_browser.cjs --browser ${{ matrix.browser }} --output out/features-0370
      - name: Painted native select contrast in both interface themes
        if: matrix.browser == 'chromium'
        run: node tests/test_select_contrast_0345_browser.cjs --browser chromium --output out/select-contrast-chromium
      - name: Markdown editor preserves multiline figure captions
        if: matrix.browser == 'chromium'
        run: node tests/test_markdown_caption_0345_browser.cjs --output out/markdown-caption-chromium
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            out/browser-${{ matrix.browser }}/
            out/recovery-${{ matrix.browser }}/
            out/portable-chromium.xml
            out/url-guidance-chromium.xml
            out/editor-chromium/
            out/jobs-lifecycle-${{ matrix.browser }}/
            out/restore-language-chromium/
            out/language-0350/
            out/features-0360/
            out/features-0370/
            out/select-contrast-chromium/
            out/markdown-caption-chromium/

  integration_0410:
    name: Integrated delivery and recoverable work (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk libpango-1.0-0 libpangocairo-1.0-0
      - run: python -m pip install -e '.[dev,previews]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Guided delivery, exact revision, audience and real downloads
        run: xvfb-run -a node scripts/audit-delivery-flow-0410.cjs --browser ${{ matrix.browser }} --output out/integration-0410/delivery-${{ matrix.browser }}
      - name: Save visual review and resume across server restarts
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: xvfb-run -a node scripts/audit-visual-persistence-0410.cjs --output out/integration-0410/visual-persistence
      - name: Recover auxiliary forms using real IndexedDB and explicit review
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: xvfb-run -a node tests/test_auxiliary_drafts_0410_browser.cjs --output out/integration-0410/auxiliary-drafts
      - name: Native graphical installer in Spanish, English and Portuguese
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: xvfb-run -a -s '-screen 0 1280x1000x24' python scripts/audit-install-wizard.py --output out/integration-0410/installer
      - name: Install the optional Python Chromium PDF runtime
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: python -m playwright install --with-deps chromium
      - name: Multipage finding tables through the actual Chromium PDF renderer
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        env:
          REPORT_GEN_TEST_CHROMIUM_PDF: '1'
          REPORT_GEN_TABLE_EVIDENCE: out/integration-0410/chromium-table-evidence
        run: python -m pytest tests/test_finding_table_flow_0410.py -k real_chromium --junitxml=out/integration-0410/chromium-tables.xml
      - name: Preserve exact checks, downloads and genuine screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-0410-${{ matrix.browser }}-${{ github.sha }}
          path: out/integration-0410/
          if-no-files-found: error
          retention-days: 14
