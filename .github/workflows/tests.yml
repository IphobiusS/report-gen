name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias del sistema (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements-audited.txt
      - name: Instalar dependencias de las pruebas del editor
        run: npm ci --ignore-scripts
      - name: Guardado JavaScript
        run: npm test
      - name: Instalar Chromium para las pruebas reales del editor
        run: |
          npx playwright install --with-deps chromium
          node -e "process.stdout.write('REPORT_GEN_CHROMIUM=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - name: Comprobar dependencias y colección de pruebas
        run: |
          python -m pip check
          python -m pytest --collect-only -q
      - name: Recorridos del editor y contratos del cliente
        run: |
          npm run test:workspace
          npm run test:editor
          npm run test:daily
          npm run test:delivery
          npm run test:finding
          npm run test:diff
          npm run test:matrix
          npm run test:language
          npm run test:ui-geometry
      - name: Ruff (lint)
        run: ruff check .
      - name: Comparar formatos con un caso ficticio completo
        run: python scripts/audit-exports-0210.py --output out/export-acceptance
      - name: Pytest
        run: python -m pytest -q --junitxml=out/pytest.xml
      - name: Conservar resultados de Pytest
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pytest-results
          path: out/pytest.xml
          if-no-files-found: ignore
