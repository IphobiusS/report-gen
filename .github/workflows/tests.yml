name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: Lint and JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install audited development dependencies
        run: python -m pip install -e ".[dev]" -c requirements-audited.txt
      - name: Dependency consistency and lint
        run: |
          python -m pip check
          ruff check .
      - run: npm ci --ignore-scripts
      - name: JavaScript save contracts
        run: |
          npm test
          npm run test:editor-modules
          RG_PYTHON=python node tests/test_delivery_flow_0410.cjs
          node --test tests/test_delivery_harness_0410.cjs
          node --test tests/test_publication_pending_0410.cjs
          RG_PYTHON=python node tests/test_auxiliary_drafts_0410.cjs
          npm run test:pdf-compare-ui
          npm run test:diagnostics-ui
          npm run test:docx-preview-ui
          node --test tests/test_language_0350_core.cjs
          RG_PYTHON=python node tests/test_language_0350_dom.cjs
          RG_PYTHON=python npm run test:sidebar
          RG_PYTHON=python npm run test:context-index
          RG_PYTHON=python npm run test:onboarding
          node --test tests/test_practice_0430.cjs
          RG_PYTHON=python node tests/test_onboarding_integration_0430.cjs
          node tests/test_atlas_browser_harness_0390.cjs
          RG_PYTHON=python node --test tests/test_portuguese_modules_0350.cjs
      - name: Senior workflow DOM and real Flask contracts
        env:
          RG_PYTHON: python
        run: |
          node tests/test_review_workspace_0420.cjs
          node --test tests/test_instances_ui_0420.cjs
          node tests/test_assessment_0420_ui.cjs
          node tests/test_http_evidence_0420.cjs
          node tests/test_review_exchange_0420.cjs
          node tests/test_tickets_ui_0420.cjs

  burp_bridge:
    name: Burp bridge against pinned official Montoya API
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify the compile-only official API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/burp-0420
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/montoya-api-2025.2.jar" \
            https://repo.maven.apache.org/maven2/net/portswigger/burp/extensions/montoya-api/2025.2/montoya-api-2025.2.jar
          echo "8da5acbdab1ad64f26e2151aa292b7afdcbee917f57d07442087d9bef0e7f29f  $RUNNER_TEMP/montoya-api-2025.2.jar" | sha256sum --check
          sha256sum "$RUNNER_TEMP/montoya-api-2025.2.jar" > out/burp-0420/compile-api.sha256
      - name: Compile and exercise real interfaces and local transport
        shell: bash
        run: |
          set -euo pipefail
          python integrations/burp-report-gen/build.py "$RUNNER_TEMP/montoya-api-2025.2.jar" --test 2>&1 | tee out/burp-0420/interface-transport.log
          cp integrations/burp-report-gen/build/report-gen-burp.jar out/burp-0420/
          sha256sum out/burp-0420/report-gen-burp.jar > out/burp-0420/extension.sha256
      - name: Preserve bridge artifact and bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: burp-bridge-0420-${{ github.sha }}
          path: out/burp-0420/
          if-no-files-found: error
          retention-days: 14

  aster:
    name: Aster complex reports and native DOCX (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [es, en, pt]
    env:
      REPORT_GEN_REQUIRE_MULTISCRIPT_FONTS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - name: Install actual native renderer and multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-core fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          fc-cache -f
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - name: Author the complete Spanish, English and Portuguese input projects
        run: python scripts/build-aster-case.py --output "$RUNNER_TEMP/aster/case"
      - name: Generate and inspect all four complete formats for this language
        run: python scripts/audit-aster-0420.py --projects "$RUNNER_TEMP/aster/case/projects" --output "$RUNNER_TEMP/aster/exports" --mode principal --languages "${{ matrix.language }}"
      - name: Inspect the generated DOCX using stable LibreOffice
        run: python scripts/audit-aster-0420.py --projects "$RUNNER_TEMP/aster/case/projects" --output "$RUNNER_TEMP/aster/exports" --mode native --languages "${{ matrix.language }}" --native-executable /usr/bin/libreoffice --require-stable
      - name: Preserve authored inputs and acceptance receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aster-0420-${{ matrix.language }}-receipts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aster/
            !${{ runner.temp }}/aster/exports/principal/**
            !${{ runner.temp }}/aster/exports/native/**
          if-no-files-found: error
          retention-days: 14
      - name: Preserve complete reports and native renderer evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aster-0420-${{ matrix.language }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aster/exports/principal/${{ matrix.language }}/
            ${{ runner.temp }}/aster/exports/native/${{ matrix.language }}/
            !${{ runner.temp }}/aster/exports/**/snapshot/**
          if-no-files-found: error
          retention-days: 14

  editor_exports:
    name: Editor journeys and four export formats
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -e ".[dev]" -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          node -e "process.stdout.write('REPORT_GEN_CHROMIUM=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - name: Editor journeys and client contracts
        run: |
          editor_contract_failed=0
          run_editor_contract() {
            printf 'RUN: %s\n' "$*"
            if "$@"; then
              printf 'PASS: %s\n' "$*"
            else
              editor_contract_status=$?
              printf 'FAIL (exit %s): %s\n' "$editor_contract_status" "$*"
              editor_contract_failed=1
            fi
          }
          run_editor_contract npm run test:workspace
          run_editor_contract npm run test:editor
          run_editor_contract npm run test:daily
          run_editor_contract npm run test:delivery
          run_editor_contract npm run test:finding
          run_editor_contract npm run test:diff
          run_editor_contract npm run test:matrix
          run_editor_contract npm run test:language
          run_editor_contract npm run test:ui-geometry
          run_editor_contract npm run test:first-use
          run_editor_contract npm run test:first-use-browser
          run_editor_contract npm run test:design-selection
          run_editor_contract npm run test:project-gallery
          run_editor_contract npm run test:tutorial
          run_editor_contract npm run test:pending-recovery
          run_editor_contract npm run test:scanner-imports
          run_editor_contract npm run test:private-tools
          run_editor_contract npm run test:root-causes
          run_editor_contract npm run test:remediation-tasks
          run_editor_contract npm run test:grouped-transfer
          run_editor_contract npm run test:project-catalog
          run_editor_contract npm run test:remediation-return
          run_editor_contract npm run test:workspace-isolation
          run_editor_contract npm run test:bulk-workbench
          run_editor_contract npm run test:remediation-delivery
          run_editor_contract npm run test:guided-update
          run_editor_contract npm run test:backup-routine
          exit "$editor_contract_failed"
      - name: Compare all four formats with a complete synthetic case
        run: python scripts/audit-exports-0210.py --output out/export-acceptance
      - name: Export evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: export-acceptance
          path: out/export-acceptance/
          if-no-files-found: ignore
      - name: First-use and design-selection browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: first-use-design-selection
          path: |
            out/first-use-0260/
            out/design-selection-0260/
            out/project-gallery-0330/
            out/visual-tutorial-0340/
            out/pending-recovery-0270/
            out/scanner-imports-0270/
            out/private-tools-0270/
            out/root-cause-0280/
            out/remediation-tasks-0280/
            out/grouped-findings-transfer-0280/
            out/project-catalog-0290/
            out/remediation-return-0290/
            out/workspace-browser-isolation-0290/
            out/bulk-workbench-0300/
            out/remediation-delivery-0300/
            out/guided-update-0300/
            out/backup-routine-0310/
          if-no-files-found: ignore

  scale:
    name: Image-heavy projects and external-review inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          node -e "process.stdout.write('REPORT_GEN_CHROMIUM=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - name: Measure two image-heavy projects and verify all four formats
        run: npm run test:scale
      - name: Prepare and structurally inspect seven DOCX inputs
        run: python scripts/prepare-external-acceptance.py --output out/external-acceptance-0310
      - name: Preserve measured results and pending external-review kit
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scale-and-external-inputs-${{ github.sha }}
          path: |
            out/workspace-scale-0310/
            out/external-acceptance-0310/
          if-no-files-found: error
          retention-days: 7

  pytest:
    name: Pytest shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -e ".[dev]" -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - name: Install Chromium for real rendering tests
        run: |
          npx playwright install --with-deps chromium
          node -e "process.stdout.write('REPORT_GEN_CHROMIUM=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - name: Run complete assigned modules
        run: python scripts/ci-pytest.py --count 4 --index ${{ matrix.shard }} --output out/pytest-${{ matrix.shard }}.json --junit out/pytest-${{ matrix.shard }}.xml
      - name: Preserve results and exact coverage receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: |
            out/pytest-${{ matrix.shard }}.json
            out/pytest-${{ matrix.shard }}.xml
          if-no-files-found: error

  test:
    name: test
    if: always()
    needs: [quick, burp_bridge, aster, editor_exports, scale, pytest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every independent gate
        env:
          QUICK: ${{ needs.quick.result }}
          BURP: ${{ needs.burp_bridge.result }}
          ASTER: ${{ needs.aster.result }}
          EDITOR: ${{ needs.editor_exports.result }}
          SCALE: ${{ needs.scale.result }}
          PYTEST: ${{ needs.pytest.result }}
        run: test "$QUICK" = success && test "$BURP" = success && test "$ASTER" = success && test "$EDITOR" = success && test "$SCALE" = success && test "$PYTEST" = success
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: pytest-shard-*
          merge-multiple: true
          path: out/shards
      - name: Prove every collected test ran exactly once
        run: python scripts/ci-pytest.py --verify out/shards/pytest-*.json
