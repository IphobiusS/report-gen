name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: Lint and JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install audited development dependencies
        run: python -m pip install -e ".[dev]" -c requirements-audited.txt
      - name: Dependency consistency and lint
        run: |
          python -m pip check
          ruff check .
      - run: npm ci --ignore-scripts
      - name: JavaScript save contracts
        run: |
          npm test
          npm run test:editor-modules

  editor_exports:
    name: Editor journeys and four export formats
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -e ".[dev]" -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          node -e "process.stdout.write('REPORT_GEN_CHROMIUM=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - name: Editor journeys and client contracts
        run: |
          npm run test:workspace
          npm run test:editor
          npm run test:daily
          npm run test:delivery
          npm run test:finding
          npm run test:diff
          npm run test:matrix
          npm run test:language
          npm run test:ui-geometry
          npm run test:first-use
          npm run test:first-use-browser
          npm run test:design-selection
          npm run test:pending-recovery
          npm run test:scanner-imports
          npm run test:private-tools
          npm run test:root-causes
          npm run test:remediation-tasks
          npm run test:grouped-transfer
          npm run test:project-catalog
          npm run test:remediation-return
          npm run test:workspace-isolation
          npm run test:bulk-workbench
          npm run test:remediation-delivery
          npm run test:guided-update
          npm run test:backup-routine
      - name: Compare all four formats with a complete synthetic case
        run: python scripts/audit-exports-0210.py --output out/export-acceptance
      - name: Export evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: export-acceptance
          path: out/export-acceptance/
          if-no-files-found: ignore
      - name: First-use and design-selection browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: first-use-design-selection
          path: |
            out/first-use-0260/
            out/design-selection-0260/
            out/pending-recovery-0270/
            out/scanner-imports-0270/
            out/private-tools-0270/
            out/root-cause-0280/
            out/remediation-tasks-0280/
            out/grouped-findings-transfer-0280/
            out/project-catalog-0290/
            out/remediation-return-0290/
            out/workspace-browser-isolation-0290/
            out/bulk-workbench-0300/
            out/remediation-delivery-0300/
            out/guided-update-0300/
            out/backup-routine-0310/
          if-no-files-found: ignore

  scale:
    name: Image-heavy projects and external-review inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          node -e "process.stdout.write('REPORT_GEN_CHROMIUM=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - name: Measure two image-heavy projects and verify all four formats
        run: npm run test:scale
      - name: Prepare and structurally inspect four DOCX inputs
        run: python scripts/prepare-external-acceptance.py --output out/external-acceptance-0310
      - name: Preserve measured results and pending external-review kit
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scale-and-external-inputs-${{ github.sha }}
          path: |
            out/workspace-scale-0310/
            out/external-acceptance-0310/
          if-no-files-found: error
          retention-days: 7

  pytest:
    name: Pytest shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
      - run: python -m pip install -e ".[dev]" -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - name: Install Chromium for real rendering tests
        run: |
          npx playwright install --with-deps chromium
          node -e "process.stdout.write('REPORT_GEN_CHROMIUM=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - name: Run complete assigned modules
        run: python scripts/ci-pytest.py --count 4 --index ${{ matrix.shard }} --output out/pytest-${{ matrix.shard }}.json --junit out/pytest-${{ matrix.shard }}.xml
      - name: Preserve results and exact coverage receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: |
            out/pytest-${{ matrix.shard }}.json
            out/pytest-${{ matrix.shard }}.xml
          if-no-files-found: error

  test:
    name: test
    if: always()
    needs: [quick, editor_exports, scale, pytest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every independent gate
        env:
          QUICK: ${{ needs.quick.result }}
          EDITOR: ${{ needs.editor_exports.result }}
          SCALE: ${{ needs.scale.result }}
          PYTEST: ${{ needs.pytest.result }}
        run: test "$QUICK" = success && test "$EDITOR" = success && test "$SCALE" = success && test "$PYTEST" = success
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: pytest-shard-*
          merge-multiple: true
          path: out/shards
      - name: Prove every collected test ran exactly once
        run: python scripts/ci-pytest.py --verify out/shards/pytest-*.json
