name: macOS compatibility

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: Native macOS Python ${{ matrix.python }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install native rendering libraries
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install audited development dependencies
        run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - name: Native process ownership and real export queue
        run: |
          python -m pytest tests/test_export_job_lifecycle_0341.py tests/test_progress_0170.py --junitxml=macos-results.xml
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-python-${{ matrix.python }}-${{ github.sha }}
          path: macos-results.xml
          if-no-files-found: error
