name: macOS compatibility

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safari:
    name: Native Apple Safari acceptance
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install native rendering and audited dependencies
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          python -m pip install -e '.[dev]' -c requirements-audited.txt
      - name: Enable Apple's native WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Real trilingual project and tutorial in native Safari
        timeout-minutes: 6
        run: python scripts/verify-native-safari.py --output out/native-safari
      - name: Preserve native browser identity, checks and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-safari-${{ github.sha }}
          path: out/native-safari/
          if-no-files-found: error

  macos:
    name: Native macOS Python ${{ matrix.python }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-audited.txt
      - name: Install native rendering libraries
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install audited development dependencies
        run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - name: Native process ownership and real export queue
        run: |
          python -m pytest tests/test_export_job_lifecycle_0341.py tests/test_progress_0170.py tests/test_portuguese_exports_0350.py tests/test_language_0350_launchers.py --junitxml=macos-results.xml
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-python-${{ matrix.python }}-${{ github.sha }}
          path: macos-results.xml
          if-no-files-found: error
