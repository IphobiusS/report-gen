name: Microsoft Word desktop acceptance
on:
  workflow_dispatch:
jobs:
  word:
    # Opt-in dedicated runner with licensed desktop Word. Never execute on PRs.
    runs-on: [self-hosted, Windows, report-gen-word]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate the synthetic acceptance DOCX
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]' -c requirements-audited.txt
          python export.py examples/quality-lab/engagement.yaml -f docx -o out/word-input/quality.docx
      - name: Update fields, save a copy and verify internal links
        shell: pwsh
        run: ./scripts/verify-microsoft-word.ps1 -InputDirectory out/word-input -OutputDirectory out/word-verified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-native-acceptance
          path: out/word-verified/
