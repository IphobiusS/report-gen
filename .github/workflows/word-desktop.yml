name: Microsoft Word desktop acceptance
on:
  workflow_dispatch:
jobs:
  word:
    # Opt-in dedicated runner with licensed desktop Word. Never execute on PRs.
    runs-on: [self-hosted, Windows, report-gen-word]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare synthetic long tables, images, fields and findings
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]' -c requirements-audited.txt
          python scripts/prepare-external-acceptance.py --output out/external-acceptance
      - name: Update fields, save a copy and verify internal links
        shell: pwsh
        run: ./scripts/verify-microsoft-word.ps1 -InputDirectory out/external-acceptance/word-input -OutputDirectory out/word-verified
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: word-native-acceptance
          path: |
            out/word-verified/
            out/external-acceptance/acceptance-preparation.json
