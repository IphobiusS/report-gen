name: R16 trilingual acceptance

on:
  push:
    branches: [main, feature/portuguese-r16]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estuario:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPORT_GEN_REQUIRE_MULTISCRIPT_FONTS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - name: Install native renderer and multiscript fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-core fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          fc-cache -f
          libreoffice --version
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - name: Record exact renderer and font versions
        run: |
          mkdir -p out/r16-runtime
          libreoffice --version > out/r16-runtime/libreoffice-version.txt
          fc-list : family file | sort > out/r16-runtime/fonts.txt
          python -m pip freeze > out/r16-runtime/python-packages.txt
          dpkg-query -W 'libreoffice*' 'fonts-noto*' > out/r16-runtime/system-packages.txt
      - name: Verify shaping, literal URLs, regional content and repeated cells
        run: python -m pytest tests/test_pdf_shaping_0350.py tests/test_pdf_simple_fonts_0350.py tests/test_pdf_hyphens_0315.py tests/test_pdf_finding_regions_0342.py tests/test_pdf_repeated_cells_0350.py tests/test_portuguese_exports_0350.py tests/test_root_cause_headings_0350.py --junitxml=out/r16-runtime/regressions.xml
      - name: Export and inspect the complete fictional case in ES, EN and PT
        run: python scripts/audit-estuario-r16.py --output out/estuario-r16
      - name: Render every DOCX with stable LibreOffice and preserve review pages
        run: python scripts/audit-estuario-native-r16.py --input out/estuario-r16 --output out/estuario-r16-native --executable /usr/bin/libreoffice
      - name: Preserve reports, original exports and rendered pages
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: estuario-r16-${{ github.sha }}
          path: |
            out/r16-runtime/
            out/estuario-r16/
            out/estuario-r16-native/
          if-no-files-found: error
          retention-days: 14

  horizonte:
    name: Horizonte banking case and complete project lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install real document and OCR engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer tesseract-ocr tesseract-ocr-eng fonts-dejavu fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-core fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          fc-cache -f
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Compose fictional project inputs without generating report documents
        run: python scripts/build-horizonte-case.py --output out/horizonte/case
      - name: Generate twelve reports only with report-gen and inspect DOCX with stable LibreOffice
        run: python scripts/audit-horizonte-exports.py --projects out/horizonte/case/projects --output out/horizonte/exports --mode principal --native-executable /usr/bin/libreoffice --require-stable
      - name: Exercise evidence, import, remediation, audiences, signatures and recovery
        run: python scripts/audit-horizonte-lifecycle.py --case out/horizonte/case/projects/es --output out/horizonte/lifecycle --ui-bundle out/horizonte/horizonte-ui-input.zip --pdf out/horizonte/exports/principal/es/outputs/informe.pdf
      - name: Verify mandatory PDF annexes, pending severity and group removal
        run: python scripts/audit-horizonte-supplement.py --case out/horizonte/case/projects/es --pdf out/horizonte/exports/principal/es/outputs/informe.pdf --output out/horizonte/supplement
      - name: Traverse the real editor, tutorial and banking project in Chromium
        run: |
          node scripts/audit-horizonte-browser.cjs \
            --bundle out/horizonte/horizonte-ui-input.zip \
            --project-dir out/horizonte/case/projects/es \
            --input-dir out/horizonte/case/inputs \
            --before-pdf out/horizonte/lifecycle/audiences/executive.pdf \
            --after-pdf out/horizonte/lifecycle/audiences/public.pdf \
            --slug horizonte-es --allow-export --output out/horizonte/browser
      - name: Create from gallery, reorder report sections and record a declared visual observation
        run: node scripts/audit-horizonte-authoring.cjs --bundle out/horizonte/horizonte-ui-input.zip --project-dir out/horizonte/case/projects/es --pdf out/horizonte/exports/principal/es/outputs/informe.pdf --slug horizonte-authoring --output out/horizonte/authoring
      - name: Exercise catalog filters, failed saves, retries and private draft recovery
        run: node scripts/audit-horizonte-recovery.cjs --bundle out/horizonte/horizonte-ui-input.zip --project-dir out/horizonte/case/projects/es --slug horizonte-recovery --output out/horizonte/recovery
      - name: Query official updates with explicit network consent and preserve source bytes
        run: python scripts/audit-horizonte-updater.py --case out/horizonte/case/projects/es --output out/horizonte/updater --allow-network
      - name: Preserve exact inputs, reports, acceptance receipts and real screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: horizonte-${{ github.sha }}
          path: |
            out/horizonte/case/
            out/horizonte/exports/
            out/horizonte/lifecycle/results.json
            out/horizonte/lifecycle/audiences/
            out/horizonte/lifecycle/diagnostics-sanitized.json
            out/horizonte/supplement/results.json
            out/horizonte/supplement/scope.json
            out/horizonte/supplement/pending-severity-delivery-manifest.json
            out/horizonte/horizonte-ui-input.zip
            out/horizonte/browser/
            out/horizonte/authoring/
            out/horizonte/recovery/
            out/horizonte/updater/results.json
          if-no-files-found: error
          retention-days: 14
