name: R16 trilingual acceptance

on:
  push:
    branches: [main, feature/portuguese-r16]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estuario:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPORT_GEN_REQUIRE_MULTISCRIPT_FONTS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - name: Install native renderer and multiscript fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-core fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          fc-cache -f
          libreoffice --version
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - name: Record exact renderer and font versions
        run: |
          mkdir -p out/r16-runtime
          libreoffice --version > out/r16-runtime/libreoffice-version.txt
          fc-list : family file | sort > out/r16-runtime/fonts.txt
          python -m pip freeze > out/r16-runtime/python-packages.txt
          dpkg-query -W 'libreoffice*' 'fonts-noto*' > out/r16-runtime/system-packages.txt
      - name: Verify shaping, literal URLs, regional content and repeated cells
        run: python -m pytest tests/test_pdf_shaping_0350.py tests/test_pdf_simple_fonts_0350.py tests/test_pdf_hyphens_0315.py tests/test_pdf_finding_regions_0342.py tests/test_pdf_repeated_cells_0350.py tests/test_portuguese_exports_0350.py tests/test_root_cause_headings_0350.py --junitxml=out/r16-runtime/regressions.xml
      - name: Export and inspect the complete fictional case in ES, EN and PT
        run: python scripts/audit-estuario-r16.py --output out/estuario-r16
      - name: Render every DOCX with stable LibreOffice and preserve review pages
        run: python scripts/audit-estuario-native-r16.py --input out/estuario-r16 --output out/estuario-r16-native --executable /usr/bin/libreoffice
      - name: Preserve reports, original exports and rendered pages
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: estuario-r16-${{ github.sha }}
          path: |
            out/r16-runtime/
            out/estuario-r16/
            out/estuario-r16-native/
          if-no-files-found: error
          retention-days: 14

  horizonte:
    name: Horizonte banking case and complete project lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RG_PYTHON: python
    steps:
      - name: Keep acceptance data outside the installation
        run: echo "HORIZONTE_OUTPUT=$RUNNER_TEMP/horizonte" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install real document and OCR engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer tesseract-ocr tesseract-ocr-eng fonts-dejavu fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-core fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          fc-cache -f
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Compose fictional project inputs without generating report documents
        run: python scripts/build-horizonte-case.py --output "$HORIZONTE_OUTPUT/case"
      - name: Generate twelve reports only with report-gen and inspect DOCX with stable LibreOffice
        run: python scripts/audit-horizonte-exports.py --projects "$HORIZONTE_OUTPUT/case/projects" --output "$HORIZONTE_OUTPUT/exports" --mode principal --native-executable /usr/bin/libreoffice --require-stable
      - name: Exercise evidence, import, remediation, audiences, signatures and recovery
        run: python scripts/audit-horizonte-lifecycle.py --case "$HORIZONTE_OUTPUT/case/projects/es" --output "$HORIZONTE_OUTPUT/lifecycle" --ui-bundle "$HORIZONTE_OUTPUT/horizonte-ui-input.zip" --pdf "$HORIZONTE_OUTPUT/exports/principal/es/outputs/informe.pdf"
      - name: Verify mandatory PDF annexes, pending severity and group removal
        if: ${{ !cancelled() }}
        run: python scripts/audit-horizonte-supplement.py --case "$HORIZONTE_OUTPUT/case/projects/es" --pdf "$HORIZONTE_OUTPUT/exports/principal/es/outputs/informe.pdf" --output "$HORIZONTE_OUTPUT/supplement"
      - name: Traverse the real editor, tutorial and banking project in Chromium
        if: ${{ !cancelled() }}
        run: |
          node scripts/audit-horizonte-browser.cjs \
            --bundle "$HORIZONTE_OUTPUT/horizonte-ui-input.zip" \
            --project-dir "$HORIZONTE_OUTPUT/case/projects/es" \
            --input-dir "$HORIZONTE_OUTPUT/case/inputs" \
            --before-pdf "$HORIZONTE_OUTPUT/lifecycle/audiences/executive.pdf" \
            --after-pdf "$HORIZONTE_OUTPUT/lifecycle/audiences/public.pdf" \
            --slug horizonte-es --allow-export --output "$HORIZONTE_OUTPUT/browser"
      - name: Create from gallery, reorder report sections and record a declared visual observation
        if: ${{ !cancelled() }}
        run: node scripts/audit-horizonte-authoring.cjs --bundle "$HORIZONTE_OUTPUT/horizonte-ui-input.zip" --project-dir "$HORIZONTE_OUTPUT/case/projects/es" --pdf "$HORIZONTE_OUTPUT/exports/principal/es/outputs/informe.pdf" --slug horizonte-authoring --output "$HORIZONTE_OUTPUT/authoring"
      - name: Exercise catalog filters, failed saves, retries and private draft recovery
        if: ${{ !cancelled() }}
        run: node scripts/audit-horizonte-recovery.cjs --bundle "$HORIZONTE_OUTPUT/horizonte-ui-input.zip" --project-dir "$HORIZONTE_OUTPUT/case/projects/es" --slug horizonte-recovery --output "$HORIZONTE_OUTPUT/recovery"
      - name: Query official updates with explicit network consent and preserve source bytes
        if: ${{ !cancelled() }}
        run: python scripts/audit-horizonte-updater.py --case "$HORIZONTE_OUTPUT/case/projects/es" --output "$HORIZONTE_OUTPUT/updater" --allow-network
      - name: Preserve exact inputs, reports, acceptance receipts and real screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: horizonte-${{ github.sha }}
          path: |
            ${{ runner.temp }}/horizonte/case/
            ${{ runner.temp }}/horizonte/exports/
            ${{ runner.temp }}/horizonte/lifecycle/results.json
            ${{ runner.temp }}/horizonte/lifecycle/audiences/
            ${{ runner.temp }}/horizonte/lifecycle/diagnostics-sanitized.json
            ${{ runner.temp }}/horizonte/supplement/results.json
            ${{ runner.temp }}/horizonte/supplement/scope.json
            ${{ runner.temp }}/horizonte/supplement/pending-severity-delivery-manifest.json
            ${{ runner.temp }}/horizonte/horizonte-ui-input.zip
            ${{ runner.temp }}/horizonte/browser/
            ${{ runner.temp }}/horizonte/authoring/
            ${{ runner.temp }}/horizonte/recovery/
            ${{ runner.temp }}/horizonte/updater/results.json
          if-no-files-found: error
          retention-days: 14

  meridiano:
    name: Meridiano logistics case and 0.38 feature acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RG_PYTHON: python
      REPORT_GEN_LIBREOFFICE: /usr/bin/libreoffice
    steps:
      - name: Keep acceptance data outside the installation
        run: echo "MERIDIANO_OUTPUT=$RUNNER_TEMP/meridiano" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audited.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install stable document renderer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-core fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          fc-cache -f
          libreoffice --version
      - run: python -m pip install -e '.[dev]' -c requirements-audited.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Compose the fictional source inputs
        run: python scripts/build-meridiano-case.py --output "$MERIDIANO_OUTPUT/case"
      - name: Generate twelve complete reports and twenty-eight targeted samples only with report-gen
        run: python scripts/audit-meridiano-exports.py --projects "$MERIDIANO_OUTPUT/case/projects" --output "$MERIDIANO_OUTPUT/exports" --mode all --native-executable /usr/bin/libreoffice --require-stable
      - name: Inspect decoded outputs for the four named synthetic privacy controls
        run: python scripts/audit-meridiano-publication.py --exports "$MERIDIANO_OUTPUT/exports" --case "$MERIDIANO_OUTPUT/case" --output "$MERIDIANO_OUTPUT/publication-scan.json"
      - name: Exercise imports, audiences, PDF annex inspection and immutable DOCX preview
        run: python scripts/audit-meridiano-api.py --case "$MERIDIANO_OUTPUT/case/projects/es" --inputs "$MERIDIANO_OUTPUT/case/inputs" --pdf "$MERIDIANO_OUTPUT/exports/principal/es/outputs/informe.pdf" --output "$MERIDIANO_OUTPUT/api" --ui-bundle "$MERIDIANO_OUTPUT/meridiano-project.zip" --require-stable-native
      - name: Traverse the new features and inspect the native PDF viewer in headed Chromium
        if: ${{ !cancelled() }}
        run: xvfb-run -a node scripts/audit-meridiano-browser.cjs --headed --bundle "$MERIDIANO_OUTPUT/meridiano-project.zip" --project-dir "$MERIDIANO_OUTPUT/case/projects/es" --pdf "$MERIDIANO_OUTPUT/exports/principal/es/outputs/informe.pdf" --output "$MERIDIANO_OUTPUT/browser"
      - name: Preserve exact reports, checks and native inspection
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: meridiano-${{ github.sha }}
          path: |
            ${{ runner.temp }}/meridiano/
          if-no-files-found: error
          retention-days: 14
