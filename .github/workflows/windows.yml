name: Windows compatibility

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-pango
          update: true
      - name: Locate Pango libraries
        shell: msys2 {0}
        run: echo "WEASYPRINT_DLL_DIRECTORIES=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      - name: Install audited Python and JavaScript dependencies
        run: |
          python -m pip install -e ".[dev,previews]" -c requirements-audited.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native export lifecycle and regression checks
        run: |
          python -m pytest tests/test_export_job_lifecycle_0341.py tests/test_pdf_render_budget_0341.py tests/test_pdf_page_map_reuse_0341.py tests/test_word_header_spacing_0341.py tests/test_word_table_chapter_0341.py --junitxml=windows-lifecycle-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guardado, importación, entrega, historial y cancelación
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:editor-modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_progress_0170.py tests/test_workflows.py tests/test_workspace_0160.py tests/test_workbench_0180.py tests/test_release_0200.py tests/test_release_0202.py tests/test_release_0210.py tests/test_release_0211.py tests/test_launcher_0260.py tests/test_checkout_integrity_0260.py tests/test_workspace_paths_0290.py tests/test_browser_workspace_0290.py tests/test_project_catalog_0290.py tests/test_remediation_return_0290.py tests/test_backup_routine_0310.py tests/test_project_names_portable_0311.py tests/test_design_restore_metadata_0311.py tests/test_export_boundary_audit.py tests/test_storage_boundaries_round2.py tests/test_history_input_0312.py --junitxml=windows-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real browser on Windows
        run: |
          node scripts/audit-browser-0210.cjs --output windows-evidence/base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/audit-browser-0211.cjs --output windows-evidence/recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scheduled backup controls on Windows
        run: |
          npm run test:backup-routine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save evidence (Microsoft Word is not installed on this runner)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-compatibility
          path: |
            windows-results.xml
            windows-lifecycle-results.xml
            windows-evidence/
            out/backup-routine-0310/
