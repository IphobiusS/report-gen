name: Windows compatibility

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RG_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-pango
          update: true
      - name: Locate Pango libraries
        shell: msys2 {0}
        run: echo "WEASYPRINT_DLL_DIRECTORIES=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      - name: Install audited Python and JavaScript dependencies
        run: |
          python -m pip install -e ".[dev,previews]" -c requirements-audited.txt
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Guardado, importación, entrega, historial y cancelación
        run: |
          npm test
          python -m pytest tests/test_progress_0170.py tests/test_workflows.py tests/test_workspace_0160.py tests/test_workbench_0180.py tests/test_release_0200.py tests/test_release_0202.py tests/test_release_0210.py tests/test_release_0211.py --junitxml=windows-results.xml
      - name: Real browser on Windows
        run: |
          node scripts/audit-browser-0210.cjs --output windows-evidence/base
          node scripts/audit-browser-0211.cjs --output windows-evidence/recovery
      - name: Save evidence (Microsoft Word is not installed on this runner)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-compatibility
          path: |
            windows-results.xml
            windows-evidence/
