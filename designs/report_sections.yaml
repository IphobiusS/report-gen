# CATALOGO CANONICO UNIFICADO de secciones de informe.
# Un solo nombre por concepto: no "alto nivel vs ejecutivo", sino "Resumen ejecutivo".
# Cada certificacion (OSCP, CAPE, CPTS, CWES...) es solo una SELECCION de estas secciones.
# Bilingue: title_es/en y label_es/en. El idioma lo elige meta.lang (toggle ES/EN).
# 'special' invoca un renderizador propio (portada, contactos, alcance, resumen,
# hallazgos, apendice); el resto se renderiza generico desde 'fields'.
# order = orden canonico sugerido. Los modulos NO son excluyentes.

sections:
  - key: confidentiality
    required: true
    group: portada
    order: 10
    title_es: "Declaración de confidencialidad"
    title_en: "Statement of Confidentiality"
    on_by_default: true
    fields:
      - {key: body, type: markdown, label_es: "Texto", label_en: "Body", optional: true, default_lang: confidentiality}

  - key: document_control
    group: portada
    order: 20
    title_es: "Control del documento"
    title_en: "Document Control"
    on_by_default: false
    fields:
      - {key: version_history, type: table, label_es: "Historial de versiones", label_en: "Version History",
         columns: [{key: version, label_es: Versión, label_en: Version}, {key: date, label_es: Fecha, label_en: Date}, {key: author, label_es: Autor, label_en: Author}, {key: notes, label_es: Notas, label_en: Notes}]}
      - {key: distribution, type: markdown, label_es: "Distribución", label_en: "Distribution", optional: true}

  - key: contacts
    group: portada
    order: 30
    title_es: "Contactos del engagement"
    title_en: "Engagement Contacts"
    special: contacts
    on_by_default: true
    fields: []

  - key: executive_summary
    group: ejecutivo
    order: 40
    title_es: "Resumen ejecutivo"
    title_en: "Executive Summary"
    on_by_default: true
    fields:
      - {key: summary, type: markdown, label_es: "Resumen ejecutivo", label_en: "Executive Summary"}

  - key: risk_posture
    group: ejecutivo
    order: 50
    title_es: "Postura de riesgo e impacto de negocio"
    title_en: "Risk Posture and Business Impact"
    on_by_default: false
    fields:
      - {key: posture, type: markdown, label_es: "Postura de riesgo", label_en: "Risk posture"}

  - key: strategic_recommendations
    group: ejecutivo
    order: 60
    title_es: "Recomendaciones estratégicas"
    title_en: "Strategic Recommendations"
    on_by_default: false
    fields:
      - {key: recommendations, type: markdown, label_es: "Recomendaciones", label_en: "Recommendations"}

  - key: scope
    group: alcance
    order: 70
    title_es: "Alcance y objetivos"
    title_en: "Scope and Objectives"
    special: scope
    on_by_default: true
    fields:
      - {key: objectives, type: markdown, label_es: "Objetivos", label_en: "Objectives", optional: true}
      - {key: assumptions, type: markdown, label_es: "Supuestos y limitaciones", label_en: "Assumptions and Limitations", optional: true}

  - key: methodology
    group: alcance
    order: 80
    title_es: "Enfoque y metodología"
    title_en: "Approach and Methodology"
    on_by_default: false
    fields:
      - {key: approach, type: markdown, label_es: "Enfoque", label_en: "Approach", optional: true}
      - {key: standards, type: markdown, label_es: "Estándares y marcos (OWASP, PTES, MITRE ATT&CK)", label_en: "Standards and Frameworks", optional: true}
      - {key: information_gathering, type: markdown, label_es: "Recopilación de información", label_en: "Information Gathering", optional: true}
      - {key: enumeration, type: markdown, label_es: "Enumeración de servicios", label_en: "Service Enumeration", optional: true}
      - {key: exploitation, type: markdown, label_es: "Explotación", label_en: "Exploitation", optional: true}
      - {key: post_exploitation, type: markdown, label_es: "Post explotación / mantenimiento de acceso", label_en: "Post Exploitation", optional: true}
      - {key: cleanup, type: markdown, label_es: "Limpieza", label_en: "Cleanup", optional: true}

  - key: findings_summary
    required: true
    group: hallazgos
    order: 90
    title_es: "Resumen de hallazgos"
    title_en: "Findings Summary"
    special: summary
    on_by_default: true
    fields: []

  - key: findings
    required: true
    group: hallazgos
    order: 100
    title_es: "Hallazgos"
    title_en: "Findings"
    special: findings
    on_by_default: true
    fields: []

  - key: attack_narrative
    group: hallazgos
    order: 110
    title_es: "Narrativa del ataque"
    title_en: "Attack Narrative"
    on_by_default: false
    fields:
      - {key: narrative, type: markdown, label_es: "Narrativa del ataque", label_en: "Attack Narrative"}

  - key: remediation_plan
    group: hallazgos
    order: 120
    title_es: "Plan de remediación"
    title_en: "Remediation Plan"
    on_by_default: false
    fields:
      - {key: overview, type: markdown, label_es: "Resumen del plan", label_en: "Overview", optional: true}
      - {key: short_term, type: markdown, label_es: "Corto plazo", label_en: "Short Term", optional: true}
      - {key: medium_term, type: markdown, label_es: "Mediano plazo", label_en: "Medium Term", optional: true}
      - {key: long_term, type: markdown, label_es: "Largo plazo", label_en: "Long Term", optional: true}

  - key: appendix
    group: apendices
    order: 200
    title_es: "Apéndices"
    title_en: "Appendices"
    special: appendix
    on_by_default: true
    fields:
      - {key: host_service_discovery, type: markdown, label_es: "Descubrimiento de hosts y servicios", label_en: "Host & Service Discovery", optional: true}
      - {key: exploited_hosts, type: markdown, label_es: "Hosts explotados", label_en: "Exploited Hosts", optional: true}
      - {key: compromised_users, type: markdown, label_es: "Usuarios comprometidos", label_en: "Compromised Users", optional: true}
      - {key: changes_cleanup, type: markdown, label_es: "Cambios realizados y limpieza", label_en: "Changes and Cleanup", optional: true}
      - {key: tools_used, type: markdown, label_es: "Herramientas utilizadas", label_en: "Tools Used", optional: true}
      - {key: glossary, type: markdown, label_es: "Glosario", label_en: "Glossary", optional: true}

