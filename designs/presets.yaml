      - {key: findings, title: "Technical Findings Details"}
      - {key: appendix_a, title: "Appendix A - Finding Severities", body: {es: "Escala de severidad (CVSS) y criterios.", en: "Severity scale (CVSS) and criteria."}}
      - {key: appendix_b, title: "Appendix B - Host & Service Discovery", body: {es: "Hosts y servicios descubiertos.", en: "Discovered hosts and services."}}
      - {key: appendix_c, title: "Appendix C - Subdomain Discovery", body: {es: "Subdominios y superficie descubierta.", en: "Discovered subdomains and surface."}}
      - {key: appendix_d, title: "Appendix D - Exploited Hosts", body: {es: "Hosts comprometidos y via de acceso.", en: "Compromised hosts and access path."}}
      - {key: appendix_e, title: "Appendix E - Compromised Users", body: {es: "Cuentas comprometidas y su privilegio.", en: "Compromised accounts and their privilege."}}
      - {key: appendix_f, title: "Appendix F - Changes / Host Cleanup", body: {es: "Cambios realizados y limpieza efectuada.", en: "Changes made and cleanup performed."}}
      - {key: appendix_g, title: "Appendix G - Flags Discovered", body: {es: "Flags recolectadas durante la evaluacion.", en: "Flags collected during the assessment."}}

