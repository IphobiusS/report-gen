# Presets de secciones para nuevos proyectos.
#
# Los nombres "estilo OSCP" / "estilo HTB" son descriptivos y solo indican el tipo
# de informe al que se parecen. report-gen NO esta afiliado, asociado ni respaldado
# por OffSec, Hack The Box ni ninguna certificacion, y no reproduce sus plantillas
# oficiales. Son puntos de partida genericos que enciendes y editas.

presets:
  - id: base
    name_es: "Base (por defecto)"
    name_en: "Base (default)"
    desc_es: "Secciones por defecto del catalogo."
    desc_en: "Catalog default sections."
    theme: serio
    accent: "#39ff14"
    sections: []          # vacio => usa default_enabled()

  - id: client
    name_es: "Pentest para cliente"
    name_en: "Client pentest"
    desc_es: "Informe profesional: resumen ejecutivo, alcance, metodologia, hallazgos con CVSS y plan de remediacion."
    desc_en: "Professional report: executive summary, scope, methodology, findings with CVSS and remediation plan."
    theme: corporativo
    accent: "#1f5fa8"
    sections:
      - {key: confidentiality}
      - {key: contacts}
      - key: executive_summary
        content:
          summary:
            es: "Entre [fecha inicio] y [fecha fin] se realizo una evaluacion de seguridad de [alcance]. Se identificaron N hallazgos (X criticos, Y altos, Z medios). El riesgo principal es [describir]. Se recomienda priorizar la correccion de los hallazgos critico y alto de forma inmediata."
            en: "Between [start date] and [end date] a security assessment of [scope] was performed. N findings were identified (X critical, Y high, Z medium). The main risk is [describe]. Prioritising the critical and high findings is recommended."
      - key: scope
        content:
          objectives:
            es: "El objetivo fue identificar y explotar vulnerabilidades en [aplicacion/red], determinando el impacto real sobre confidencialidad, integridad y disponibilidad."
            en: "The goal was to identify and exploit vulnerabilities in [application/network], assessing the real impact on confidentiality, integrity and availability."
          assumptions:
            es: "Modalidad [grey/black/white]-box. Fuera de alcance: DoS, ingenieria social y terceros. Ventana: [fechas/horario]."
            en: "[grey/black/white]-box. Out of scope: DoS, social engineering and third parties. Window: [dates/hours]."
      - key: methodology
        content:
          approach:
            es: "La evaluacion siguio un enfoque alineado con OWASP WSTG / PTES: reconocimiento, enumeracion, explotacion, post-explotacion y verificacion de la remediacion."
            en: "The assessment followed an OWASP WSTG / PTES aligned approach: reconnaissance, enumeration, exploitation, post-exploitation and remediation verification."
      - {key: findings_summary}
      - {key: findings}
      - key: remediation_plan
        content:
          overview:
            es: "Plan de remediacion priorizado por riesgo. Corregir primero critico/alto."
            en: "Risk-prioritised remediation plan. Fix critical/high first."
      - {key: appendix}

  - id: exam
    name_es: "Examen de certificacion (estilo OSCP)"
    name_en: "Certification exam (OSCP-style)"
    desc_es: "Informe por host: resumen de alto nivel, metodologia (recopilacion, enumeracion, penetracion, mantenimiento de acceso, limpieza), hosts comprometidos con pasos y flags, y apendices. No oficial."
    desc_en: "Host-based report: high-level summary, methodology (gathering, enumeration, penetration, maintaining access, cleanup), compromised hosts with steps and flags, and appendices. Unofficial."
    theme: offsec
    accent: "#1b3a5b"
    sections:
      - {key: confidentiality, title: "Statement of Confidentiality"}
      - key: executive_summary
        title: "High-Level Summary"
        content:
          summary:
            es: "Introduccion, objetivo y requisitos del examen. Se obtuvo acceso inicial y escalada a administrador/root en [N] de [M] objetivos; las flags local.txt y proof.txt se recolectaron como evidencia."
            en: "Exam introduction, objective and requirements. Initial access and escalation to administrator/root were achieved on [N] of [M] targets; local.txt and proof.txt flags were collected as evidence."
      - key: methodology
        title: "Methodologies"
        content:
          information_gathering: {es: "Recopilacion de informacion del objetivo.", en: "Target information gathering."}
          enumeration: {es: "Enumeracion de servicios (nmap, servicios web/SMB, etc.).", en: "Service enumeration (nmap, web/SMB services, etc.)."}
          exploitation: {es: "Penetracion: explotacion del vector para obtener shell inicial.", en: "Penetration: exploiting the vector to obtain an initial shell."}
          post_exploitation: {es: "Mantenimiento de acceso y escalada de privilegios.", en: "Maintaining access and privilege escalation."}
          cleanup: {es: "Limpieza: reversion de cambios realizados durante el examen.", en: "House cleaning: reverting changes made during the exam."}
      - {key: findings, title: "Compromised Hosts"}
      - key: appendix_flags
        title: "Appendix - Proof and Local Flags"
        body:
          es: "Tabla de flags (local.txt / proof.txt) recolectadas por objetivo."
          en: "Table of flags (local.txt / proof.txt) collected per target."

  - id: cpts
    family: htb
    cert_es: "CPTS \u2014 Pentest de red"
    cert_en: "CPTS \u2014 Network pentest"
    name_es: "Certificacion HTB (estilo CPTS)"
    name_en: "HTB certification (CPTS-style)"
    desc_es: "Pentest de red: resumen ejecutivo, resumen de la evaluacion, walkthrough del compromiso, remediacion, detalle tecnico de hallazgos y apendices. No oficial."
    desc_en: "Network pentest: executive summary, assessment summary, compromise walkthrough, remediation, technical findings details and appendices. Unofficial."
    theme: htb
    accent: "#5a8f2a"
    sections:
      - {key: confidentiality, title: "Statement of Confidentiality"}
      - {key: contacts, title: "Engagement Contacts"}
      - key: executive_summary
        title: "Executive Summary"
        content:
          summary:
            es: "Enfoque, alcance y vision general de la evaluacion. Se comprometieron [N] sistemas y se alcanzo [control del dominio] mediante [cadena de ataque]."
            en: "Approach, scope and assessment overview. [N] systems were compromised and [domain control] was achieved via [attack chain]."
      - {key: findings_summary, title: "Assessment Summary"}
      - key: attack_narrative
        title: "Internal Compromise Walkthrough"
        content:
          narrative:
            es: "Walkthrough detallado del compromiso de extremo a extremo:\n1. [Foothold] via [vector].\n2. [Movimiento lateral] hacia [host].\n3. [Escalada de dominio] hasta [DA]."
            en: "Detailed end-to-end compromise walkthrough:\n1. [Foothold] via [vector].\n2. [Lateral movement] to [host].\n3. [Domain escalation] to [DA]."
      - key: remediation_plan
        title: "Remediation Summary"
        content:
          short_term: {es: "Acciones inmediatas (dias).", en: "Immediate actions (days)."}
          medium_term: {es: "Acciones a medio plazo (semanas).", en: "Medium-term actions (weeks)."}
          long_term: {es: "Mejoras estructurales (meses).", en: "Structural improvements (months)."}
      - {key: findings, title: "Technical Findings Details"}
      - {key: appendix_a, title: "Appendix A - Finding Severities", body: {es: "Escala de severidad usada (CVSS) y criterios.", en: "Severity scale used (CVSS) and criteria."}}
      - {key: appendix_b, title: "Appendix B - Exploited Hosts", body: {es: "Hosts comprometidos y via de acceso.", en: "Compromised hosts and access path."}}
      - {key: appendix_c, title: "Appendix C - Compromised Users", body: {es: "Cuentas comprometidas y su privilegio.", en: "Compromised accounts and their privilege."}}
      - {key: appendix_d, title: "Appendix D - Changes / Host Cleanup", body: {es: "Cambios realizados y limpieza efectuada.", en: "Changes made and cleanup performed."}}
      - {key: appendix_e, title: "Appendix E - Domain Password Review", body: {es: "Analisis de contrasenas del dominio.", en: "Domain password review."}}

