findings:
- id: F1
  mode: vuln
  title: Inyección de comandos del sistema en la herramienta de exportación del servidor MCP
  severity: critical
  cvss: '9.9'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H
  cwe: 'CWE-78: Neutralización incorrecta de elementos especiales usados en un comando de SO'
  affected: mcp.demolab.example
  description_md: |
    **DEMOSTRACIÓN SINTÉTICA. No se contactó ningún sistema ni se ejecutaron pruebas.**

    El servidor MCP expone una herramienta llamada `create_newsletter_subscriber_export` que
    construye una lista de suscriptores y la entrega a una rutina de envío de correo. El parámetro
    `domain_filter` se concatena directamente en un comando de shell sin escape ni validación, por
    lo que cualquier metacaracter de shell que envíe quien invoca la herramienta lo interpreta el
    `/bin/sh` subyacente. Como la herramienta es alcanzable por cualquier cliente MCP autenticado,
    un usuario con pocos privilegios puede ejecutar comandos arbitrarios del sistema en el host.
  impact_md: |
    Un atacante que alcance el endpoint MCP obtiene ejecución remota de código como la cuenta de
    servicio `DEMO_MCP_SERVICE`. Desde ahí queda expuesto todo el backend de la aplicación: lectura de
    secretos y credenciales de correo, pivote a servicios internos y escalada posterior a root. Es
    un compromiso total del host MCP.
  remediation_md: |
    Nunca pasar entrada del usuario a una shell. Reemplazar el envío por shell por una librería de
    correo nativa (`smtplib`) y una lista de argumentos, y rechazar cualquier `domain_filter` que no
    sea un hostname estricto. Si un subproceso es inevitable, usar `subprocess.run([...])` con un
    vector de argumentos explícito y `shell=False`.
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://owasp.org/www-community/attacks/Command_Injection
  walkthrough:
  - lead: Revisar la entrada modelada.
    text_md: El diagrama modela un cliente MCP con el marcador no operativo `[DEMO_IDENTITY_NOT_AUTHENTICATED]`.
      No se proporcionan ni utilizan credenciales. La entrada de `create_newsletter_subscriber_export`
      se representa como dato documental.
    figure:
      src: img/fig1.png
      caption: Revisión sintética de la entrada MCP; simulación no ejecutada.
  - lead: Revisar el límite de interpretación.
    text_md: El modelo contrasta la interpretación de shell sin validación con el manejo de argumentos
      explícitos. El marcador siguiente no es una entrada ejecutable y no se obtuvo una respuesta de interpretación.
    command: '[INPUT_VALIDATION_NOT_EXECUTED]'
  - lead: Revisar el límite de identidad modelado.
    text_md: El caso sintético ilustra cómo una sustitución de comandos podría revelar una identidad de
      servicio. DEMO_MCP_SERVICE es un marcador no operativo; no se obtuvo una respuesta de servidor.
    command: '[SHELL_INTERPRETATION_NOT_EXECUTED]'
    figure:
      src: img/fig2.png
      caption: Registro de identidad sintético, no una respuesta obtenida de un servidor.
  remediation_summary:
    short_md: Deshabilitar la herramienta `create_newsletter_subscriber_export` hasta reescribirla.
    medium_md: Reconstruir la exportación sobre `smtplib` con un vector de argumentos explícito y validación
      estricta de hostname en `domain_filter`.
    long_md: Adoptar un estándar de código seguro que prohíba `os.system` y `shell=True`, y añadir linting
      en CI (Bandit/Semgrep) para detectar la concatenación de shell antes del release.
- id: F2
  mode: machine
  title: DEMO-HOST-01
  host:
    ip: 192.0.2.20
    name: DEMO-HOST-01
    os: Windows Server 2019 (Build 17763)
  open_ports: 22 (OpenSSH), 135/139/445 (SMB), 5985 (WinRM)
  summary_md: |
    **DEMOSTRACIÓN SINTÉTICA. No se contactó ningún sistema ni se ejecutaron pruebas.**

    Un recurso compartido SMB con permiso de escritura permitió dejar un payload de tarea programada que se ejecutó como la cuenta de servicio, dando un shell inicial por WinRM. La escalada local de privilegios vino de una ruta de servicio sin comillas que apuntaba a un directorio escribible.
  phases:
  - name: Acceso inicial
    steps:
    - lead: Recurso SMB escribible.
      text_md: En la matriz ficticia de permisos, DEMO_SHARE asigna READ y WRITE al rol modelado. Se ilustra
        una condición de escritura innecesaria; no se utilizó un escáner ni una petición de red.
      command: '[PERMISSION_ENUMERATION_NOT_EXECUTED]'
      figure:
        src: img/fig3.png
        caption: Matriz sintética de permisos de DEMO-HOST-01; no es la salida de un escáner.
    - lead: Entrega del payload.
      text_md: Un recurso ficticio con escritura modela el riesgo de que un artefacto no confiable llegue
        a una tarea programada. No se generó, subió ni ejecutó ningún payload. DEMO_SERVICE_ACCOUNT solo
        es un marcador de rol.
      command: '[AUTHENTICATION_NOT_EXECUTED]'
  - name: Escalada de privilegios
    steps:
    - lead: Ruta de servicio sin comillas.
      text_md: El diagrama modela una ruta ejecutable sin comillas que atraviesa un directorio escribible.
        La revisión defensiva comprueba las comillas, los permisos del directorio y el límite de privilegios
        del servicio. No se colocó ningún archivo ni se reinició ningún servicio.
      command: '[SERVICE_PATH_REVIEW_NOT_EXECUTED]'
      figure:
        src: img/fig4.png
        caption: Modelo sintético de ruta de servicio; no se modificó ni ejecutó ningún servicio.
  proof:
  - name: local.txt
    value: SYNTHETIC_PROOF_F2_1_NOT_EXECUTED
  - name: proof.txt
    value: SYNTHETIC_PROOF_F2_2_NOT_EXECUTED
