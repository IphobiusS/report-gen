findings:
- id: F1
  mode: vuln
  title: OS Command Injection in MCP Server Newsletter Export Tool
  severity: critical
  cvss: '9.9'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H
  cwe: 'CWE-78: Improper Neutralization of Special Elements used in an OS Command'
  affected: mcp.demolab.example
  description_md: |
    **SYNTHETIC DEMONSTRATION. No system was contacted and no test was executed.**

    The MCP server exposes a tool named `create_newsletter_subscriber_export` that builds
    a subscriber list and hands it off to a mail delivery routine. The `domain_filter`
    parameter is concatenated straight into a shell command with no escaping or
    validation, so any shell metacharacter supplied by the caller is interpreted by the
    underlying `/bin/sh`. Because the tool is reachable by any authenticated MCP client,
    a low privileged user can run arbitrary operating system commands on the host.
  impact_md: |
    An attacker who can reach the MCP endpoint gains remote code execution as the
    `DEMO_MCP_SERVICE` service account. From there the whole application backend is exposed:
    reading application secrets and mail credentials, pivoting to internal services,
    and staging further escalation to root. This is a full compromise of the MCP host.
  remediation_md: |
    Never pass user input to a shell. Replace the shell out with a native mail library
    (`smtplib`) and an argument list, and reject any `domain_filter` value that is not a
    strict hostname. If a subprocess is unavoidable, use `subprocess.run([...])` with an
    explicit argument vector and `shell=False`.
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://owasp.org/www-community/attacks/Command_Injection
  walkthrough:
  - lead: Review the modeled input.
    text_md: The diagram models an MCP client with a non-operational identity marker `[DEMO_IDENTITY_NOT_AUTHENTICATED]`.
      No credentials are supplied or used. The `create_newsletter_subscriber_export` input is represented
      as documentary test data.
    figure:
      src: img/fig1.png
      caption: Synthetic MCP input review; simulation, not executed.
  - lead: Review the parsing boundary.
    text_md: The model contrasts unvalidated shell interpretation with explicit argument handling. The
      marker below is not an executable input and no parsing response was obtained.
    command: '[INPUT_VALIDATION_NOT_EXECUTED]'
  - lead: Review the modeled identity boundary.
    text_md: This synthetic case illustrates how command substitution could disclose a service identity.
      DEMO_MCP_SERVICE is a non-operational marker; no server response was acquired.
    command: '[SHELL_INTERPRETATION_NOT_EXECUTED]'
    figure:
      src: img/fig2.png
      caption: Synthetic identity record, not an acquired server response.
  remediation_summary:
    short_md: Disable the `create_newsletter_subscriber_export` tool until it is rewritten.
    medium_md: Rebuild the export path on `smtplib` with an explicit argument vector and strict hostname
      validation of `domain_filter`.
    long_md: Adopt a secure coding standard that bans `os.system` and `shell=True`, and add CI linting
      (Bandit/Semgrep) to catch shell concatenation before release.
- id: F2
  mode: machine
  title: DEMO-HOST-01
  host:
    ip: 192.0.2.20
    name: DEMO-HOST-01
    os: Windows Server 2019 (Build 17763)
  open_ports: 22 (OpenSSH), 135/139/445 (SMB), 5985 (WinRM)
  summary_md: |
    **SYNTHETIC DEMONSTRATION. No system was contacted and no test was executed.**

    A world writable SMB share allowed dropping a malicious scheduled task payload that ran as the service account, giving an initial WinRM shell. Local privilege escalation followed from an unquoted service path pointing into a writable directory.
  phases:
  - name: Initial Access
    steps:
    - lead: Writable SMB share.
      text_md: In the fictional permission matrix, DEMO_SHARE grants READ and WRITE to the modeled role.
        This illustrates an unnecessary-write condition; no scanner or network request was used.
      command: '[PERMISSION_ENUMERATION_NOT_EXECUTED]'
      figure:
        src: img/fig3.png
        caption: Synthetic permission matrix for DEMO-HOST-01; not a scanner result.
    - lead: Payload delivery.
      text_md: A fictional write-capable share models the risk of an untrusted artifact reaching a scheduled
        task. No payload was generated, uploaded or executed. DEMO_SERVICE_ACCOUNT is only a role marker.
      command: '[AUTHENTICATION_NOT_EXECUTED]'
  - name: Privilege Escalation
    steps:
    - lead: Unquoted service path.
      text_md: The diagram models an unquoted executable path that crosses a writable directory. The defensive
        review checks quoting, directory permissions and the service privilege boundary. No file was placed
        and no service was restarted.
      command: '[SERVICE_PATH_REVIEW_NOT_EXECUTED]'
      figure:
        src: img/fig4.png
        caption: Synthetic service-path model; no service was changed or executed.
  proof:
  - name: local.txt
    value: SYNTHETIC_PROOF_F2_1_NOT_EXECUTED
  - name: proof.txt
    value: SYNTHETIC_PROOF_F2_2_NOT_EXECUTED
