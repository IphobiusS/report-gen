report:
  sections:
  - key: confidentiality
  - key: contacts
  - key: executive_summary
    summary: Este documento ficticio demuestra cómo representar un hallazgo **crítico** de inyección de
      comandos en un servidor MCP. No se evaluó una organización real, no se contactó ningún host y no
      se obtuvo acceso a ningún sistema. La severidad y las recomendaciones pertenecen exclusivamente
      al caso sintético.
  - key: scope
    objectives: Modelar el riesgo de concatenar una entrada no validada en un comando de shell.
    assumptions: Ejemplo sin ejecución, datos personales ni credenciales operativas.
  - key: strategic_recommendations
    recommendations: |-
      1. Eliminar toda construcción de comandos por shell.
      2. Implementar validación estricta de entradas en el servidor MCP.
      3. Añadir linting de seguridad (Bandit/Semgrep) en CI.
  - key: findings_summary
  - key: findings
  - key: attack_narrative
    narrative: |-
      **Inventario documental simulado**

      El esquema contiene activos ficticios dentro de 192.0.2.0/24, un rango de documentación. No representa interfaces descubiertas ni un barrido ejecutado.

      ```text
      [NETWORK_ENUMERATION_NOT_EXECUTED]
      ```

      ![Inventario sintético de DEMO-DC-01, DEMO-DC-02 y DEMO-APP-01; no ejecutado.](img/fig1.png){width="auto"}

      **Límite de autenticación modelado**

      La posible transferencia de autenticación se conserva como condición de revisión; no se suministran cuentas, contraseñas ni un comando operativo.

      ```text
      [AUTHENTICATION_NOT_EXECUTED]
      ```
  - key: remediation_plan
    short_term: Deshabilitar la herramienta vulnerable de exportación.
    medium_term: Reescribir el envío de correo con smtplib y vector de argumentos.
    long_term: Estándar de código seguro que prohíba os.system y shell=True.
  - key: appendix
    tools_used: nmap, smbmap, impacket, WinPEAS.
findings:
- id: F1
  mode: vuln
  title: Inyección de comandos en el servidor MCP
  severity: critical
  cvss: '9.9'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H
  cwe: CWE-78
  affected: mcp.demolab.example
  description_md: |-
    **DEMOSTRACIÓN SINTÉTICA. No se contactó ningún sistema ni se ejecutaron pruebas.**

    El parámetro `domain_filter` se concatena en un comando de shell sin validar.
  impact_md: Ejecución remota como `DEMO_MCP_SERVICE` y compromiso del backend.
  remediation_md: Usar `smtplib` y `subprocess.run([...])` con `shell=False`.
  walkthrough:
  - lead: Representar la condición de ejecución en el modelo.
    text_md: La identidad DEMO_MCP_SERVICE es un marcador del modelo, no la salida de un servidor real.
    command: '[SHELL_INTERPRETATION_NOT_EXECUTED]'
    figure:
      src: img/fig2.png
      caption: Registro sintético de DEMO_MCP_SERVICE; simulación sin ejecución.
  proof:
  - name: proof.txt
    value: SYNTHETIC_PROOF_F1_1_NOT_EXECUTED
