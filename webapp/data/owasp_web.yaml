# OWASP Top 10:2025 (web). Titulos e IDs oficiales; descripciones propias (parafraseadas).
# Fuente: https://owasp.org/Top10/2025/  (CC BY 3.0)
catalog: "OWASP Top 10:2025"
kind: web
items:
  - id: "A01:2025"
    name: "Broken Access Control"
    name_es: "Control de acceso roto"
    cwe: "CWE-284"
    summary: "Users can act outside their intended permissions. Includes IDOR, privilege escalation, and (as of 2025) Server-Side Request Forgery, which was folded into this category."
    summary_es: "Los usuarios pueden actuar fuera de los permisos previstos. Incluye IDOR, escalada de privilegios y, desde 2025, la falsificacion de peticiones del lado del servidor (SSRF), que se integro en esta categoria."
    ref: "https://owasp.org/Top10/2025/A01_2025-Broken_Access_Control/"
  - id: "A02:2025"
    name: "Security Misconfiguration"
    name_es: "Configuracion de seguridad incorrecta"
    cwe: "CWE-16"
    summary: "Insecure defaults, verbose errors, unnecessary features, and missing hardening across servers, frameworks, and cloud services."
    summary_es: "Valores por defecto inseguros, errores verbosos, funciones innecesarias y falta de endurecimiento en servidores, frameworks y servicios en la nube."
    ref: "https://owasp.org/Top10/2025/A02_2025-Security_Misconfiguration/"
  - id: "A03:2025"
    name: "Software Supply Chain Failures"
    name_es: "Fallas en la cadena de suministro de software"
    cwe: "CWE-1357"
    summary: "Compromises across dependencies, build systems, and distribution infrastructure. Broader than merely vulnerable or outdated components."
    summary_es: "Compromisos en dependencias, sistemas de compilacion e infraestructura de distribucion. Mas amplio que solo componentes vulnerables o desactualizados."
    ref: "https://owasp.org/Top10/2025/A03_2025-Software_Supply_Chain_Failures/"
  - id: "A04:2025"
    name: "Cryptographic Failures"
    name_es: "Fallas criptograficas"
    cwe: "CWE-310"
    summary: "Weak, misused, or missing cryptography that exposes sensitive data in transit or at rest."
    summary_es: "Criptografia debil, mal usada o ausente que expone datos sensibles en transito o en reposo."
    ref: "https://owasp.org/Top10/2025/A04_2025-Cryptographic_Failures/"
  - id: "A05:2025"
    name: "Injection"
    name_es: "Inyeccion"
    cwe: "CWE-74"
    summary: "Untrusted input is interpreted as code or query. Covers SQL injection, command injection, cross-site scripting, and similar."
    summary_es: "Entrada no confiable interpretada como codigo o consulta. Abarca inyeccion SQL, inyeccion de comandos, cross-site scripting y similares."
    ref: "https://owasp.org/Top10/2025/A05_2025-Injection/"
  - id: "A06:2025"
    name: "Insecure Design"
    name_es: "Diseno inseguro"
    cwe: "CWE-657"
    summary: "Missing or ineffective security controls at the design level, which implementation alone cannot fix."
    summary_es: "Controles de seguridad ausentes o inefectivos a nivel de diseno, que la implementacion por si sola no puede corregir."
    ref: "https://owasp.org/Top10/2025/A06_2025-Insecure_Design/"
  - id: "A07:2025"
    name: "Authentication Failures"
    name_es: "Fallas de autenticacion"
    cwe: "CWE-287"
    summary: "Weaknesses in identity and authentication such as credential stuffing, weak session management, and missing multi-factor authentication."
    summary_es: "Debilidades en identidad y autenticacion como credential stuffing, gestion debil de sesiones y falta de autenticacion multifactor."
    ref: "https://owasp.org/Top10/2025/A07_2025-Authentication_Failures/"
  - id: "A08:2025"
    name: "Software or Data Integrity Failures"
    name_es: "Fallas de integridad de software o datos"
    cwe: "CWE-345"
    summary: "Trusting code or data without verifying integrity. Includes insecure deserialization and unsigned or unverified updates."
    summary_es: "Confiar en codigo o datos sin verificar su integridad. Incluye deserializacion insegura y actualizaciones sin firmar o sin verificar."
    ref: "https://owasp.org/Top10/2025/A08_2025-Software_or_Data_Integrity_Failures/"
  - id: "A09:2025"
    name: "Security Logging and Alerting Failures"
    name_es: "Fallas de registro y alertas de seguridad"
    cwe: "CWE-778"
    summary: "Insufficient logging, detection, and alerting, which delays or prevents noticing and responding to attacks."
    summary_es: "Registro, deteccion y alertas insuficientes, lo que retrasa o impide detectar y responder a los ataques."
    ref: "https://owasp.org/Top10/2025/A09_2025-Security_Logging_and_Alerting_Failures/"
  - id: "A10:2025"
    name: "Mishandling of Exceptional Conditions"
    name_es: "Manejo incorrecto de condiciones excepcionales"
    cwe: "CWE-755"
    summary: "Improper error handling, failing open, and logic errors under abnormal conditions that expose the system or leak information."
    summary_es: "Manejo incorrecto de errores, fallar en modo abierto y errores logicos ante condiciones anormales que exponen el sistema o filtran informacion."
    ref: "https://owasp.org/Top10/2025/A10_2025-Mishandling_of_Exceptional_Conditions/"
