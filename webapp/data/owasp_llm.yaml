# OWASP Top 10 for LLM Applications 2025. Titulos e IDs oficiales; descripciones propias.
# Fuente: https://genai.owasp.org/  (OWASP GenAI Security Project)
catalog: "OWASP Top 10 for LLM Applications 2025"
kind: llm
items:
  - id: "LLM01:2025"
    name: "Prompt Injection"
    name_es: "Inyeccion de prompt"
    name_pt: "Injeção de prompt"
    cwe: "CWE-1427"
    summary: "Attacker input manipulates the model's instructions because data and instructions share one channel. Includes direct and indirect (via retrieved content) injection."
    summary_es: "La entrada del atacante manipula las instrucciones del modelo porque datos e instrucciones comparten un mismo canal. Incluye inyeccion directa e indirecta (via contenido recuperado)."
    summary_pt: "A entrada do atacante manipula as instruções do modelo porque dados e instruções compartilham o mesmo canal. Inclui injeção direta e indireta por conteúdo recuperado."
    ref: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"
  - id: "LLM02:2025"
    name: "Sensitive Information Disclosure"
    name_es: "Divulgacion de informacion sensible"
    name_pt: "Divulgação de informações sensíveis"
    cwe: ""
    summary: "The model or application exposes PII, credentials, or proprietary data through its outputs."
    summary_es: "El modelo o la aplicacion expone datos personales, credenciales o informacion propietaria a traves de sus salidas."
    summary_pt: "O modelo ou aplicativo expõe dados pessoais, credenciais ou informações proprietárias em suas saídas."
    ref: "https://genai.owasp.org/llmrisk/llm02-sensitive-information-disclosure/"
  - id: "LLM03:2025"
    name: "Supply Chain"
    name_es: "Cadena de suministro"
    name_pt: "Cadeia de suprimentos"
    cwe: ""
    summary: "Vulnerable or malicious third-party models, datasets, plugins, and packages introduce risk into the pipeline."
    summary_es: "Modelos, datasets, plugins y paquetes de terceros vulnerables o maliciosos introducen riesgo en el pipeline."
    summary_pt: "Modelos, conjuntos de dados, plugins e pacotes de terceiros vulneráveis ou maliciosos introduzem riscos no fluxo de processamento."
    ref: "https://genai.owasp.org/llmrisk/llm03-supply-chain/"
  - id: "LLM04:2025"
    name: "Data and Model Poisoning"
    name_es: "Envenenamiento de datos y del modelo"
    name_pt: "Envenenamento de dados e do modelo"
    cwe: ""
    summary: "Manipulated training, fine-tuning, or embedding data introduces backdoors, bias, or degraded behavior."
    summary_es: "Datos manipulados de entrenamiento, fine-tuning o embeddings introducen puertas traseras, sesgos o comportamiento degradado."
    summary_pt: "Dados manipulados de treinamento, ajuste fino ou embeddings introduzem portas dos fundos, vieses ou comportamento degradado."
    ref: "https://genai.owasp.org/llmrisk/llm04-data-and-model-poisoning/"
  - id: "LLM05:2025"
    name: "Improper Output Handling"
    name_es: "Manejo inadecuado de la salida"
    name_pt: "Tratamento inadequado da saída"
    cwe: ""
    summary: "Passing model output to downstream systems without validation enables injection, SSRF, or remote code execution."
    summary_es: "Pasar la salida del modelo a sistemas posteriores sin validacion habilita inyeccion, SSRF o ejecucion remota de codigo."
    summary_pt: "Enviar a saída do modelo a sistemas posteriores sem validação possibilita injeção, SSRF ou execução remota de código."
    ref: "https://genai.owasp.org/llmrisk/llm05-improper-output-handling/"
  - id: "LLM06:2025"
    name: "Excessive Agency"
    name_es: "Agencia excesiva"
    name_pt: "Autonomia excessiva"
    cwe: ""
    summary: "The system grants the model too much functionality, permission, or autonomy, so an influenced model can take harmful actions."
    summary_es: "El sistema otorga al modelo demasiada funcionalidad, permisos o autonomia, de modo que un modelo influenciado puede ejecutar acciones daninas."
    summary_pt: "O sistema concede funcionalidades, permissões ou autonomia em excesso ao modelo, permitindo ações prejudiciais quando ele é influenciado."
    ref: "https://genai.owasp.org/llmrisk/llm06-excessive-agency/"
  - id: "LLM07:2025"
    name: "System Prompt Leakage"
    name_es: "Fuga del prompt del sistema"
    name_pt: "Vazamento do prompt de sistema"
    cwe: ""
    summary: "System prompt content such as rules, secrets, or configuration is exposed or extracted."
    summary_es: "El contenido del prompt del sistema (reglas, secretos o configuracion) queda expuesto o es extraido."
    summary_pt: "O conteúdo do prompt de sistema, como regras, segredos ou configurações, é exposto ou extraído."
    ref: "https://genai.owasp.org/llmrisk/llm07-system-prompt-leakage/"
  - id: "LLM08:2025"
    name: "Vector and Embedding Weaknesses"
    name_es: "Debilidades de vectores y embeddings"
    name_pt: "Vulnerabilidades em vetores e embeddings"
    cwe: ""
    summary: "Weaknesses in RAG vector stores and embeddings: poisoning, cross-tenant leakage, and manipulated similarity results."
    summary_es: "Debilidades en los vector stores y embeddings de RAG: envenenamiento, fuga entre tenants y resultados de similitud manipulados."
    summary_pt: "Fraquezas em repositórios vetoriais e embeddings de RAG: envenenamento, vazamento entre clientes e resultados de similaridade manipulados."
    ref: "https://genai.owasp.org/llmrisk/llm08-vector-and-embedding-weaknesses/"
  - id: "LLM09:2025"
    name: "Misinformation"
    name_es: "Desinformacion"
    name_pt: "Desinformação"
    cwe: ""
    summary: "The model generates confident but false or fabricated information that users or systems then trust."
    summary_es: "El modelo genera informacion confiada pero falsa o inventada, en la que luego confian usuarios o sistemas."
    summary_pt: "O modelo gera informações apresentadas com confiança, mas falsas ou inventadas, nas quais usuários ou sistemas passam a confiar."
    ref: "https://genai.owasp.org/llmrisk/llm09-misinformation/"
  - id: "LLM10:2025"
    name: "Unbounded Consumption"
    name_es: "Consumo sin limites"
    name_pt: "Consumo sem limites"
    cwe: ""
    summary: "Uncontrolled resource use in compute, tokens, or cost, leading to denial of service or wallet abuse."
    summary_es: "Uso descontrolado de recursos en computo, tokens o costo, que provoca denegacion de servicio o abuso de billetera."
    summary_pt: "Uso descontrolado de recursos de computação, tokens ou custos, causando negação de serviço ou abuso de gastos."
    ref: "https://genai.owasp.org/llmrisk/llm10-unbounded-consumption/"
